---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  # No workflow_dispatch: a manual run happens on the default branch,
  # which would hand this job a cache token with write access to the
  # default-branch scope while it runs the local action against
  # third-party fixture repositories, letting that untrusted code
  # poison caches later runs restore (CWE-349). The fixtures stay
  # pinned to explicit commit SHAs, which is what bounds the same
  # exposure on the push trigger below.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test SBOM generation against real projects ###
  test-projects:
    name: "Test: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Go fixture (test-go-project)"
            repository: "lfreleng-actions/test-go-project"
            ref: "a77c5ec773edc266ddcc3c1d1c306e7bb3f12c30"
            path_prefix: "test-project"
          - name: "Node fixture (test-node-project)"
            repository: "lfreleng-actions/test-node-project"
            ref: "89cc7f156c88afa1855087b00ac0dce886e7b0f3"
            path_prefix: "test-project"
          - name: "Go monorepo module (onap/multicloud-k8s)"
            repository: "onap/multicloud-k8s"
            ref: "5c3b1a96811024e65b0977305b6d6737a6e2d453"
            path_prefix: "test-project/src/k8splugin"
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@ec0736244fc776e326283c6af6840e30f316f63c' # v0.16.1

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Checkout test project: ${{ matrix.repository }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: test-project
          persist-credentials: false

      - name: "Running local action: ${{ github.repository }}"
        id: sbom
        uses: $/
        with:
          path_prefix: ${{ matrix.path_prefix }}

      - name: "Verify SBOM outputs"
        shell: bash
        env:
          SBOM_JSON_PATH: ${{ steps.sbom.outputs.sbom_json_path }}
          SBOM_XML_PATH: ${{ steps.sbom.outputs.sbom_xml_path }}
          COMPONENT_COUNT: ${{ steps.sbom.outputs.component_count }}
          BACKEND: ${{ steps.sbom.outputs.backend }}
          # yamllint disable-line rule:line-length
          DEPENDENCY_MANAGER: ${{ steps.sbom.outputs.dependency_manager }}
        run: |
          # Verify SBOM outputs
          errors=0
          if [ ! -f "${SBOM_JSON_PATH}" ]; then
            echo "JSON SBOM not found: ${SBOM_JSON_PATH} ❌"
            errors=1
          fi
          if [ ! -f "${SBOM_XML_PATH}" ]; then
            echo "XML SBOM not found: ${SBOM_XML_PATH} ❌"
            errors=1
          fi
          if ! jq -e '.bomFormat == "CycloneDX"' \
            "${SBOM_JSON_PATH}" > /dev/null; then
            echo "JSON SBOM is not CycloneDX ❌"
            errors=1
          fi
          if [ -z "${COMPONENT_COUNT}" ] || \
            [ "${COMPONENT_COUNT}" -lt 1 ]; then
            echo "Component count not positive: ${COMPONENT_COUNT} ❌"
            errors=1
          fi
          if [ "${BACKEND}" != "syft" ]; then
            echo "Unexpected backend output: ${BACKEND} ❌"
            errors=1
          fi
          # syft is ecosystem-agnostic and drives no build tool, so the
          # dependency_manager output stays empty rather than guessing
          if [ -n "${DEPENDENCY_MANAGER}" ]; then
            echo "syft reported a build tool: ${DEPENDENCY_MANAGER} ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "SBOM verification failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "SBOM verified: ${COMPONENT_COUNT} components ✅"
          echo "SBOM verified: ${COMPONENT_COUNT} components ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Test format selection, scoping and output placement ###
  test-options:
    name: "Test: formats, scoping and output options"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@ec0736244fc776e326283c6af6840e30f316f63c' # v0.16.1

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Checkout test project: lfreleng-actions/test-node-project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfreleng-actions/test-node-project
          ref: 89cc7f156c88afa1855087b00ac0dce886e7b0f3
          path: test-project
          persist-credentials: false

      - name: "Running local action: JSON only, custom placement"
        id: json-only
        uses: $/
        with:
          path_prefix: test-project
          sbom_format: json
          filename_prefix: custom-sbom
          output_directory: sbom-output

      - name: "Running local action: XML only"
        id: xml-only
        uses: $/
        with:
          path_prefix: test-project
          sbom_format: xml

      - name: "Running local action: development dependencies"
        id: with-dev
        uses: $/
        with:
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-with-dev
          include_dev: 'true'

      - name: "Verify format selection and scoping behaviour"
        shell: bash
        env:
          JSON_ONLY_JSON: ${{ steps.json-only.outputs.sbom_json_path }}
          JSON_ONLY_XML: ${{ steps.json-only.outputs.sbom_xml_path }}
          JSON_ONLY_COUNT: ${{ steps.json-only.outputs.component_count }}
          XML_ONLY_JSON: ${{ steps.xml-only.outputs.sbom_json_path }}
          XML_ONLY_XML: ${{ steps.xml-only.outputs.sbom_xml_path }}
          WITH_DEV_COUNT: ${{ steps.with-dev.outputs.component_count }}
        run: |
          # Verify format selection and scoping behaviour
          errors=0
          if [ ! -f "${JSON_ONLY_JSON}" ]; then
            echo "JSON-only run: JSON SBOM missing ❌"
            errors=1
          fi
          case "${JSON_ONLY_JSON}" in
            */sbom-output/custom-sbom.json) ;;
            *)
              echo "Custom placement not honoured: ${JSON_ONLY_JSON} ❌"
              errors=1 ;;
          esac
          if [ -n "${JSON_ONLY_XML}" ]; then
            echo "JSON-only run: unexpected XML output path ❌"
            errors=1
          fi
          if [ -n "${XML_ONLY_JSON}" ]; then
            echo "XML-only run: unexpected JSON output path ❌"
            errors=1
          fi
          if [ ! -f "${XML_ONLY_XML}" ]; then
            echo "XML-only run: XML SBOM missing ❌"
            errors=1
          fi
          # Development dependency scoping must add components for the
          # node fixture, which declares devDependencies
          if [ "${WITH_DEV_COUNT}" -le "${JSON_ONLY_COUNT}" ]; then
            echo "Dev scoping made no difference ❌"
            echo "Production: ${JSON_ONLY_COUNT} components"
            echo "With dev: ${WITH_DEV_COUNT} components"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Options verification failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Formats, scoping and placement verified ✅"
          {
            echo "Formats, scoping and placement verified ✅"
            echo "Production components: ${JSON_ONLY_COUNT}"
            echo "With development components: ${WITH_DEV_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

  ### Test image mode against real docker archives ###
  # Image mode's filenames are a contract with the archive producer
  # (docker-save-images-action, per-image mode) and the Grype job in
  # docker-workflows, so this job uses the real producer and the same
  # artifact round trip the lanes do, then holds the documents to the
  # inline step image mode replaces. See
  # lfreleng-actions/docker-workflows#35.
  test-image-mode:
    name: "Test: image mode"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@ec0736244fc776e326283c6af6840e30f316f63c' # v0.16.1

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two images: an Alpine one with OS packages and an npm package,
      # and a scratch one with the npm package alone. The references
      # carry '/' and ':' so the producer's filename mapping is
      # exercised. The base is pinned by index digest so the component
      # set cannot drift under the test.
      - name: "Build fixture images"
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          BASE_IMAGE: 'alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
        run: |
          # Build fixture images
          context="${RUNNER_TEMP}/image-fixture"
          mkdir -p "${context}"
          printf '%s\n' '{"name":"left-pad","version":"1.3.0"}' \
            > "${context}/package.json"
          {
            echo "FROM ${BASE_IMAGE}"
            echo 'COPY package.json /usr/lib/node_modules/left-pad/'
          } > "${context}/Dockerfile"
          {
            echo 'FROM scratch'
            echo 'COPY package.json /usr/lib/node_modules/left-pad/'
          } > "${context}/Dockerfile.scratch"
          docker build -q -t sbom-action-test/fixture:ci "${context}"
          docker build -q -t sbom-action-test-scratch:ci \
            -f "${context}/Dockerfile.scratch" "${context}"
          # A combined archive breaks the one-image rule, for the
          # failure case below
          mkdir -p "${RUNNER_TEMP}/combined"
          docker save sbom-action-test/fixture:ci \
            sbom-action-test-scratch:ci \
            -o "${RUNNER_TEMP}/combined/both.tar"
          mkdir -p "${RUNNER_TEMP}/empty"
          # One directory per remaining contract breach, each built
          # from an otherwise valid single-image archive
          single="${RUNNER_TEMP}/single.tar"
          docker save sbom-action-test-scratch:ci -o "${single}"
          mkdir -p "${RUNNER_TEMP}/bad-label" "${RUNNER_TEMP}/bad-link" \
            "${RUNNER_TEMP}/bad-archive" "${RUNNER_TEMP}/bad-ref"
          cp "${single}" "${RUNNER_TEMP}/bad-label/bad+label.tar"
          mkdir -p "${RUNNER_TEMP}/dot-archive"
          cp "${single}" "${RUNNER_TEMP}/dot-archive/.dotted.tar"
          ln -s "${single}" "${RUNNER_TEMP}/bad-link/link.tar"
          tar -cf "${RUNNER_TEMP}/bad-archive/plain.tar" \
            -C "${context}" package.json
          unpacked="${RUNNER_TEMP}/bad-ref-unpacked"
          mkdir -p "${unpacked}"
          tar -xf "${single}" -C "${unpacked}"
          jq '.[0].RepoTags = ["bad ref;x:1"]' "${unpacked}/manifest.json" \
            > "${RUNNER_TEMP}/bad-ref-manifest.json"
          mv "${RUNNER_TEMP}/bad-ref-manifest.json" \
            "${unpacked}/manifest.json"
          # Members named without a leading ./, as docker save writes
          (cd "${unpacked}" && tar -cf "${RUNNER_TEMP}/bad-ref/ref.tar" -- *)
          # Plain characters only, but no repository name: Docker's
          # reference grammar rejects it
          mkdir -p "${RUNNER_TEMP}/bad-grammar"
          jq '.[0].RepoTags = [":justtag"]' "${unpacked}/manifest.json" \
            > "${RUNNER_TEMP}/bad-grammar-manifest.json"
          mv "${RUNNER_TEMP}/bad-grammar-manifest.json" \
            "${unpacked}/manifest.json"
          (cd "${unpacked}" && \
            tar -cf "${RUNNER_TEMP}/bad-grammar/grammar.tar" -- *)
          # A valid first tag must not hide an invalid second one
          mkdir -p "${RUNNER_TEMP}/bad-tags"
          jq '.[0].RepoTags = ["sbom-action-test-scratch:ci", ":bad"]' \
            "${unpacked}/manifest.json" \
            > "${RUNNER_TEMP}/bad-tags-manifest.json"
          mv "${RUNNER_TEMP}/bad-tags-manifest.json" \
            "${unpacked}/manifest.json"
          (cd "${unpacked}" && \
            tar -cf "${RUNNER_TEMP}/bad-tags/tags.tar" -- *)
          # A manifest naming a config the archive does not hold
          mkdir -p "${RUNNER_TEMP}/bad-structure"
          jq '.[0].RepoTags = ["sbom-action-test-scratch:ci"]
            | .[0].Config = "missing.json"' \
            "${unpacked}/manifest.json" \
            > "${RUNNER_TEMP}/bad-structure-manifest.json"
          mv "${RUNNER_TEMP}/bad-structure-manifest.json" \
            "${unpacked}/manifest.json"
          (cd "${unpacked}" && \
            tar -cf "${RUNNER_TEMP}/bad-structure/structure.tar" -- *)
          # A file at the manifest destination that is not this
          # action's manifest: an empty array, and an array that
          # merely names a label and an archive
          mkdir -p sbom-guard-empty sbom-guard-lookalike
          echo '[]' > sbom-guard-empty/sbom-cyclonedx.manifest.json
          echo '[{"label":"x","archive":"x.tar"}]' \
            > sbom-guard-lookalike/sbom-cyclonedx.manifest.json

      - name: "Save images with docker-save-images-action"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-save-images-action@fd148182fc22be846b343f92404f4104d8d049f1 # v0.2.0
        with:
          # yamllint disable-line rule:line-length
          docker-artifacts-to-save: 'sbom-action-test/fixture:ci sbom-action-test-scratch:ci'
          mode: 'per-image'
          artifact-name: 'sbom-action-image-archives'
          output-directory: 'docker-archives'
          retention-days: '1'

      # The lanes download the archives in a separate job, so the test
      # does too, landing them under RUNNER_TEMP outside the checkout
      - name: "Download the archives as a lane would"
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: 'sbom-action-image-archives'
          path: ${{ runner.temp }}/docker-archives

      - name: "Running local action: image mode, as the lanes use it"
        id: image
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          sbom_format: json
          output_directory: sbom-lane

      - name: "Running local action: image mode, both formats"
        id: image-both
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          filename_prefix: image-sbom
          output_directory: ${{ runner.temp }}/sbom-both

      - name: "Running local action: combined archive"
        id: image-combined
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/combined
          output_directory: sbom-combined

      - name: "Running local action: no archives (hard fail)"
        id: image-empty-hard
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/empty
          output_directory: sbom-empty

      - name: "Running local action: no archives (soft fail)"
        id: image-empty-soft
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/empty
          output_directory: sbom-empty
          fail_on_error: 'false'

      # Contract breaches fail regardless of fail_on_error, so each
      # runs with it relaxed
      - name: "Running local action: unsafe archive name"
        id: image-bad-label
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-label
          output_directory: sbom-bad-label
          fail_on_error: 'false'

      - name: "Running local action: symlinked archive"
        id: image-bad-link
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-link
          output_directory: sbom-bad-link
          fail_on_error: 'false'

      - name: "Running local action: not a docker archive"
        id: image-bad-archive
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-archive
          output_directory: sbom-bad-archive
          fail_on_error: 'false'

      - name: "Running local action: malformed image reference"
        id: image-bad-ref
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-ref
          output_directory: sbom-bad-ref
          fail_on_error: 'false'

      - name: "Running local action: reference outside the grammar"
        id: image-bad-grammar
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-grammar
          output_directory: sbom-bad-grammar
          fail_on_error: 'false'

      - name: "Running local action: invalid second tag"
        id: image-bad-tags
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-tags
          output_directory: sbom-bad-tags
          fail_on_error: 'false'

      - name: "Running local action: incomplete docker archive"
        id: image-bad-structure
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-structure
          output_directory: sbom-bad-structure
          fail_on_error: 'false'

      # Every *.tar counts, dot-prefixed names included
      - name: "Running local action: dot-prefixed archive"
        id: image-dot-archive
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/dot-archive
          sbom_format: json
          output_directory: sbom-dot

      - name: "Running local action: combined archive (soft fail)"
        id: image-combined-soft
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/combined
          output_directory: sbom-combined
          fail_on_error: 'false'

      # artifact_paths lines are upload-artifact globs
      - name: "Running local action: glob syntax in output directory"
        id: image-glob-output
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          output_directory: sbom-[glob]

      # upload-artifact skips hidden files by default
      - name: "Running local action: hidden filename prefix"
        id: image-hidden-prefix
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          filename_prefix: .sbom
          output_directory: sbom-hidden

      - name: "Running local action: empty array at the manifest path"
        id: image-guard-empty
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          output_directory: sbom-guard-empty

      - name: "Running local action: lookalike at the manifest path"
        id: image-guard-lookalike
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          output_directory: sbom-guard-lookalike

      # Image mode never reads path_prefix, so a missing one is no
      # error; and a second run must recognise and replace its own
      # manifest and documents
      - name: "Running local action: image mode again, stale path_prefix"
        id: image-rerun
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          sbom_format: json
          output_directory: sbom-lane
          path_prefix: no-such-directory

      # The reference image mode replaces: the docker-workflows lanes'
      # inline step, reduced to its scan. Same pinned installer, so the
      # same syft.
      - name: "Install syft for the inline reference"
        id: syft
        # yamllint disable-line rule:line-length
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: "Generate the inline reference SBOMs"
        shell: bash
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          # Generate the inline reference SBOMs
          mkdir -p sbom-inline
          for archive in "${RUNNER_TEMP}"/docker-archives/*.tar; do
            base=$(basename "${archive}" .tar)
            "${SYFT_CMD}" scan "docker-archive:${archive}" -q \
              -o "cyclonedx-json=sbom-inline/sbom-cyclonedx-${base}.json"
          done

      - name: "Verify the image mode contract"
        shell: bash
        env:
          IMAGE_COUNT: ${{ steps.image.outputs.image_count }}
          COMPONENT_COUNT: ${{ steps.image.outputs.component_count }}
          SBOMS_JSON: ${{ steps.image.outputs.sboms_json }}
          MANIFEST_PATH: ${{ steps.image.outputs.manifest_path }}
          ARTIFACT_PATHS: ${{ steps.image.outputs.artifact_paths }}
          SBOM_JSON_PATH: ${{ steps.image.outputs.sbom_json_path }}
          SKIPPED: ${{ steps.image.outputs.skipped }}
          BOTH_SBOMS_JSON: ${{ steps.image-both.outputs.sboms_json }}
          # yamllint disable-line rule:line-length
          BOTH_MANIFEST_PATH: ${{ steps.image-both.outputs.manifest_path }}
          COMBINED_OUTCOME: ${{ steps.image-combined.outcome }}
          EMPTY_HARD_OUTCOME: ${{ steps.image-empty-hard.outcome }}
          EMPTY_SOFT_OUTCOME: ${{ steps.image-empty-soft.outcome }}
          # yamllint disable-line rule:line-length
          EMPTY_SOFT_IMAGES: ${{ steps.image-empty-soft.outputs.image_count }}
          # yamllint disable-line rule:line-length
          EMPTY_SOFT_SBOMS: ${{ steps.image-empty-soft.outputs.sboms_json }}
          BAD_LABEL_OUTCOME: ${{ steps.image-bad-label.outcome }}
          BAD_LINK_OUTCOME: ${{ steps.image-bad-link.outcome }}
          BAD_ARCHIVE_OUTCOME: ${{ steps.image-bad-archive.outcome }}
          BAD_REF_OUTCOME: ${{ steps.image-bad-ref.outcome }}
          BAD_GRAMMAR_OUTCOME: ${{ steps.image-bad-grammar.outcome }}
          BAD_TAGS_OUTCOME: ${{ steps.image-bad-tags.outcome }}
          # yamllint disable-line rule:line-length
          BAD_STRUCTURE_OUTCOME: ${{ steps.image-bad-structure.outcome }}
          # yamllint disable-line rule:line-length
          COMBINED_SOFT_OUTCOME: ${{ steps.image-combined-soft.outcome }}
          GLOB_OUTPUT_OUTCOME: ${{ steps.image-glob-output.outcome }}
          HIDDEN_PREFIX_OUTCOME: ${{ steps.image-hidden-prefix.outcome }}
          DOT_IMAGES: ${{ steps.image-dot-archive.outputs.image_count }}
          GUARD_EMPTY_OUTCOME: ${{ steps.image-guard-empty.outcome }}
          # yamllint disable-line rule:line-length
          GUARD_LOOKALIKE_OUTCOME: ${{ steps.image-guard-lookalike.outcome }}
          RERUN_OUTCOME: ${{ steps.image-rerun.outcome }}
          RERUN_SBOMS_JSON: ${{ steps.image-rerun.outputs.sboms_json }}
        run: |
          # Verify the image mode contract
          errors=0
          fail() {
            echo "$1 ❌"
            errors=1
          }
          lane="${GITHUB_WORKSPACE}/sbom-lane"
          fixture="sbom-action-test_fixture_ci"
          scratch="sbom-action-test-scratch_ci"

          [ "${IMAGE_COUNT}" = "2" ] || \
            fail "image_count was '${IMAGE_COUNT}', wanted 2"
          [ "${SKIPPED}" = "false" ] || fail "skipped was '${SKIPPED}'"
          # There is no single document in image mode
          [ -z "${SBOM_JSON_PATH}" ] || fail "sbom_json_path was set"
          [ "${MANIFEST_PATH}" = "${lane}/sbom-cyclonedx.manifest.json" ] \
            || fail "manifest_path was '${MANIFEST_PATH}'"
          [ "$(jq -c . "${MANIFEST_PATH}")" = "${SBOMS_JSON}" ] || \
            fail "sboms_json differs from the manifest file"

          # The filenames the lanes and their Grype job depend on:
          # sbom-cyclonedx-<archive basename>.json, and nothing else
          # matching the glob the Grype job scans
          expected="sbom-cyclonedx-${scratch}.json"
          expected="${expected} sbom-cyclonedx-${fixture}.json"
          actual="$(cd "${lane}" && echo sbom-cyclonedx-*.json)"
          [ "${actual}" = "${expected}" ] || \
            fail "glob matched '${actual}', wanted '${expected}'"
          [ ! -e "${lane}/sbom-cyclonedx.json" ] || \
            fail "image mode wrote the directory-mode document"

          # One manifest entry per archive, in byte order, naming the
          # image recorded in the archive rather than one inferred
          # from the filename
          want="$(jq -nc --arg f "${fixture}" --arg s "${scratch}" '[
            {label: $s, image: "sbom-action-test-scratch:ci",
             archive: ($s + ".tar"),
             sbom_json: ("sbom-cyclonedx-" + $s + ".json")},
            {label: $f, image: "sbom-action-test/fixture:ci",
             archive: ($f + ".tar"),
             sbom_json: ("sbom-cyclonedx-" + $f + ".json")}]')"
          got="$(jq -c '[.[] | {label, image, archive, sbom_json}]' \
            "${MANIFEST_PATH}")"
          [ "${got}" = "${want}" ] || fail "manifest was ${got}"
          jq -e 'all(.[]; .format == "cyclonedx"
            and .spec_version == "1.5" and .sbom_xml == null)' \
            "${MANIFEST_PATH}" > /dev/null || \
            fail "manifest format fields are wrong"

          total=0
          while IFS=$'\t' read -r label image sbom count; do
            doc="${lane}/${sbom}"
            [ -f "${doc}" ] || { fail "${label}: ${sbom} missing"; continue; }
            [ "$(jq '.components | length' "${doc}")" = "${count}" ] || \
              fail "${label}: component_count disagrees with the document"
            [ "$(jq -r .specVersion "${doc}")" = "1.5" ] || \
              fail "${label}: wrong specVersion"
            # The document names the image, not the runner path
            [ "$(jq -r .metadata.component.name "${doc}")" = "${image}" ] \
              || fail "${label}: metadata.component.name is not ${image}"
            grep -qxF "${doc}" <<< "${ARTIFACT_PATHS}" || \
              fail "${label}: missing from artifact_paths"
            total=$((total + count))
          done < <(jq -r '.[] | [.label, .image, .sbom_json,
            .component_count] | @tsv' "${MANIFEST_PATH}")
          [ "${total}" = "${COMPONENT_COUNT}" ] || \
            fail "component_count ${COMPONENT_COUNT} is not the sum ${total}"
          grep -qxF "${MANIFEST_PATH}" <<< "${ARTIFACT_PATHS}" || \
            fail "artifact_paths omits the manifest"
          [ "$(grep -c . <<< "${ARTIFACT_PATHS}")" = "3" ] || \
            fail "artifact_paths does not list exactly three files"
          # The fixture image carries OS packages and the npm package
          jq -e '[.components[].name] | index("left-pad") and
            index("alpine-baselayout")' \
            "${lane}/sbom-cyclonedx-${fixture}.json" > /dev/null || \
            fail "fixture SBOM lacks the expected components"

          # Equivalence with the inline step it replaces: the same
          # components and dependency graph. Spec version and
          # document metadata differ by design. bom-refs are opaque
          # IDs, so the graph is compared with each one replaced by
          # the identity of the component it names (the document's
          # subject standing in as a fixed token) and edges sorted.
          ident='[.components[] | [.type, .name, (.version // ""),
            (.purl // "")] | join("|")] | sort'
          # jq variables, not shell ones
          # shellcheck disable=SC2016
          graph='def id: [.type, .name, (.version // ""), (.purl // "")]
              | join("|");
            (reduce (.components // [])[] as $c ({};
                .[$c["bom-ref"]] = ($c | id))
              + {(.metadata.component["bom-ref"] // ""): "(subject)"})
            as $names
            | [(.dependencies // [])[]
                | {ref: ($names[.ref] // .ref),
                   dependsOn: ([(.dependsOn // [])[]
                     | ($names[.] // .)] | sort)}]
            | sort'
          for label in "${fixture}" "${scratch}"; do
            new="${lane}/sbom-cyclonedx-${label}.json"
            old="sbom-inline/sbom-cyclonedx-${label}.json"
            [ "$(jq -c "${ident}" "${new}")" = \
              "$(jq -c "${ident}" "${old}")" ] || \
              fail "${label}: components differ from the inline step"
            [ "$(jq -c "${graph}" "${new}")" = \
              "$(jq -c "${graph}" "${old}")" ] || \
              fail "${label}: dependency graph differs from the inline step"
          done
          # Non-vacuous: the fixture's graph has edges to compare
          jq -e '[.dependencies[]?.dependsOn[]?] | length > 0' \
            "${lane}/sbom-cyclonedx-${fixture}.json" > /dev/null || \
            fail "fixture SBOM has no dependency edges to compare"

          # Both formats, custom prefix, output under RUNNER_TEMP
          jq -e 'length == 2 and all(.[];
            (.sbom_json | startswith("image-sbom-"))
            and (.sbom_xml | endswith(".xml")))' \
            <<< "${BOTH_SBOMS_JSON}" > /dev/null || \
            fail "both-format manifest is wrong: ${BOTH_SBOMS_JSON}"
          both_dir="$(dirname "${BOTH_MANIFEST_PATH}")"
          [ "${BOTH_MANIFEST_PATH}" = \
            "${both_dir}/image-sbom.manifest.json" ] || \
            fail "both-format manifest path is wrong"
          while IFS= read -r xml; do
            grep -q 'cyclonedx.org/schema/bom/1.5' "${both_dir}/${xml}" \
              || fail "${xml} is not a CycloneDX 1.5 XML document"
          done < <(jq -r '.[].sbom_xml' <<< "${BOTH_SBOMS_JSON}")

          # A combined archive must be refused, not described
          [ "${COMBINED_OUTCOME}" = "failure" ] || \
            fail "a combined archive was accepted"
          [ -z "$(ls -A sbom-combined 2> /dev/null)" ] || \
            fail "a combined archive left documents behind"
          # No archives is a generation failure honouring fail_on_error
          [ "${EMPTY_HARD_OUTCOME}" = "failure" ] || \
            fail "no archives did not fail"
          [ "${EMPTY_SOFT_OUTCOME}" = "success" ] || \
            fail "no archives ignored fail_on_error: false"
          if [ "${EMPTY_SOFT_IMAGES}" != "0" ] || \
            [ "${EMPTY_SOFT_SBOMS}" != "[]" ]; then
            fail "soft failure reported '${EMPTY_SOFT_IMAGES}' images"
          fi

          # Contract breaches fail even under fail_on_error: false,
          # and write nothing
          for case_outcome in \
            "bad-label:${BAD_LABEL_OUTCOME}" \
            "bad-link:${BAD_LINK_OUTCOME}" \
            "bad-archive:${BAD_ARCHIVE_OUTCOME}" \
            "bad-ref:${BAD_REF_OUTCOME}" \
            "bad-grammar:${BAD_GRAMMAR_OUTCOME}" \
            "bad-tags:${BAD_TAGS_OUTCOME}" \
            "bad-structure:${BAD_STRUCTURE_OUTCOME}" \
            "combined:${COMBINED_SOFT_OUTCOME}"; do
            name="${case_outcome%%:*}"
            [ "${case_outcome#*:}" = "failure" ] || \
              fail "${name}: accepted under fail_on_error: false"
            [ -z "$(ls -A "sbom-${name}" 2> /dev/null)" ] || \
              fail "${name}: left files behind"
          done
          # artifact_paths cannot carry glob syntax
          [ "${GLOB_OUTPUT_OUTCOME}" = "failure" ] || \
            fail "an output directory with glob syntax was accepted"
          [ "${HIDDEN_PREFIX_OUTCOME}" = "failure" ] || \
            fail "a hidden filename prefix was accepted"
          [ -z "$(ls -A sbom-hidden 2> /dev/null)" ] || \
            fail "a hidden filename prefix left files behind"
          if [ "${DOT_IMAGES}" != "1" ] || \
            [ ! -f sbom-dot/sbom-cyclonedx-.dotted.json ]; then
            fail "a dot-prefixed archive was not scanned"
          fi
          # A file at the manifest path that this action did not write
          # is refused and survives
          [ "${GUARD_EMPTY_OUTCOME}" = "failure" ] || \
            fail "an empty array at the manifest path was replaced"
          [ "$(cat sbom-guard-empty/sbom-cyclonedx.manifest.json)" = \
            "[]" ] || fail "the empty-array manifest lookalike changed"
          [ "${GUARD_LOOKALIKE_OUTCOME}" = "failure" ] || \
            fail "a manifest lookalike was replaced"
          jq -e '. == [{"label":"x","archive":"x.tar"}]' \
            sbom-guard-lookalike/sbom-cyclonedx.manifest.json \
            > /dev/null || fail "the manifest lookalike changed"
          # Its own manifest is recognised and replaced, and path_prefix
          # plays no part
          [ "${RERUN_OUTCOME}" = "success" ] || \
            fail "a rerun over its own output, path_prefix stale, failed"
          [ "${RERUN_SBOMS_JSON}" = "${SBOMS_JSON}" ] || \
            fail "the rerun manifest differs from the first run"
          ! compgen -G "${lane}/.[!.]*" > /dev/null || \
            fail "a temporary manifest was left in the output directory"

          if [ "${errors}" != "0" ]; then
            echo "Image mode verification failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Image mode contract verified: ${IMAGE_COUNT} images," \
            "${COMPONENT_COUNT} components ✅" | tee -a "$GITHUB_STEP_SUMMARY"

  ### Test the cyclonedx backend resolves a real dependency graph ###
  # The syft backend reads pom.xml as text, which for Maven is an input
  # to dependency resolution rather than a product of it: transitive
  # dependencies are invisible and BOM-managed versions come back as
  # UNKNOWN. This job asserts the cyclonedx backend recovers both.
  # See lfreleng-actions/java-workflows#47.
  test-cyclonedx-backend:
    name: "Test: cyclonedx backend"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@ec0736244fc776e326283c6af6840e30f316f63c' # v0.16.1

      # Block, like every other job here. Running a build tool that
      # resolves arbitrary plugins under unrestricted egress would make
      # this self-test an exfiltration surface, so this job is not
      # dropped to audit.
      #
      # No per-job endpoints: the shared allow-list carries Maven
      # Central and api.adoptium.net, which setup-java queries for
      # Temurin build metadata.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Multi-module reactor whose core module declares jackson-databind
      # at compile scope with no version of its own, supplied by an
      # imported jackson-bom. One declared coordinate, three resolved
      # components.
      - name: "Checkout test project: lfreleng-actions/test-maven-project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfreleng-actions/test-maven-project
          # yamllint disable-line rule:line-length
          ref: bf7b7ec62d40a04cffc8824cf691e6333972fcb1 # v0.1.0
          path: test-project
          persist-credentials: false

      - name: "Running local action: cyclonedx backend"
        id: cyclonedx
        uses: $/
        with:
          backend: cyclonedx
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-maven
          # This workflow runs on pull requests from a fork, so the
          # 'auto' default would skip. The override is correct here and
          # not a workaround: the checkout being scanned is
          # test-maven-project pinned to an immutable org-owned commit,
          # not the pull request's own content. The skip path is
          # covered separately below.
          untrusted_checkout: 'false'

      - name: "Running local action: cyclonedx backend with test scope"
        id: cyclonedx-dev
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-maven-dev
          include_dev: 'true'

      # The plugin cannot split formats across directories, so these two
      # runs exercise the backend-specific placement logic: 'both'
      # writes straight to the output directory, while 'xml' generates
      # both into a scratch directory and moves only the XML across.
      - name: "Running local action: cyclonedx backend, both formats"
        id: cyclonedx-both
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: both
          filename_prefix: sbom-maven-both
          output_directory: maven-both-out

      - name: "Running local action: cyclonedx backend, XML only"
        id: cyclonedx-xml
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: xml
          filename_prefix: sbom-maven-xml
          output_directory: maven-xml-out

      - name: "Running local action: maven_args override rejected"
        id: cyclonedx-args-override
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          maven_args: '-DoutputDirectory=/tmp/escape'

      # The plugin does not reject a schema version it cannot produce;
      # it silently falls back to its own default. Without the
      # post-generation check this run would report success over a
      # document carrying a different version than the one requested.
      - name: "Running local action: unsupported spec version"
        id: cyclonedx-bad-spec
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-maven-badspec
          sbom_spec_version: '9.9'

      - name: "Verify the resolved dependency graph"
        shell: bash
        env:
          CDX_JSON: ${{ steps.cyclonedx.outputs.sbom_json_path }}
          CDX_COUNT: ${{ steps.cyclonedx.outputs.component_count }}
          CDX_BACKEND: ${{ steps.cyclonedx.outputs.backend }}
          # yamllint disable-line rule:line-length
          CDX_MANAGER: ${{ steps.cyclonedx.outputs.dependency_manager }}
          DEV_JSON: ${{ steps.cyclonedx-dev.outputs.sbom_json_path }}
          DEV_COUNT: ${{ steps.cyclonedx-dev.outputs.component_count }}
          BOTH_JSON: ${{ steps.cyclonedx-both.outputs.sbom_json_path }}
          BOTH_XML: ${{ steps.cyclonedx-both.outputs.sbom_xml_path }}
          XML_ONLY_JSON: ${{ steps.cyclonedx-xml.outputs.sbom_json_path }}
          XML_ONLY_XML: ${{ steps.cyclonedx-xml.outputs.sbom_xml_path }}
          OVERRIDE_OUTCOME: ${{ steps.cyclonedx-args-override.outcome }}
          BAD_SPEC_OUTCOME: ${{ steps.cyclonedx-bad-spec.outcome }}
        run: |
          # Verify the resolved dependency graph
          errors=0
          if [ "${CDX_BACKEND}" != "cyclonedx" ]; then
            echo "Unexpected backend output: ${CDX_BACKEND} ❌"
            errors=1
          fi
          # The backend names the tool, not the build system, so the
          # build system has to surface separately or the caller cannot
          # tell which plugin ran
          if [ "${CDX_MANAGER}" != "maven" ]; then
            echo "Unexpected dependency_manager: ${CDX_MANAGER} ❌"
            errors=1
          fi
          if [ ! -f "${CDX_JSON}" ]; then
            echo "CycloneDX SBOM not found: ${CDX_JSON} ❌"
            exit 1
          fi
          if ! jq -e '.bomFormat == "CycloneDX"' \
            "${CDX_JSON}" > /dev/null; then
            echo "Generated document is not CycloneDX ❌"
            errors=1
          fi

          # Transitive resolution: jackson-core is declared nowhere in
          # the fixture's POMs and can only appear beneath
          # jackson-databind, so its presence proves the graph was
          # resolved rather than parsed
          for artifact in jackson-databind jackson-core; do
            if ! jq -e --arg name "${artifact}" \
              '[.components[] | select(.name == $name)] | length > 0' \
              "${CDX_JSON}" > /dev/null; then
              echo "Transitive component missing: ${artifact} ❌"
              errors=1
            fi
          done

          # BOM-managed version resolution: a component without a
          # usable version cannot be matched against a vulnerability
          # database, so it is silently unscannable
          unresolved=$(jq '[.components[]
            | select((.version // "") == "" or .version == "UNKNOWN")]
            | length' "${CDX_JSON}")
          if [ "${unresolved}" != "0" ]; then
            echo "Components with unresolved versions: ${unresolved} ❌"
            jq -r '.components[]
              | select((.version // "") == "" or .version == "UNKNOWN")
              | "  \(.name)"' "${CDX_JSON}"
            errors=1
          fi

          # The plugin emits the parent/child relationships syft does
          # not, which is what makes a finding traceable to the direct
          # dependency that pulled it in
          if ! jq -e '(.dependencies // []) | length > 0' \
            "${CDX_JSON}" > /dev/null; then
            echo "SBOM carries no dependency graph ❌"
            errors=1
          fi

          # Test scope stays out by default: test dependencies are
          # absent from the shipped artefact, so a BOM describing that
          # artefact must not list them
          if jq -e '[.components[]
            | select(.name == "junit-jupiter")] | length > 0' \
            "${CDX_JSON}" > /dev/null; then
            echo "Test-scope dependency present by default ❌"
            errors=1
          fi
          if ! jq -e '[.components[]
            | select(.name == "junit-jupiter")] | length > 0' \
            "${DEV_JSON}" > /dev/null; then
            echo "include_dev did not add test-scope dependencies ❌"
            errors=1
          fi
          if [ "${DEV_COUNT}" -le "${CDX_COUNT}" ]; then
            echo "Test scoping made no difference ❌"
            echo "Default: ${CDX_COUNT}, with test scope: ${DEV_COUNT}"
            errors=1
          fi

          # Format placement. 'both' writes both documents to the
          # output directory; 'xml' must leave the XML there and no
          # JSON, since a stray JSON would be collected by the
          # sbom-cyclonedx.* artifact glob the workflows rely on
          if [ ! -f "${BOTH_JSON}" ] || [ ! -f "${BOTH_XML}" ]; then
            echo "Both-format run did not emit both documents ❌"
            errors=1
          fi
          if [ -n "${XML_ONLY_JSON}" ]; then
            echo "XML-only run: unexpected JSON output path ❌"
            errors=1
          fi
          if [ ! -f "${XML_ONLY_XML}" ]; then
            echo "XML-only run: XML SBOM missing ❌"
            errors=1
          fi
          if [ -n "$(find maven-xml-out -name '*.json' 2>/dev/null)" ]
          then
            echo "XML-only run left a JSON document behind ❌"
            errors=1
          fi

          # maven_args must not be able to redirect the output
          # directory away from the validated location
          if [ "${OVERRIDE_OUTCOME}" = "success" ]; then
            echo "Protected maven_args override was accepted ❌"
            errors=1
          fi
          if [ -e /tmp/escape ]; then
            echo "maven_args override escaped the output directory ❌"
            errors=1
          fi

          # A spec version the plugin cannot produce must fail rather
          # than yield a document quietly carrying a different one
          if [ "${BAD_SPEC_OUTCOME}" = "success" ]; then
            echo "Unsupported spec version reported success ❌"
            errors=1
          fi
          # ...and must leave nothing behind. The plugin writes a
          # well-formed BOM before the mismatch is detected, so without
          # cleanup on rejection the artifact glob would collect and
          # publish a document this action had already rejected
          if [ -n "$(find . -maxdepth 1 -name 'sbom-maven-badspec.*' \
            2>/dev/null)" ]; then
            echo "Rejected document left in the output directory ❌"
            find . -maxdepth 1 -name 'sbom-maven-badspec.*'
            errors=1
          fi

          if [ "${errors}" != "0" ]; then
            echo "CycloneDX backend verification failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "CycloneDX backend verified: ${CDX_COUNT} components ✅"
          {
            echo "CycloneDX backend verified ✅"
            echo "Shipped components: ${CDX_COUNT}"
            echo "With test scope: ${DEV_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"


  ### Test the cyclonedx backend against Gradle ###
  # Gradle is worse off than Maven before this backend: syft catalogs
  # gradle.lockfile and nothing else, and dependency locking is opt-in,
  # so a typical Gradle project yields no third-party components at all
  # rather than a partial graph. Measured against the fixture below,
  # syft finds zero where this backend finds six.
  # See lfreleng-actions/java-workflows#48.
  test-cyclonedx-gradle:
    name: "Test: cyclonedx backend (Gradle)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@ec0736244fc776e326283c6af6840e30f316f63c' # v0.16.1

      # Block, as everywhere else here. The shared allow-list carries
      # Maven Central, api.adoptium.net, services.gradle.org for the
      # wrapper distribution, and plugins.gradle.org for the plugin
      # itself, which resolves from the portal rather than Central.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Multi-project reactor whose core module declares jackson-databind
      # with no version of its own, supplied by an imported platform.
      # One declared coordinate, three resolved components, and the root
      # is Groovy DSL while app is Kotlin DSL, so both dialects are
      # exercised by one build.
      - name: "Checkout test project: lfreleng-actions/test-gradle-project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfreleng-actions/test-gradle-project
          # yamllint disable-line rule:line-length
          ref: ad91147966624cff011fd98dd5f1b4ed24429e60 # v0.0.1
          path: test-project
          persist-credentials: false

      - name: "Running local action: Gradle, detected"
        id: gradle
        uses: $/
        with:
          backend: cyclonedx
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-gradle
          # As in the Maven job: the tree being scanned is an immutable
          # org-owned commit, not this pull request's content.
          untrusted_checkout: 'false'

      # The same project with the build tool declared rather than
      # detected, which is how java-workflows calls this action: the
      # lane already knows, so it does not ask.
      - name: "Running local action: Gradle, declared"
        id: gradle-declared
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          dependency_manager: gradle
          path_prefix: test-project
          sbom_format: both
          filename_prefix: sbom-gradle-declared
          output_directory: gradle-both-out

      - name: "Running local action: Gradle with test configurations"
        id: gradle-dev
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-gradle-dev
          include_dev: 'true'

      # Below the plugin's floor the action skips rather than fails: an
      # SBOM audit is not essential to a build, and failing a pipeline
      # over a plugin's declared dependency would punish a project for
      # something unrelated to its code.
      - name: "Running local action: Gradle below the plugin floor"
        id: gradle-too-old
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-gradle-old
          gradle_version: '8.0'

      - name: "Running local action: gradle_args escape rejected"
        id: gradle-args-escape
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          gradle_args: '-p /tmp/escape'

      - name: "Running local action: gradle_args override rejected"
        id: gradle-args-override
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          gradle_args: '-DsbomAction.configs=everything'

      # Declaring a build tool the checkout does not carry is a caller
      # error, not something to paper over: the backend would drive a
      # tool this project does not use.
      - name: "Running local action: wrong build tool declared"
        id: gradle-wrong-tool
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          dependency_manager: maven
          path_prefix: test-project

      - name: "Verify the resolved Gradle dependency graph"
        shell: bash
        env:
          GRADLE_JSON: ${{ steps.gradle.outputs.sbom_json_path }}
          GRADLE_COUNT: ${{ steps.gradle.outputs.component_count }}
          # yamllint disable-line rule:line-length
          GRADLE_MANAGER: ${{ steps.gradle.outputs.dependency_manager }}
          GRADLE_BACKEND: ${{ steps.gradle.outputs.backend }}
          # yamllint disable-line rule:line-length
          DECLARED_JSON: ${{ steps.gradle-declared.outputs.sbom_json_path }}
          # yamllint disable-line rule:line-length
          DECLARED_XML: ${{ steps.gradle-declared.outputs.sbom_xml_path }}
          DEV_COUNT: ${{ steps.gradle-dev.outputs.component_count }}
          OLD_SKIPPED: ${{ steps.gradle-too-old.outputs.skipped }}
          OLD_COUNT: ${{ steps.gradle-too-old.outputs.component_count }}
          # yamllint disable-line rule:line-length
          ESCAPE_OUTCOME: ${{ steps.gradle-args-escape.outcome }}
          # yamllint disable-line rule:line-length
          OVERRIDE_OUTCOME: ${{ steps.gradle-args-override.outcome }}
          # yamllint disable-line rule:line-length
          WRONG_TOOL_OUTCOME: ${{ steps.gradle-wrong-tool.outcome }}
          PROJECT_DIR: test-project
        run: |
          # Verify the Gradle path of the cyclonedx backend
          failures=0
          fail() {
            # Reads $* rather than $1: several call sites split their
            # message across arguments to stay inside the line limit,
            # and reading only the first would report half of it.
            echo "::error::$*"
            failures=$((failures + 1))
          }

          [ "${GRADLE_BACKEND}" = "cyclonedx" ] || \
            fail "backend output was '${GRADLE_BACKEND}'"
          [ "${GRADLE_MANAGER}" = "gradle" ] || \
            fail "dependency_manager was '${GRADLE_MANAGER}'"

          # The declared coordinate carries no version of its own, so a
          # generator reading the build script as text cannot resolve
          # it. Asserting the versions, not merely the names, is what
          # separates a resolved graph from a parsed one.
          for coord in \
            "com.fasterxml.jackson.core:jackson-databind:2.22.2" \
            "com.fasterxml.jackson.core:jackson-core:2.22.2" \
            "com.fasterxml.jackson.core:jackson-annotations:2.22"; do
            group="${coord%%:*}"
            rest="${coord#*:}"
            name="${rest%%:*}"
            version="${rest#*:}"
            if ! jq -e --arg g "${group}" --arg n "${name}" \
              --arg v "${version}" '
              [.components[]? | select(.group == $g and .name == $n
                and .version == $v)] | length > 0
            ' "${GRADLE_JSON}" >/dev/null; then
              fail "missing resolved component ${coord}"
            fi
          done

          # jackson-annotations resolves to 2.22 while the others resolve
          # to 2.22.2, so a generator cannot fake the graph by copying
          # one version across every entry.
          if ! jq -e '
            [.components[]? | select(.group | startswith("com.fasterxml"))
              | .version] | unique | length > 1
          ' "${GRADLE_JSON}" >/dev/null; then
            fail "every jackson component carries the same version"
          fi

          # No component may carry an unresolved version: that is the
          # exact failure mode this backend exists to remove.
          if jq -e '
            [.components[]? | select((.version // "") == ""
              or .version == "UNKNOWN")] | length > 0
          ' "${GRADLE_JSON}" >/dev/null; then
            fail "a component carries an empty or UNKNOWN version"
          fi

          # Including test configurations must widen the graph, or
          # include_dev is not reaching the plugin.
          if [ "${DEV_COUNT}" -le "${GRADLE_COUNT}" ]; then
            fail "include_dev did not widen the graph" \
              "(${DEV_COUNT} vs ${GRADLE_COUNT})"
          fi

          # Declaring the build tool must produce the same graph as
          # detecting it.
          declared_count="$(jq '[.components[]?] | length' "${DECLARED_JSON}")"
          if [ "${declared_count}" != "${GRADLE_COUNT}" ]; then
            fail "declared run found ${declared_count}," \
              "detected found ${GRADLE_COUNT}"
          fi
          [ -f "${DECLARED_XML}" ] || fail "both-format run wrote no XML"

          # Below the floor: skipped, with no document and no count.
          [ "${OLD_SKIPPED}" = "true" ] || \
            fail "an unsupported Gradle version was not skipped"
          [ -z "${OLD_COUNT}" ] || \
            fail "a skipped run reported a component count"

          for check in "ESCAPE_OUTCOME:${ESCAPE_OUTCOME}" \
            "OVERRIDE_OUTCOME:${OVERRIDE_OUTCOME}" \
            "WRONG_TOOL_OUTCOME:${WRONG_TOOL_OUTCOME}"; do
            if [ "${check#*:}" != "failure" ]; then
              fail "${check%%:*} was '${check#*:}', expected failure"
            fi
          done

          # The action drives the project's own build tool, so Gradle
          # creates build directories. What it must not do is leave its
          # own reports behind in them for an artifact glob to collect.
          strays="$(find "${PROJECT_DIR}" -path '*reports/cyclonedx*' \
            \( -name 'bom.json' -o -name 'bom.xml' \) | wc -l)"
          if [ "${strays}" != "0" ]; then
            fail "${strays} plugin reports left inside the checkout"
          fi

          if [ "${failures}" != "0" ]; then
            echo "Gradle backend verification failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Gradle backend verified: ${GRADLE_COUNT} components ✅"
          {
            echo "Gradle backend verified ✅"
            echo "Shipped components: ${GRADLE_COUNT}"
            echo "With test configurations: ${DEV_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

  ### Test invalid inputs fail closed ###
  test-failures:
    name: "Test: invalid inputs and error handling"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: '@ec0736244fc776e326283c6af6840e30f316f63c' # v0.16.1

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Running local action with unsupported backend"
        id: bad-backend
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx-npm

      - name: "Running local action with invalid format"
        id: bad-format
        continue-on-error: true
        uses: $/
        with:
          sbom_format: yaml

      - name: "Running local action with missing project directory"
        id: bad-path
        continue-on-error: true
        uses: $/
        with:
          path_prefix: does/not/exist

      - name: "Running local action with workspace-escaping path"
        id: escape-path
        continue-on-error: true
        uses: $/
        with:
          path_prefix: /etc

      - name: "Running local action with escaping output directory"
        id: escape-output
        continue-on-error: true
        uses: $/
        with:
          output_directory: /opt/escape-test

      - name: "Running local action with unsafe filename prefix"
        id: bad-prefix
        continue-on-error: true
        uses: $/
        with:
          filename_prefix: '../escape'

      # Image mode's own inputs. The archive directory is required in
      # that mode and refused outside it, so a forgotten mode cannot
      # quietly produce an SBOM of the workspace instead.
      - name: "Running local action with unsupported mode"
        id: bad-mode
        continue-on-error: true
        uses: $/
        with:
          mode: layers

      - name: "Running local action with image mode and no archives"
        id: image-no-directory
        continue-on-error: true
        uses: $/
        with:
          mode: image

      - name: "Running local action with an archive directory alone"
        id: directory-with-archives
        continue-on-error: true
        uses: $/
        with:
          image_archive_directory: '.'

      - name: "Running local action with image mode on cyclonedx"
        id: image-cyclonedx
        continue-on-error: true
        uses: $/
        with:
          mode: image
          backend: cyclonedx
          image_archive_directory: '.'

      - name: "Running local action with escaping archive directory"
        id: image-escape
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: /etc

      # The cyclonedx-backend inputs feed a Maven goal coordinate and
      # a setup-java invocation, so they get validated on every run
      # rather than only when that backend is selected
      - name: "Running local action with invalid java version"
        id: bad-java-version
        continue-on-error: true
        uses: $/
        with:
          java_version: '21; rm -rf /'

      - name: "Running local action with invalid java distribution"
        id: bad-java-distribution
        continue-on-error: true
        uses: $/
        with:
          java_distribution: 'Temurin$(id)'

      - name: "Running local action with invalid plugin version"
        id: bad-plugin-version
        continue-on-error: true
        uses: $/
        with:
          maven_plugin_version: 'latest'

      # Syntactically valid but unusable: releases before 2.8.0 do not
      # bind -DoutputDirectory, so the BOM would land in the project's
      # target directory instead of the requested location
      - name: "Running local action with an outdated plugin version"
        id: old-plugin-version
        continue-on-error: true
        uses: $/
        with:
          maven_plugin_version: '2.7.5'

      # The cyclonedx backend names the tool, not the build system, so
      # it has to detect one. This repository has neither a pom.xml nor
      # a Gradle build script, so detection must fail rather than
      # falling through to a Maven invocation that cannot work.
      # untrusted_checkout is forced off so the run reaches detection:
      # this workflow runs on a fork pull request, where the default
      # would skip before getting there.
      - name: "Running cyclonedx backend with no build tool present"
        id: no-build-tool
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'

      # Plant a document at the destination so the assertion below
      # proves the skip CLEARS it, rather than merely proving the
      # action wrote nothing. A repository can legitimately commit an
      # sbom-*.json, and the caller's artifact glob would publish it.
      # It has to be a STRUCTURALLY valid BOM: the classification
      # check requires the schema's mandatory bomFormat/specVersion/
      # version triple before it will replace an existing file.
      - name: "Plant a stale document at the skip destination"
        shell: bash
        run: |
          # Plant a stale document at the skip destination
          printf '%s%s\n' \
            '{"bomFormat":"CycloneDX","specVersion":"1.5",' \
            '"version":1,"components":[]}' \
            > sbom-untrusted.json

      # The default must SKIP rather than run, fail, or quietly fall
      # back to syft. untrusted_checkout is declared explicitly rather
      # than relying on 'auto': this workflow also runs on pushes to
      # main and same-repository pull requests, where 'auto' resolves
      # to trusted and the action would instead fail on this
      # repository having no Maven or Gradle build. The detection
      # itself is covered by the validation matrix, not here.
      - name: "Running cyclonedx backend on an untrusted checkout"
        id: untrusted-skip
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'true'
          filename_prefix: sbom-untrusted

      # Coverage for the 'auto' default itself, which the deterministic
      # cases above deliberately bypass. Each direction is asserted on
      # the event where its outcome is determinate, and skipped
      # otherwise, so neither can pass vacuously.
      - name: "Auto on a fork PR must resolve untrusted"
        id: auto-fork
        # yamllint disable-line rule:line-length
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: $/
        with:
          backend: cyclonedx
          filename_prefix: sbom-auto-fork

      - name: "Auto outside a fork PR must resolve trusted"
        id: auto-trusted
        # yamllint disable-line rule:line-length
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          filename_prefix: sbom-auto-trusted

      # Maven can exit 0 having written nothing: cyclonedx.skip is a
      # user property a consumer POM can set. The action must treat
      # that as a generation failure rather than aborting under set -e
      # or reporting success over no document.
      - name: "Create a POM that disables the plugin"
        shell: bash
        run: |
          # Create a POM that disables the plugin
          mkdir -p skip-pom
          cat > skip-pom/pom.xml <<'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.lfreleng.test</groupId>
            <artifactId>skip-pom</artifactId>
            <version>1.0.0</version>
            <packaging>pom</packaging>
            <properties>
              <cyclonedx.skip>true</cyclonedx.skip>
            </properties>
          </project>
          POMEOF

      - name: "Plugin disabled by the POM (hard fail)"
        id: pom-skip-hard
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: skip-pom
          sbom_format: json
          filename_prefix: sbom-pomskip-hard

      - name: "Plugin disabled by the POM (soft fail)"
        id: pom-skip-soft
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: skip-pom
          sbom_format: json
          filename_prefix: sbom-pomskip-soft
          fail_on_error: 'false'

      # The destinations derive from filename_prefix and
      # output_directory, both caller-controlled and both defaulting
      # into the workspace. Clearing them must never unlink a project
      # file: 'pom' would resolve to pom.xml, 'package' to
      # package.json. A collision with a non-SBOM file has to be
      # refused rather than removed.
      # GitHub-hosted runners do not ship xmllint, so without this the
      # XML collision test would exit at the missing-tool check and
      # never reach the XPath classifier it exists to cover - passing
      # for the wrong reason. The archive host is in the shared
      # allow-list.
      - name: "Install xmllint for the XML classification test"
        shell: bash
        run: |
          # Install xmllint for the XML classification test
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          xmllint --version 2>&1 | head -1

      - name: "Create a file the destination would collide with"
        shell: bash
        run: |
          # Create a file the destination would collide with
          printf 'not an sbom\n' > collide.json
          # A bomFormat key alone does not make a file a BOM. This
          # decoy is package.json-shaped: it declares the key, but its
          # version is a string where a BOM's is a number, so the
          # structural check must still refuse it.
          printf '{"name":"x","version":"1.0.0","bomFormat":"CycloneDX"}\n' \
            > decoyjson.json
          # A POM declaring cyclonedx-maven-plugin contains the word
          # 'cyclonedx'. A substring test would treat it as a BOM and
          # delete it, so the XML check parses the document element's
          # namespace and local name instead. Comments carrying the
          # schema URL and a <bom> must not fool it either.
          cat > decoy.xml <<'DECOYEOF'
          <?xml version="1.0"?>
          <!-- https://cyclonedx.org/schema/bom/1.6 -->
          <project>
            <!-- <bom> -->
            <build><plugins><plugin>
              <groupId>org.cyclonedx</groupId>
              <artifactId>cyclonedx-maven-plugin</artifactId>
            </plugin></plugins></build>
          </project>
          DECOYEOF
          # A broken symlink fails an -e test. Left in place, the
          # backend would write through it to a path outside the
          # validated output directory.
          ln -s /tmp/sbom-action-no-such-target dangling.json

      - name: "Destination collides with a non-SBOM file"
        id: collide
        continue-on-error: true
        uses: $/
        with:
          sbom_format: json
          filename_prefix: collide

      - name: "Destination collides with a POM naming the plugin"
        id: collide-decoy
        continue-on-error: true
        uses: $/
        with:
          sbom_format: xml
          filename_prefix: decoy

      - name: "Destination collides with a bomFormat-only JSON file"
        id: collide-decoyjson
        continue-on-error: true
        uses: $/
        with:
          sbom_format: json
          filename_prefix: decoyjson

      - name: "Destination is a dangling symlink"
        id: collide-symlink
        continue-on-error: true
        uses: $/
        with:
          sbom_format: json
          filename_prefix: dangling

      # The decoys above only prove the classifier REFUSES. This proves
      # it still accepts: a genuine CycloneDX XML document at the
      # destination must be replaced, or the guard would block every
      # legitimate rerun. Needs the xmllint installed above.
      - name: "Plant a genuine XML BOM at a destination"
        shell: bash
        run: |
          # Plant a genuine XML BOM at a destination
          mkdir -p replace-xml
          printf '%s\n%s\n' \
            '<?xml version="1.0"?>' \
            '<bom xmlns="http://cyclonedx.org/schema/bom/1.5"/>' \
            > replace-xml/sbom-cyclonedx.xml

      - name: "Genuine XML BOM at the destination is replaced"
        id: replace-xml
        continue-on-error: true
        uses: $/
        with:
          sbom_format: xml
          output_directory: replace-xml

      # A POM the plugin will actually act on, unlike skip-pom. The
      # inherited-MAVEN_ARGS test needs a run that SUCCEEDS when the
      # reserved name is shadowed, so that a leak - which would send
      # Maven to a non-existent POM - flips the outcome and fails the
      # assertion. Against skip-pom both cases fail and the test could
      # not tell them apart.
      - name: "Create a POM the plugin will act on"
        shell: bash
        run: |
          # Create a POM the plugin will act on
          mkdir -p live-pom
          cat > live-pom/pom.xml <<'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.lfreleng.test</groupId>
            <artifactId>live-pom</artifactId>
            <version>1.0.0</version>
            <packaging>pom</packaging>
          </project>
          POMEOF

      # An inherited MAVEN_ARGS reaches Maven without passing through
      # the input validation, so the action shadows the reserved name.
      # Set here at step level, which is exactly how a caller's
      # workflow or job env would leak in.
      - name: "Inherited MAVEN_ARGS must not reach Maven"
        id: inherited-maven-args
        continue-on-error: true
        env:
          MAVEN_ARGS: '-f /tmp/elsewhere/pom.xml'
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: live-pom
          sbom_format: json
          filename_prefix: sbom-inherited

      - name: "Verify the colliding files survived"
        shell: bash
        run: |
          # Verify the colliding files survived
          errors=0
          if [ ! -f collide.json ] || \
            ! grep -q 'not an sbom' collide.json; then
            echo "A non-SBOM file at the destination was removed ❌"
            errors=1
          fi
          if [ ! -f decoy.xml ] || \
            ! grep -q 'cyclonedx-maven-plugin' decoy.xml; then
            echo "A POM naming the plugin was removed ❌"
            errors=1
          fi
          if [ ! -f decoyjson.json ] || \
            ! grep -q '"name":"x"' decoyjson.json; then
            echo "A bomFormat-only JSON file was removed ❌"
            errors=1
          fi
          if [ ! -L dangling.json ]; then
            echo "A dangling symlink destination was removed ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            exit 1
          fi
          echo "Colliding files left intact ✅"

      - name: "Running local action with maven_args override"
        id: bad-maven-args
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          # Pointed at the skip-pom fixture, not the repository root:
          # at the root the run would fail on 'no Maven or Gradle
          # project found' and the outcome assertion would pass
          # without ever reaching the maven_args normalisation.
          #
          # skip=false rather than true so the assertion discriminates.
          # The fixture POM sets cyclonedx.skip true; if normalisation
          # regressed and this argument slipped through, it would
          # override that and generation would SUCCEED, failing the
          # test. A value of true would merely produce no document,
          # which already fails for an unrelated reason.
          path_prefix: skip-pom
          maven_args: '--define cyclonedx.skip=false'

      - name: "Running local action with an alternate POM"
        id: bad-maven-file
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: skip-pom
          maven_args: '-f /tmp/elsewhere/pom.xml'

      # An unsupported CycloneDX spec version passes input validation
      # (digits and dots) but makes the syft scan itself fail,
      # exercising the fail_on_error handling paths
      - name: "Running local action with syft failure (soft fail)"
        id: soft-fail
        continue-on-error: true
        uses: $/
        with:
          sbom_spec_version: '9.9'
          fail_on_error: false

      - name: "Running local action with syft failure (hard fail)"
        id: hard-fail
        continue-on-error: true
        uses: $/
        with:
          sbom_spec_version: '9.9'

      - name: "Verify invalid inputs were rejected"
        shell: bash
        env:
          BACKEND_OUTCOME: ${{ steps.bad-backend.outcome }}
          FORMAT_OUTCOME: ${{ steps.bad-format.outcome }}
          PATH_OUTCOME: ${{ steps.bad-path.outcome }}
          ESCAPE_OUTCOME: ${{ steps.escape-path.outcome }}
          OUTPUT_ESCAPE_OUTCOME: ${{ steps.escape-output.outcome }}
          PREFIX_OUTCOME: ${{ steps.bad-prefix.outcome }}
          MODE_OUTCOME: ${{ steps.bad-mode.outcome }}
          IMAGE_NO_DIR_OUTCOME: ${{ steps.image-no-directory.outcome }}
          # yamllint disable-line rule:line-length
          DIR_WITH_ARCHIVES_OUTCOME: ${{ steps.directory-with-archives.outcome }}
          IMAGE_CYCLONEDX_OUTCOME: ${{ steps.image-cyclonedx.outcome }}
          IMAGE_ESCAPE_OUTCOME: ${{ steps.image-escape.outcome }}
          JAVA_VERSION_OUTCOME: ${{ steps.bad-java-version.outcome }}
          # yamllint disable-line rule:line-length
          JAVA_DISTRIBUTION_OUTCOME: ${{ steps.bad-java-distribution.outcome }}
          PLUGIN_VERSION_OUTCOME: ${{ steps.bad-plugin-version.outcome }}
          OLD_PLUGIN_OUTCOME: ${{ steps.old-plugin-version.outcome }}
          NO_BUILD_TOOL_OUTCOME: ${{ steps.no-build-tool.outcome }}
          SKIP_OUTCOME: ${{ steps.untrusted-skip.outcome }}
          SKIP_SKIPPED: ${{ steps.untrusted-skip.outputs.skipped }}
          SKIP_JSON: ${{ steps.untrusted-skip.outputs.sbom_json_path }}
          SKIP_COUNT: ${{ steps.untrusted-skip.outputs.component_count }}
          AUTO_FORK_OUTCOME: ${{ steps.auto-fork.outcome }}
          AUTO_FORK_SKIPPED: ${{ steps.auto-fork.outputs.skipped }}
          AUTO_TRUSTED_OUTCOME: ${{ steps.auto-trusted.outcome }}
          AUTO_TRUSTED_SKIPPED: ${{ steps.auto-trusted.outputs.skipped }}
          POM_SKIP_HARD_OUTCOME: ${{ steps.pom-skip-hard.outcome }}
          POM_SKIP_SOFT_OUTCOME: ${{ steps.pom-skip-soft.outcome }}
          # yamllint disable-line rule:line-length
          POM_SKIP_SOFT_COUNT: ${{ steps.pom-skip-soft.outputs.component_count }}
          COLLIDE_OUTCOME: ${{ steps.collide.outcome }}
          COLLIDE_DECOY_OUTCOME: ${{ steps.collide-decoy.outcome }}
          # yamllint disable-line rule:line-length
          COLLIDE_DECOYJSON_OUTCOME: ${{ steps.collide-decoyjson.outcome }}
          COLLIDE_SYMLINK_OUTCOME: ${{ steps.collide-symlink.outcome }}
          BAD_MAVEN_ARGS_OUTCOME: ${{ steps.bad-maven-args.outcome }}
          BAD_MAVEN_FILE_OUTCOME: ${{ steps.bad-maven-file.outcome }}
          REPLACE_XML_OUTCOME: ${{ steps.replace-xml.outcome }}
          REPLACE_XML_PATH: ${{ steps.replace-xml.outputs.sbom_xml_path }}
          # yamllint disable-line rule:line-length
          INHERITED_ARGS_OUTCOME: ${{ steps.inherited-maven-args.outcome }}
          HARD_FAIL_OUTCOME: ${{ steps.hard-fail.outcome }}
          SOFT_FAIL_OUTCOME: ${{ steps.soft-fail.outcome }}
          SOFT_FAIL_COUNT: ${{ steps.soft-fail.outputs.component_count }}
        run: |
          # Failure testing is also important; all steps MUST fail
          errors=0
          for outcome_pair in \
            "backend:${BACKEND_OUTCOME}" \
            "format:${FORMAT_OUTCOME}" \
            "path:${PATH_OUTCOME}" \
            "escape:${ESCAPE_OUTCOME}" \
            "output-escape:${OUTPUT_ESCAPE_OUTCOME}" \
            "prefix:${PREFIX_OUTCOME}" \
            "mode:${MODE_OUTCOME}" \
            "image-no-directory:${IMAGE_NO_DIR_OUTCOME}" \
            "directory-with-archives:${DIR_WITH_ARCHIVES_OUTCOME}" \
            "image-cyclonedx:${IMAGE_CYCLONEDX_OUTCOME}" \
            "image-escape:${IMAGE_ESCAPE_OUTCOME}" \
            "java-version:${JAVA_VERSION_OUTCOME}" \
            "java-distribution:${JAVA_DISTRIBUTION_OUTCOME}" \
            "plugin-version:${PLUGIN_VERSION_OUTCOME}" \
            "old-plugin:${OLD_PLUGIN_OUTCOME}" \
            "no-build-tool:${NO_BUILD_TOOL_OUTCOME}" \
            "collide:${COLLIDE_OUTCOME}" \
            "collide-decoy:${COLLIDE_DECOY_OUTCOME}" \
            "collide-decoyjson:${COLLIDE_DECOYJSON_OUTCOME}" \
            "collide-symlink:${COLLIDE_SYMLINK_OUTCOME}" \
            "maven-args-define:${BAD_MAVEN_ARGS_OUTCOME}" \
            "maven-args-file:${BAD_MAVEN_FILE_OUTCOME}" \
            "hard-fail:${HARD_FAIL_OUTCOME}"; do
            test_name="${outcome_pair%%:*}"
            outcome="${outcome_pair#*:}"
            if [ "${outcome}" = "success" ]; then
              echo "Invalid ${test_name} unexpectedly succeeded ❌"
              errors=1
            fi
          done
          # With fail_on_error false, a syft failure must NOT fail the
          # action, and component_count must report zero
          if [ "${SOFT_FAIL_OUTCOME}" != "success" ]; then
            echo "Soft-fail path unexpectedly failed ❌"
            errors=1
          fi
          if [ "${SOFT_FAIL_COUNT}" != "0" ]; then
            echo "Soft-fail component_count not zero ❌"
            errors=1
          fi
          # An untrusted checkout must SKIP, not fail and not produce a
          # document. Failing would red-build a contribution over
          # something the contributor cannot fix; producing anything
          # would risk a partial SBOM reading as a clean scan.
          if [ "${SKIP_OUTCOME}" != "success" ]; then
            echo "Untrusted checkout failed instead of skipping ❌"
            errors=1
          fi
          if [ "${SKIP_SKIPPED}" != "true" ]; then
            echo "skipped output was '${SKIP_SKIPPED}', wanted true ❌"
            errors=1
          fi
          # Empty rather than zero: a count of 0 could be misread as a
          # scan that found nothing
          if [ -n "${SKIP_JSON}" ] || [ -n "${SKIP_COUNT}" ]; then
            echo "Skipped run reported results ❌"
            echo "  json='${SKIP_JSON}' count='${SKIP_COUNT}'"
            errors=1
          fi
          # A committed or previously generated document must not
          # survive the skip: the caller's artifact glob would publish
          # it as though this run had produced it
          if [ -n "$(find . -maxdepth 1 -name 'sbom-untrusted.*' \
            2>/dev/null)" ]; then
            echo "Skipped run left a document behind ❌"
            errors=1
          fi

          # 'auto' resolution. Each arm runs only on the event where
          # its outcome is determinate; an arm that did not run reports
          # outcome 'skipped', which is not a failure. Both assertions
          # are positive: an action that failed before writing the
          # output leaves it empty, and an empty value must not satisfy
          # the check, or a regression turning the safe skip into a
          # hard failure would pass unnoticed.
          if [ "${AUTO_FORK_OUTCOME}" != "skipped" ]; then
            if [ "${AUTO_FORK_OUTCOME}" != "success" ] || \
              [ "${AUTO_FORK_SKIPPED}" != "true" ]; then
              echo "auto on a fork PR: wanted success+skipped=true," \
                "got ${AUTO_FORK_OUTCOME}+'${AUTO_FORK_SKIPPED}' ❌"
              errors=1
            fi
          fi
          # The trusted arm is expected to FAIL: this repository has no
          # Maven or Gradle build, so detection rejects it. What must
          # hold is that validation resolved the checkout as trusted
          # first, which it records as skipped=false before detecting.
          if [ "${AUTO_TRUSTED_OUTCOME}" != "skipped" ]; then
            if [ "${AUTO_TRUSTED_SKIPPED}" != "false" ]; then
              echo "auto outside a fork PR: wanted skipped=false," \
                "got '${AUTO_TRUSTED_SKIPPED}' ❌"
              errors=1
            fi
          fi

          # A plugin disabled by the consumer POM exits 0 writing
          # nothing. That must surface as a generation failure, honour
          # fail_on_error, and leave no document behind.
          if [ "${POM_SKIP_HARD_OUTCOME}" = "success" ]; then
            echo "POM-disabled plugin reported success ❌"
            errors=1
          fi
          if [ "${POM_SKIP_SOFT_OUTCOME}" != "success" ]; then
            echo "POM-disabled plugin ignored fail_on_error: false ❌"
            errors=1
          fi
          if [ "${POM_SKIP_SOFT_COUNT}" != "0" ]; then
            echo "Soft-failed run count was" \
              "'${POM_SKIP_SOFT_COUNT}', wanted 0 ❌"
            errors=1
          fi
          if [ -n "$(find . -maxdepth 1 -name 'sbom-pomskip-*' \
            2>/dev/null)" ]; then
            echo "POM-disabled run left a document behind ❌"
            errors=1
          fi

          # The classifier must still ACCEPT a real document, or every
          # legitimate rerun would be blocked by the guard
          if [ "${REPLACE_XML_OUTCOME}" != "success" ]; then
            echo "Genuine XML BOM at the destination was not" \
              "replaced (${REPLACE_XML_OUTCOME}) ❌"
            errors=1
          fi
          if [ -n "${REPLACE_XML_PATH}" ] && \
            ! grep -q 'cyclonedx.org/schema/bom' \
            "${REPLACE_XML_PATH}" 2> /dev/null; then
            echo "Replacement XML is not a CycloneDX document ❌"
            errors=1
          fi

          # An inherited MAVEN_ARGS bypasses input validation entirely
          # unless the action shadows the reserved name. Shadowed, this
          # run builds live-pom and succeeds; leaked, Maven is sent to
          # a non-existent POM and the run fails. The outcome is the
          # discriminator.
          if [ "${INHERITED_ARGS_OUTCOME}" != "success" ]; then
            echo "Inherited MAVEN_ARGS reached Maven" \
              "(${INHERITED_ARGS_OUTCOME}) ❌"
            errors=1
          fi

          if [ "${errors}" != "0" ]; then
            echo "Failure-path tests failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Invalid inputs correctly rejected ✅"
          echo "Invalid inputs correctly rejected ✅" \
            >> "$GITHUB_STEP_SUMMARY"
