---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  # No workflow_dispatch: a manual run happens on the default branch,
  # which would hand this job a cache token with write access to the
  # default-branch scope while it runs the local action against
  # third-party fixture repositories, letting that untrusted code
  # poison caches later runs restore (CWE-349). The fixtures stay
  # pinned to explicit commit SHAs, which is what bounds the same
  # exposure on the push trigger below.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test SBOM generation against real projects ###
  test-projects:
    name: "Test: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Go fixture (test-go-project)"
            repository: "lfreleng-actions/test-go-project"
            ref: "a77c5ec773edc266ddcc3c1d1c306e7bb3f12c30"
            path_prefix: "test-project"
          - name: "Node fixture (test-node-project)"
            repository: "lfreleng-actions/test-node-project"
            ref: "89cc7f156c88afa1855087b00ac0dce886e7b0f3"
            path_prefix: "test-project"
          - name: "Go monorepo module (onap/multicloud-k8s)"
            repository: "onap/multicloud-k8s"
            ref: "5c3b1a96811024e65b0977305b6d6737a6e2d453"
            path_prefix: "test-project/src/k8splugin"
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Checkout test project: ${{ matrix.repository }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: test-project
          persist-credentials: false

      - name: "Running local action: ${{ github.repository }}"
        id: sbom
        uses: $/
        with:
          path_prefix: ${{ matrix.path_prefix }}

      - name: "Verify SBOM outputs"
        shell: bash
        env:
          SBOM_JSON_PATH: ${{ steps.sbom.outputs.sbom_json_path }}
          SBOM_XML_PATH: ${{ steps.sbom.outputs.sbom_xml_path }}
          COMPONENT_COUNT: ${{ steps.sbom.outputs.component_count }}
          BACKEND: ${{ steps.sbom.outputs.backend }}
          # yamllint disable-line rule:line-length
          DEPENDENCY_MANAGER: ${{ steps.sbom.outputs.dependency_manager }}
        run: |
          # Verify SBOM outputs
          errors=0
          if [ ! -f "${SBOM_JSON_PATH}" ]; then
            echo "JSON SBOM not found: ${SBOM_JSON_PATH} ❌"
            errors=1
          fi
          if [ ! -f "${SBOM_XML_PATH}" ]; then
            echo "XML SBOM not found: ${SBOM_XML_PATH} ❌"
            errors=1
          fi
          if ! jq -e '.bomFormat == "CycloneDX"' \
            "${SBOM_JSON_PATH}" > /dev/null; then
            echo "JSON SBOM is not CycloneDX ❌"
            errors=1
          fi
          if [ -z "${COMPONENT_COUNT}" ] || \
            [ "${COMPONENT_COUNT}" -lt 1 ]; then
            echo "Component count not positive: ${COMPONENT_COUNT} ❌"
            errors=1
          fi
          if [ "${BACKEND}" != "syft" ]; then
            echo "Unexpected backend output: ${BACKEND} ❌"
            errors=1
          fi
          # syft is ecosystem-agnostic and drives no build tool, so the
          # dependency_manager output stays empty rather than guessing
          if [ -n "${DEPENDENCY_MANAGER}" ]; then
            echo "syft reported a build tool: ${DEPENDENCY_MANAGER} ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "SBOM verification failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "SBOM verified: ${COMPONENT_COUNT} components ✅"
          echo "SBOM verified: ${COMPONENT_COUNT} components ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Test format selection, scoping and output placement ###
  test-options:
    name: "Test: formats, scoping and output options"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Checkout test project: lfreleng-actions/test-node-project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfreleng-actions/test-node-project
          ref: 89cc7f156c88afa1855087b00ac0dce886e7b0f3
          path: test-project
          persist-credentials: false

      - name: "Running local action: JSON only, custom placement"
        id: json-only
        uses: $/
        with:
          path_prefix: test-project
          sbom_format: json
          filename_prefix: custom-sbom
          output_directory: sbom-output

      - name: "Running local action: XML only"
        id: xml-only
        uses: $/
        with:
          path_prefix: test-project
          sbom_format: xml

      - name: "Running local action: development dependencies"
        id: with-dev
        uses: $/
        with:
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-with-dev
          include_dev: 'true'

      - name: "Verify format selection and scoping behaviour"
        shell: bash
        env:
          JSON_ONLY_JSON: ${{ steps.json-only.outputs.sbom_json_path }}
          JSON_ONLY_XML: ${{ steps.json-only.outputs.sbom_xml_path }}
          JSON_ONLY_COUNT: ${{ steps.json-only.outputs.component_count }}
          XML_ONLY_JSON: ${{ steps.xml-only.outputs.sbom_json_path }}
          XML_ONLY_XML: ${{ steps.xml-only.outputs.sbom_xml_path }}
          WITH_DEV_COUNT: ${{ steps.with-dev.outputs.component_count }}
        run: |
          # Verify format selection and scoping behaviour
          errors=0
          if [ ! -f "${JSON_ONLY_JSON}" ]; then
            echo "JSON-only run: JSON SBOM missing ❌"
            errors=1
          fi
          case "${JSON_ONLY_JSON}" in
            */sbom-output/custom-sbom.json) ;;
            *)
              echo "Custom placement not honoured: ${JSON_ONLY_JSON} ❌"
              errors=1 ;;
          esac
          if [ -n "${JSON_ONLY_XML}" ]; then
            echo "JSON-only run: unexpected XML output path ❌"
            errors=1
          fi
          if [ -n "${XML_ONLY_JSON}" ]; then
            echo "XML-only run: unexpected JSON output path ❌"
            errors=1
          fi
          if [ ! -f "${XML_ONLY_XML}" ]; then
            echo "XML-only run: XML SBOM missing ❌"
            errors=1
          fi
          # Development dependency scoping must add components for the
          # node fixture, which declares devDependencies
          if [ "${WITH_DEV_COUNT}" -le "${JSON_ONLY_COUNT}" ]; then
            echo "Dev scoping made no difference ❌"
            echo "Production: ${JSON_ONLY_COUNT} components"
            echo "With dev: ${WITH_DEV_COUNT} components"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            echo "Options verification failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Formats, scoping and placement verified ✅"
          {
            echo "Formats, scoping and placement verified ✅"
            echo "Production components: ${JSON_ONLY_COUNT}"
            echo "With development components: ${WITH_DEV_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

  ### Test image mode against real docker archives ###
  # Image mode's filenames are a contract with the archive producer
  # (docker-save-images-action, per-image mode) and the Grype job in
  # docker-workflows, so this job uses the real producer and the same
  # artifact round trip the lanes do, then holds the documents to the
  # inline step image mode replaces. See
  # lfreleng-actions/docker-workflows#35.
  test-image-mode:
    name: "Test: image mode"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two images: an Alpine one with OS packages and an npm package,
      # and a scratch one with the npm package alone. The references
      # carry '/' and ':' so the producer's filename mapping is
      # exercised. The base is pinned by index digest so the component
      # set cannot drift under the test.
      - name: "Build fixture images"
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          BASE_IMAGE: 'alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
        run: |
          # Build fixture images
          context="${RUNNER_TEMP}/image-fixture"
          mkdir -p "${context}"
          printf '%s\n' '{"name":"left-pad","version":"1.3.0"}' \
            > "${context}/package.json"
          {
            echo "FROM ${BASE_IMAGE}"
            echo 'COPY package.json /usr/lib/node_modules/left-pad/'
          } > "${context}/Dockerfile"
          {
            echo 'FROM scratch'
            echo 'COPY package.json /usr/lib/node_modules/left-pad/'
          } > "${context}/Dockerfile.scratch"
          docker build -q -t sbom-action-test/fixture:ci "${context}"
          docker build -q -t sbom-action-test-scratch:ci \
            -f "${context}/Dockerfile.scratch" "${context}"
          # A combined archive breaks the one-image rule, for the
          # failure case below
          mkdir -p "${RUNNER_TEMP}/combined"
          docker save sbom-action-test/fixture:ci \
            sbom-action-test-scratch:ci \
            -o "${RUNNER_TEMP}/combined/both.tar"
          mkdir -p "${RUNNER_TEMP}/empty"
          # One directory per remaining contract breach, each built
          # from an otherwise valid single-image archive
          single="${RUNNER_TEMP}/single.tar"
          docker save sbom-action-test-scratch:ci -o "${single}"
          mkdir -p "${RUNNER_TEMP}/bad-label" "${RUNNER_TEMP}/bad-link" \
            "${RUNNER_TEMP}/bad-archive" "${RUNNER_TEMP}/bad-ref"
          cp "${single}" "${RUNNER_TEMP}/bad-label/bad+label.tar"
          mkdir -p "${RUNNER_TEMP}/dot-archive"
          cp "${single}" "${RUNNER_TEMP}/dot-archive/.dotted.tar"
          ln -s "${single}" "${RUNNER_TEMP}/bad-link/link.tar"
          tar -cf "${RUNNER_TEMP}/bad-archive/plain.tar" \
            -C "${context}" package.json
          unpacked="${RUNNER_TEMP}/bad-ref-unpacked"
          mkdir -p "${unpacked}"
          tar -xf "${single}" -C "${unpacked}"
          jq '.[0].RepoTags = ["bad ref;x:1"]' "${unpacked}/manifest.json" \
            > "${RUNNER_TEMP}/bad-ref-manifest.json"
          mv "${RUNNER_TEMP}/bad-ref-manifest.json" \
            "${unpacked}/manifest.json"
          # Members named without a leading ./, as docker save writes
          (cd "${unpacked}" && tar -cf "${RUNNER_TEMP}/bad-ref/ref.tar" -- *)
          # Plain characters only, but no repository name: Docker's
          # reference grammar rejects it
          mkdir -p "${RUNNER_TEMP}/bad-grammar"
          jq '.[0].RepoTags = [":justtag"]' "${unpacked}/manifest.json" \
            > "${RUNNER_TEMP}/bad-grammar-manifest.json"
          mv "${RUNNER_TEMP}/bad-grammar-manifest.json" \
            "${unpacked}/manifest.json"
          (cd "${unpacked}" && \
            tar -cf "${RUNNER_TEMP}/bad-grammar/grammar.tar" -- *)
          # A valid first tag must not hide an invalid second one
          mkdir -p "${RUNNER_TEMP}/bad-tags"
          jq '.[0].RepoTags = ["sbom-action-test-scratch:ci", ":bad"]' \
            "${unpacked}/manifest.json" \
            > "${RUNNER_TEMP}/bad-tags-manifest.json"
          mv "${RUNNER_TEMP}/bad-tags-manifest.json" \
            "${unpacked}/manifest.json"
          (cd "${unpacked}" && \
            tar -cf "${RUNNER_TEMP}/bad-tags/tags.tar" -- *)
          # A manifest naming a config the archive does not hold
          mkdir -p "${RUNNER_TEMP}/bad-structure"
          jq '.[0].RepoTags = ["sbom-action-test-scratch:ci"]
            | .[0].Config = "missing.json"' \
            "${unpacked}/manifest.json" \
            > "${RUNNER_TEMP}/bad-structure-manifest.json"
          mv "${RUNNER_TEMP}/bad-structure-manifest.json" \
            "${unpacked}/manifest.json"
          (cd "${unpacked}" && \
            tar -cf "${RUNNER_TEMP}/bad-structure/structure.tar" -- *)
          # A file at the manifest destination that is not this
          # action's manifest: an empty array, and an array that
          # merely names a label and an archive
          mkdir -p sbom-guard-empty sbom-guard-lookalike
          echo '[]' > sbom-guard-empty/sbom-cyclonedx.manifest.json
          echo '[{"label":"x","archive":"x.tar"}]' \
            > sbom-guard-lookalike/sbom-cyclonedx.manifest.json

      - name: "Save images with docker-save-images-action"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/docker-save-images-action@fd148182fc22be846b343f92404f4104d8d049f1 # v0.2.0
        with:
          # yamllint disable-line rule:line-length
          docker-artifacts-to-save: 'sbom-action-test/fixture:ci sbom-action-test-scratch:ci'
          mode: 'per-image'
          artifact-name: 'sbom-action-image-archives'
          output-directory: 'docker-archives'
          retention-days: '1'

      # The lanes download the archives in a separate job, so the test
      # does too, landing them under RUNNER_TEMP outside the checkout
      - name: "Download the archives as a lane would"
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: 'sbom-action-image-archives'
          path: ${{ runner.temp }}/docker-archives

      - name: "Running local action: image mode, as the lanes use it"
        id: image
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          sbom_format: json
          output_directory: sbom-lane

      - name: "Running local action: image mode, both formats"
        id: image-both
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          filename_prefix: image-sbom
          output_directory: ${{ runner.temp }}/sbom-both

      - name: "Running local action: combined archive"
        id: image-combined
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/combined
          output_directory: sbom-combined

      - name: "Running local action: no archives (hard fail)"
        id: image-empty-hard
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/empty
          output_directory: sbom-empty

      - name: "Running local action: no archives (soft fail)"
        id: image-empty-soft
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/empty
          output_directory: sbom-empty
          fail_on_error: 'false'

      # Contract breaches fail regardless of fail_on_error, so each
      # runs with it relaxed
      - name: "Running local action: unsafe archive name"
        id: image-bad-label
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-label
          output_directory: sbom-bad-label
          fail_on_error: 'false'

      - name: "Running local action: symlinked archive"
        id: image-bad-link
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-link
          output_directory: sbom-bad-link
          fail_on_error: 'false'

      - name: "Running local action: not a docker archive"
        id: image-bad-archive
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-archive
          output_directory: sbom-bad-archive
          fail_on_error: 'false'

      - name: "Running local action: malformed image reference"
        id: image-bad-ref
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-ref
          output_directory: sbom-bad-ref
          fail_on_error: 'false'

      - name: "Running local action: reference outside the grammar"
        id: image-bad-grammar
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-grammar
          output_directory: sbom-bad-grammar
          fail_on_error: 'false'

      - name: "Running local action: invalid second tag"
        id: image-bad-tags
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-tags
          output_directory: sbom-bad-tags
          fail_on_error: 'false'

      - name: "Running local action: incomplete docker archive"
        id: image-bad-structure
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/bad-structure
          output_directory: sbom-bad-structure
          fail_on_error: 'false'

      # Every *.tar counts, dot-prefixed names included
      - name: "Running local action: dot-prefixed archive"
        id: image-dot-archive
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/dot-archive
          sbom_format: json
          output_directory: sbom-dot

      - name: "Running local action: combined archive (soft fail)"
        id: image-combined-soft
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/combined
          output_directory: sbom-combined
          fail_on_error: 'false'

      # artifact_paths lines are upload-artifact globs
      - name: "Running local action: glob syntax in output directory"
        id: image-glob-output
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          output_directory: sbom-[glob]

      # upload-artifact skips hidden files by default
      - name: "Running local action: hidden filename prefix"
        id: image-hidden-prefix
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          filename_prefix: .sbom
          output_directory: sbom-hidden

      - name: "Running local action: empty array at the manifest path"
        id: image-guard-empty
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          output_directory: sbom-guard-empty

      - name: "Running local action: lookalike at the manifest path"
        id: image-guard-lookalike
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          output_directory: sbom-guard-lookalike

      # Image mode never reads path_prefix, so a missing one is no
      # error; and a second run must recognise and replace its own
      # manifest and documents
      - name: "Running local action: image mode again, stale path_prefix"
        id: image-rerun
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: ${{ runner.temp }}/docker-archives
          sbom_format: json
          output_directory: sbom-lane
          path_prefix: no-such-directory

      # The reference image mode replaces: the docker-workflows lanes'
      # inline step, reduced to its scan. Same pinned installer, so the
      # same syft.
      - name: "Install syft for the inline reference"
        id: syft
        # yamllint disable-line rule:line-length
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: "Generate the inline reference SBOMs"
        shell: bash
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          # Generate the inline reference SBOMs
          mkdir -p sbom-inline
          for archive in "${RUNNER_TEMP}"/docker-archives/*.tar; do
            base=$(basename "${archive}" .tar)
            "${SYFT_CMD}" scan "docker-archive:${archive}" -q \
              -o "cyclonedx-json=sbom-inline/sbom-cyclonedx-${base}.json"
          done

      - name: "Verify the image mode contract"
        shell: bash
        env:
          IMAGE_COUNT: ${{ steps.image.outputs.image_count }}
          COMPONENT_COUNT: ${{ steps.image.outputs.component_count }}
          SBOMS_JSON: ${{ steps.image.outputs.sboms_json }}
          MANIFEST_PATH: ${{ steps.image.outputs.manifest_path }}
          ARTIFACT_PATHS: ${{ steps.image.outputs.artifact_paths }}
          SBOM_JSON_PATH: ${{ steps.image.outputs.sbom_json_path }}
          SKIPPED: ${{ steps.image.outputs.skipped }}
          BOTH_SBOMS_JSON: ${{ steps.image-both.outputs.sboms_json }}
          # yamllint disable-line rule:line-length
          BOTH_MANIFEST_PATH: ${{ steps.image-both.outputs.manifest_path }}
          COMBINED_OUTCOME: ${{ steps.image-combined.outcome }}
          EMPTY_HARD_OUTCOME: ${{ steps.image-empty-hard.outcome }}
          EMPTY_SOFT_OUTCOME: ${{ steps.image-empty-soft.outcome }}
          # yamllint disable-line rule:line-length
          EMPTY_SOFT_IMAGES: ${{ steps.image-empty-soft.outputs.image_count }}
          # yamllint disable-line rule:line-length
          EMPTY_SOFT_SBOMS: ${{ steps.image-empty-soft.outputs.sboms_json }}
          BAD_LABEL_OUTCOME: ${{ steps.image-bad-label.outcome }}
          BAD_LINK_OUTCOME: ${{ steps.image-bad-link.outcome }}
          BAD_ARCHIVE_OUTCOME: ${{ steps.image-bad-archive.outcome }}
          BAD_REF_OUTCOME: ${{ steps.image-bad-ref.outcome }}
          BAD_GRAMMAR_OUTCOME: ${{ steps.image-bad-grammar.outcome }}
          BAD_TAGS_OUTCOME: ${{ steps.image-bad-tags.outcome }}
          # yamllint disable-line rule:line-length
          BAD_STRUCTURE_OUTCOME: ${{ steps.image-bad-structure.outcome }}
          # yamllint disable-line rule:line-length
          COMBINED_SOFT_OUTCOME: ${{ steps.image-combined-soft.outcome }}
          GLOB_OUTPUT_OUTCOME: ${{ steps.image-glob-output.outcome }}
          HIDDEN_PREFIX_OUTCOME: ${{ steps.image-hidden-prefix.outcome }}
          DOT_IMAGES: ${{ steps.image-dot-archive.outputs.image_count }}
          GUARD_EMPTY_OUTCOME: ${{ steps.image-guard-empty.outcome }}
          # yamllint disable-line rule:line-length
          GUARD_LOOKALIKE_OUTCOME: ${{ steps.image-guard-lookalike.outcome }}
          RERUN_OUTCOME: ${{ steps.image-rerun.outcome }}
          RERUN_SBOMS_JSON: ${{ steps.image-rerun.outputs.sboms_json }}
        run: |
          # Verify the image mode contract
          errors=0
          fail() {
            echo "$1 ❌"
            errors=1
          }
          lane="${GITHUB_WORKSPACE}/sbom-lane"
          fixture="sbom-action-test_fixture_ci"
          scratch="sbom-action-test-scratch_ci"

          [ "${IMAGE_COUNT}" = "2" ] || \
            fail "image_count was '${IMAGE_COUNT}', wanted 2"
          [ "${SKIPPED}" = "false" ] || fail "skipped was '${SKIPPED}'"
          # There is no single document in image mode
          [ -z "${SBOM_JSON_PATH}" ] || fail "sbom_json_path was set"
          [ "${MANIFEST_PATH}" = "${lane}/sbom-cyclonedx.manifest.json" ] \
            || fail "manifest_path was '${MANIFEST_PATH}'"
          [ "$(jq -c . "${MANIFEST_PATH}")" = "${SBOMS_JSON}" ] || \
            fail "sboms_json differs from the manifest file"

          # The filenames the lanes and their Grype job depend on:
          # sbom-cyclonedx-<archive basename>.json, and nothing else
          # matching the glob the Grype job scans
          expected="sbom-cyclonedx-${scratch}.json"
          expected="${expected} sbom-cyclonedx-${fixture}.json"
          actual="$(cd "${lane}" && echo sbom-cyclonedx-*.json)"
          [ "${actual}" = "${expected}" ] || \
            fail "glob matched '${actual}', wanted '${expected}'"
          [ ! -e "${lane}/sbom-cyclonedx.json" ] || \
            fail "image mode wrote the directory-mode document"

          # One manifest entry per archive, in byte order, naming the
          # image recorded in the archive rather than one inferred
          # from the filename
          want="$(jq -nc --arg f "${fixture}" --arg s "${scratch}" '[
            {label: $s, image: "sbom-action-test-scratch:ci",
             archive: ($s + ".tar"),
             sbom_json: ("sbom-cyclonedx-" + $s + ".json")},
            {label: $f, image: "sbom-action-test/fixture:ci",
             archive: ($f + ".tar"),
             sbom_json: ("sbom-cyclonedx-" + $f + ".json")}]')"
          got="$(jq -c '[.[] | {label, image, archive, sbom_json}]' \
            "${MANIFEST_PATH}")"
          [ "${got}" = "${want}" ] || fail "manifest was ${got}"
          jq -e 'all(.[]; .format == "cyclonedx"
            and .spec_version == "1.5" and .sbom_xml == null)' \
            "${MANIFEST_PATH}" > /dev/null || \
            fail "manifest format fields are wrong"

          total=0
          while IFS=$'\t' read -r label image sbom count; do
            doc="${lane}/${sbom}"
            [ -f "${doc}" ] || { fail "${label}: ${sbom} missing"; continue; }
            [ "$(jq '.components | length' "${doc}")" = "${count}" ] || \
              fail "${label}: component_count disagrees with the document"
            [ "$(jq -r .specVersion "${doc}")" = "1.5" ] || \
              fail "${label}: wrong specVersion"
            # The document names the image, not the runner path
            [ "$(jq -r .metadata.component.name "${doc}")" = "${image}" ] \
              || fail "${label}: metadata.component.name is not ${image}"
            grep -qxF "${doc}" <<< "${ARTIFACT_PATHS}" || \
              fail "${label}: missing from artifact_paths"
            total=$((total + count))
          done < <(jq -r '.[] | [.label, .image, .sbom_json,
            .component_count] | @tsv' "${MANIFEST_PATH}")
          [ "${total}" = "${COMPONENT_COUNT}" ] || \
            fail "component_count ${COMPONENT_COUNT} is not the sum ${total}"
          grep -qxF "${MANIFEST_PATH}" <<< "${ARTIFACT_PATHS}" || \
            fail "artifact_paths omits the manifest"
          [ "$(grep -c . <<< "${ARTIFACT_PATHS}")" = "3" ] || \
            fail "artifact_paths does not list exactly three files"
          # The fixture image carries OS packages and the npm package
          jq -e '[.components[].name] | index("left-pad") and
            index("alpine-baselayout")' \
            "${lane}/sbom-cyclonedx-${fixture}.json" > /dev/null || \
            fail "fixture SBOM lacks the expected components"

          # Equivalence with the inline step it replaces: the same
          # components and dependency graph. Spec version and
          # document metadata differ by design. bom-refs are opaque
          # IDs, so the graph is compared with each one replaced by
          # the identity of the component it names (the document's
          # subject standing in as a fixed token) and edges sorted.
          ident='[.components[] | [.type, .name, (.version // ""),
            (.purl // "")] | join("|")] | sort'
          # jq variables, not shell ones
          # shellcheck disable=SC2016
          graph='def id: [.type, .name, (.version // ""), (.purl // "")]
              | join("|");
            (reduce (.components // [])[] as $c ({};
                .[$c["bom-ref"]] = ($c | id))
              + {(.metadata.component["bom-ref"] // ""): "(subject)"})
            as $names
            | [(.dependencies // [])[]
                | {ref: ($names[.ref] // .ref),
                   dependsOn: ([(.dependsOn // [])[]
                     | ($names[.] // .)] | sort)}]
            | sort'
          for label in "${fixture}" "${scratch}"; do
            new="${lane}/sbom-cyclonedx-${label}.json"
            old="sbom-inline/sbom-cyclonedx-${label}.json"
            [ "$(jq -c "${ident}" "${new}")" = \
              "$(jq -c "${ident}" "${old}")" ] || \
              fail "${label}: components differ from the inline step"
            [ "$(jq -c "${graph}" "${new}")" = \
              "$(jq -c "${graph}" "${old}")" ] || \
              fail "${label}: dependency graph differs from the inline step"
          done
          # Non-vacuous: the fixture's graph has edges to compare
          jq -e '[.dependencies[]?.dependsOn[]?] | length > 0' \
            "${lane}/sbom-cyclonedx-${fixture}.json" > /dev/null || \
            fail "fixture SBOM has no dependency edges to compare"

          # Both formats, custom prefix, output under RUNNER_TEMP
          jq -e 'length == 2 and all(.[];
            (.sbom_json | startswith("image-sbom-"))
            and (.sbom_xml | endswith(".xml")))' \
            <<< "${BOTH_SBOMS_JSON}" > /dev/null || \
            fail "both-format manifest is wrong: ${BOTH_SBOMS_JSON}"
          both_dir="$(dirname "${BOTH_MANIFEST_PATH}")"
          [ "${BOTH_MANIFEST_PATH}" = \
            "${both_dir}/image-sbom.manifest.json" ] || \
            fail "both-format manifest path is wrong"
          while IFS= read -r xml; do
            grep -q 'cyclonedx.org/schema/bom/1.5' "${both_dir}/${xml}" \
              || fail "${xml} is not a CycloneDX 1.5 XML document"
          done < <(jq -r '.[].sbom_xml' <<< "${BOTH_SBOMS_JSON}")

          # A combined archive must be refused, not described
          [ "${COMBINED_OUTCOME}" = "failure" ] || \
            fail "a combined archive was accepted"
          [ -z "$(ls -A sbom-combined 2> /dev/null)" ] || \
            fail "a combined archive left documents behind"
          # No archives is a generation failure honouring fail_on_error
          [ "${EMPTY_HARD_OUTCOME}" = "failure" ] || \
            fail "no archives did not fail"
          [ "${EMPTY_SOFT_OUTCOME}" = "success" ] || \
            fail "no archives ignored fail_on_error: false"
          if [ "${EMPTY_SOFT_IMAGES}" != "0" ] || \
            [ "${EMPTY_SOFT_SBOMS}" != "[]" ]; then
            fail "soft failure reported '${EMPTY_SOFT_IMAGES}' images"
          fi

          # Contract breaches fail even under fail_on_error: false,
          # and write nothing
          for case_outcome in \
            "bad-label:${BAD_LABEL_OUTCOME}" \
            "bad-link:${BAD_LINK_OUTCOME}" \
            "bad-archive:${BAD_ARCHIVE_OUTCOME}" \
            "bad-ref:${BAD_REF_OUTCOME}" \
            "bad-grammar:${BAD_GRAMMAR_OUTCOME}" \
            "bad-tags:${BAD_TAGS_OUTCOME}" \
            "bad-structure:${BAD_STRUCTURE_OUTCOME}" \
            "combined:${COMBINED_SOFT_OUTCOME}"; do
            name="${case_outcome%%:*}"
            [ "${case_outcome#*:}" = "failure" ] || \
              fail "${name}: accepted under fail_on_error: false"
            [ -z "$(ls -A "sbom-${name}" 2> /dev/null)" ] || \
              fail "${name}: left files behind"
          done
          # artifact_paths cannot carry glob syntax
          [ "${GLOB_OUTPUT_OUTCOME}" = "failure" ] || \
            fail "an output directory with glob syntax was accepted"
          [ "${HIDDEN_PREFIX_OUTCOME}" = "failure" ] || \
            fail "a hidden filename prefix was accepted"
          [ -z "$(ls -A sbom-hidden 2> /dev/null)" ] || \
            fail "a hidden filename prefix left files behind"
          if [ "${DOT_IMAGES}" != "1" ] || \
            [ ! -f sbom-dot/sbom-cyclonedx-.dotted.json ]; then
            fail "a dot-prefixed archive was not scanned"
          fi
          # A file at the manifest path that this action did not write
          # is refused and survives
          [ "${GUARD_EMPTY_OUTCOME}" = "failure" ] || \
            fail "an empty array at the manifest path was replaced"
          [ "$(cat sbom-guard-empty/sbom-cyclonedx.manifest.json)" = \
            "[]" ] || fail "the empty-array manifest lookalike changed"
          [ "${GUARD_LOOKALIKE_OUTCOME}" = "failure" ] || \
            fail "a manifest lookalike was replaced"
          jq -e '. == [{"label":"x","archive":"x.tar"}]' \
            sbom-guard-lookalike/sbom-cyclonedx.manifest.json \
            > /dev/null || fail "the manifest lookalike changed"
          # Its own manifest is recognised and replaced, and path_prefix
          # plays no part
          [ "${RERUN_OUTCOME}" = "success" ] || \
            fail "a rerun over its own output, path_prefix stale, failed"
          [ "${RERUN_SBOMS_JSON}" = "${SBOMS_JSON}" ] || \
            fail "the rerun manifest differs from the first run"
          ! compgen -G "${lane}/.[!.]*" > /dev/null || \
            fail "a temporary manifest was left in the output directory"

          if [ "${errors}" != "0" ]; then
            echo "Image mode verification failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Image mode contract verified: ${IMAGE_COUNT} images," \
            "${COMPONENT_COUNT} components ✅" | tee -a "$GITHUB_STEP_SUMMARY"

  ### Test the cyclonedx backend resolves a real dependency graph ###
  # The syft backend reads pom.xml as text, which for Maven is an input
  # to dependency resolution rather than a product of it: transitive
  # dependencies are invisible and BOM-managed versions come back as
  # UNKNOWN. This job asserts the cyclonedx backend recovers both.
  # See lfreleng-actions/java-workflows#47.
  test-cyclonedx-backend:
    name: "Test: cyclonedx backend"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      # Block, like every other job here. Running a build tool that
      # resolves arbitrary plugins under unrestricted egress would make
      # this self-test an exfiltration surface, so this job is not
      # dropped to audit.
      #
      # No per-job endpoints: the shared allow-list carries Maven
      # Central and api.adoptium.net, which setup-java queries for
      # Temurin build metadata.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Multi-module reactor whose core module declares jackson-databind
      # at compile scope with no version of its own, supplied by an
      # imported jackson-bom. One declared coordinate, three resolved
      # components.
      - name: "Checkout test project: lfreleng-actions/test-maven-project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfreleng-actions/test-maven-project
          # yamllint disable-line rule:line-length
          ref: bf7b7ec62d40a04cffc8824cf691e6333972fcb1 # v0.1.0
          path: test-project
          persist-credentials: false

      - name: "Running local action: cyclonedx backend"
        id: cyclonedx
        uses: $/
        with:
          backend: cyclonedx
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-maven
          # This workflow runs on pull requests from a fork, so the
          # 'auto' default would skip. The override is correct here and
          # not a workaround: the checkout being scanned is
          # test-maven-project pinned to an immutable org-owned commit,
          # not the pull request's own content. The skip path is
          # covered separately below.
          untrusted_checkout: 'false'

      - name: "Running local action: cyclonedx backend with test scope"
        id: cyclonedx-dev
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-maven-dev
          include_dev: 'true'

      # The plugin cannot split formats across directories, so these two
      # runs exercise the backend-specific placement logic: 'both'
      # writes straight to the output directory, while 'xml' generates
      # both into a scratch directory and moves only the XML across.
      - name: "Running local action: cyclonedx backend, both formats"
        id: cyclonedx-both
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: both
          filename_prefix: sbom-maven-both
          output_directory: maven-both-out

      - name: "Running local action: cyclonedx backend, XML only"
        id: cyclonedx-xml
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: xml
          filename_prefix: sbom-maven-xml
          output_directory: maven-xml-out

      - name: "Running local action: maven_args override rejected"
        id: cyclonedx-args-override
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          maven_args: '-DoutputDirectory=/tmp/escape'

      # The plugin does not reject a schema version it cannot produce;
      # it silently falls back to its own default. Without the
      # post-generation check this run would report success over a
      # document carrying a different version than the one requested.
      - name: "Running local action: unsupported spec version"
        id: cyclonedx-bad-spec
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-maven-badspec
          sbom_spec_version: '9.9'

      - name: "Verify the resolved dependency graph"
        shell: bash
        env:
          CDX_JSON: ${{ steps.cyclonedx.outputs.sbom_json_path }}
          CDX_COUNT: ${{ steps.cyclonedx.outputs.component_count }}
          CDX_BACKEND: ${{ steps.cyclonedx.outputs.backend }}
          # yamllint disable-line rule:line-length
          CDX_MANAGER: ${{ steps.cyclonedx.outputs.dependency_manager }}
          DEV_JSON: ${{ steps.cyclonedx-dev.outputs.sbom_json_path }}
          DEV_COUNT: ${{ steps.cyclonedx-dev.outputs.component_count }}
          BOTH_JSON: ${{ steps.cyclonedx-both.outputs.sbom_json_path }}
          BOTH_XML: ${{ steps.cyclonedx-both.outputs.sbom_xml_path }}
          XML_ONLY_JSON: ${{ steps.cyclonedx-xml.outputs.sbom_json_path }}
          XML_ONLY_XML: ${{ steps.cyclonedx-xml.outputs.sbom_xml_path }}
          OVERRIDE_OUTCOME: ${{ steps.cyclonedx-args-override.outcome }}
          BAD_SPEC_OUTCOME: ${{ steps.cyclonedx-bad-spec.outcome }}
        run: |
          # Verify the resolved dependency graph
          errors=0
          if [ "${CDX_BACKEND}" != "cyclonedx" ]; then
            echo "Unexpected backend output: ${CDX_BACKEND} ❌"
            errors=1
          fi
          # The backend names the tool, not the build system, so the
          # build system has to surface separately or the caller cannot
          # tell which plugin ran
          if [ "${CDX_MANAGER}" != "maven" ]; then
            echo "Unexpected dependency_manager: ${CDX_MANAGER} ❌"
            errors=1
          fi
          if [ ! -f "${CDX_JSON}" ]; then
            echo "CycloneDX SBOM not found: ${CDX_JSON} ❌"
            exit 1
          fi
          if ! jq -e '.bomFormat == "CycloneDX"' \
            "${CDX_JSON}" > /dev/null; then
            echo "Generated document is not CycloneDX ❌"
            errors=1
          fi

          # Transitive resolution: jackson-core is declared nowhere in
          # the fixture's POMs and can only appear beneath
          # jackson-databind, so its presence proves the graph was
          # resolved rather than parsed
          for artifact in jackson-databind jackson-core; do
            if ! jq -e --arg name "${artifact}" \
              '[.components[] | select(.name == $name)] | length > 0' \
              "${CDX_JSON}" > /dev/null; then
              echo "Transitive component missing: ${artifact} ❌"
              errors=1
            fi
          done

          # BOM-managed version resolution: a component without a
          # usable version cannot be matched against a vulnerability
          # database, so it is silently unscannable
          unresolved=$(jq '[.components[]
            | select((.version // "") == "" or .version == "UNKNOWN")]
            | length' "${CDX_JSON}")
          if [ "${unresolved}" != "0" ]; then
            echo "Components with unresolved versions: ${unresolved} ❌"
            jq -r '.components[]
              | select((.version // "") == "" or .version == "UNKNOWN")
              | "  \(.name)"' "${CDX_JSON}"
            errors=1
          fi

          # The plugin emits the parent/child relationships syft does
          # not, which is what makes a finding traceable to the direct
          # dependency that pulled it in
          if ! jq -e '(.dependencies // []) | length > 0' \
            "${CDX_JSON}" > /dev/null; then
            echo "SBOM carries no dependency graph ❌"
            errors=1
          fi

          # Test scope stays out by default: test dependencies are
          # absent from the shipped artefact, so a BOM describing that
          # artefact must not list them
          if jq -e '[.components[]
            | select(.name == "junit-jupiter")] | length > 0' \
            "${CDX_JSON}" > /dev/null; then
            echo "Test-scope dependency present by default ❌"
            errors=1
          fi
          if ! jq -e '[.components[]
            | select(.name == "junit-jupiter")] | length > 0' \
            "${DEV_JSON}" > /dev/null; then
            echo "include_dev did not add test-scope dependencies ❌"
            errors=1
          fi
          if [ "${DEV_COUNT}" -le "${CDX_COUNT}" ]; then
            echo "Test scoping made no difference ❌"
            echo "Default: ${CDX_COUNT}, with test scope: ${DEV_COUNT}"
            errors=1
          fi

          # Format placement. 'both' writes both documents to the
          # output directory; 'xml' must leave the XML there and no
          # JSON, since a stray JSON would be collected by the
          # sbom-cyclonedx.* artifact glob the workflows rely on
          if [ ! -f "${BOTH_JSON}" ] || [ ! -f "${BOTH_XML}" ]; then
            echo "Both-format run did not emit both documents ❌"
            errors=1
          fi
          if [ -n "${XML_ONLY_JSON}" ]; then
            echo "XML-only run: unexpected JSON output path ❌"
            errors=1
          fi
          if [ ! -f "${XML_ONLY_XML}" ]; then
            echo "XML-only run: XML SBOM missing ❌"
            errors=1
          fi
          if [ -n "$(find maven-xml-out -name '*.json' 2>/dev/null)" ]
          then
            echo "XML-only run left a JSON document behind ❌"
            errors=1
          fi

          # maven_args must not be able to redirect the output
          # directory away from the validated location
          if [ "${OVERRIDE_OUTCOME}" = "success" ]; then
            echo "Protected maven_args override was accepted ❌"
            errors=1
          fi
          if [ -e /tmp/escape ]; then
            echo "maven_args override escaped the output directory ❌"
            errors=1
          fi

          # A spec version the plugin cannot produce must fail rather
          # than yield a document quietly carrying a different one
          if [ "${BAD_SPEC_OUTCOME}" = "success" ]; then
            echo "Unsupported spec version reported success ❌"
            errors=1
          fi
          # ...and must leave nothing behind. The plugin writes a
          # well-formed BOM before the mismatch is detected, so without
          # cleanup on rejection the artifact glob would collect and
          # publish a document this action had already rejected
          if [ -n "$(find . -maxdepth 1 -name 'sbom-maven-badspec.*' \
            2>/dev/null)" ]; then
            echo "Rejected document left in the output directory ❌"
            find . -maxdepth 1 -name 'sbom-maven-badspec.*'
            errors=1
          fi

          if [ "${errors}" != "0" ]; then
            echo "CycloneDX backend verification failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "CycloneDX backend verified: ${CDX_COUNT} components ✅"
          {
            echo "CycloneDX backend verified ✅"
            echo "Shipped components: ${CDX_COUNT}"
            echo "With test scope: ${DEV_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"


  ### Test the cyclonedx backend against Gradle ###
  # Gradle is worse off than Maven before this backend: syft catalogs
  # gradle.lockfile and nothing else, and dependency locking is opt-in,
  # so a typical Gradle project yields no third-party components at all
  # rather than a partial graph. Measured against the fixture below,
  # syft finds zero where this backend finds six.
  # See lfreleng-actions/java-workflows#48.
  test-cyclonedx-gradle:
    name: "Test: cyclonedx backend (Gradle)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      # Block, as everywhere else here. The shared allow-list carries
      # Maven Central, api.adoptium.net, services.gradle.org for the
      # wrapper distribution, and both Gradle Plugin Portal hosts for
      # the plugin itself, which resolves from the portal rather than
      # Central: plugins.gradle.org serves the marker and 302-redirects
      # the POM and JAR to plugins-artifacts.gradle.org.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Multi-project reactor whose core module declares jackson-databind
      # with no version of its own, supplied by an imported platform.
      # One declared coordinate, three resolved components, and the root
      # is Groovy DSL while app is Kotlin DSL, so both dialects are
      # exercised by one build.
      - name: "Checkout test project: lfreleng-actions/test-gradle-project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfreleng-actions/test-gradle-project
          # yamllint disable-line rule:line-length
          ref: ad91147966624cff011fd98dd5f1b4ed24429e60 # v0.0.1
          path: test-project
          persist-credentials: false

      - name: "Running local action: Gradle, detected"
        id: gradle
        uses: $/
        with:
          backend: cyclonedx
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-gradle
          # As in the Maven job: the tree being scanned is an immutable
          # org-owned commit, not this pull request's content.
          untrusted_checkout: 'false'

      # The same project with the build tool declared rather than
      # detected, which is how java-workflows calls this action: the
      # lane already knows, so it does not ask.
      - name: "Running local action: Gradle, declared"
        id: gradle-declared
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          dependency_manager: gradle
          path_prefix: test-project
          sbom_format: both
          filename_prefix: sbom-gradle-declared
          output_directory: gradle-both-out

      - name: "Running local action: Gradle with test configurations"
        id: gradle-dev
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-gradle-dev
          include_dev: 'true'

      # Below the plugin's floor the action skips rather than fails: an
      # SBOM audit is not essential to a build, and failing a pipeline
      # over a plugin's declared dependency would punish a project for
      # something unrelated to its code.
      - name: "Running local action: Gradle below the plugin floor"
        id: gradle-too-old
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-gradle-old
          gradle_version: '8.0'

      - name: "Running local action: gradle_args escape rejected"
        id: gradle-args-escape
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          gradle_args: '-p /tmp/escape'

      - name: "Running local action: gradle_args override rejected"
        id: gradle-args-override
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          gradle_args: '-DsbomAction.configs=everything'

      # Declaring a build tool the checkout does not carry is a caller
      # error, not something to paper over: the backend would drive a
      # tool this project does not use.
      - name: "Running local action: wrong build tool declared"
        id: gradle-wrong-tool
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          dependency_manager: maven
          path_prefix: test-project

      - name: "Verify the resolved Gradle dependency graph"
        shell: bash
        env:
          GRADLE_JSON: ${{ steps.gradle.outputs.sbom_json_path }}
          GRADLE_COUNT: ${{ steps.gradle.outputs.component_count }}
          # yamllint disable-line rule:line-length
          GRADLE_MANAGER: ${{ steps.gradle.outputs.dependency_manager }}
          GRADLE_BACKEND: ${{ steps.gradle.outputs.backend }}
          # yamllint disable-line rule:line-length
          DECLARED_JSON: ${{ steps.gradle-declared.outputs.sbom_json_path }}
          # yamllint disable-line rule:line-length
          DECLARED_XML: ${{ steps.gradle-declared.outputs.sbom_xml_path }}
          DEV_COUNT: ${{ steps.gradle-dev.outputs.component_count }}
          OLD_SKIPPED: ${{ steps.gradle-too-old.outputs.skipped }}
          OLD_COUNT: ${{ steps.gradle-too-old.outputs.component_count }}
          # yamllint disable-line rule:line-length
          ESCAPE_OUTCOME: ${{ steps.gradle-args-escape.outcome }}
          # yamllint disable-line rule:line-length
          OVERRIDE_OUTCOME: ${{ steps.gradle-args-override.outcome }}
          # yamllint disable-line rule:line-length
          WRONG_TOOL_OUTCOME: ${{ steps.gradle-wrong-tool.outcome }}
          PROJECT_DIR: test-project
        run: |
          # Verify the Gradle path of the cyclonedx backend
          failures=0
          fail() {
            # Reads $* rather than $1: several call sites split their
            # message across arguments to stay inside the line limit,
            # and reading only the first would report half of it.
            echo "::error::$*"
            failures=$((failures + 1))
          }

          [ "${GRADLE_BACKEND}" = "cyclonedx" ] || \
            fail "backend output was '${GRADLE_BACKEND}'"
          [ "${GRADLE_MANAGER}" = "gradle" ] || \
            fail "dependency_manager was '${GRADLE_MANAGER}'"

          # The declared coordinate carries no version of its own, so a
          # generator reading the build script as text cannot resolve
          # it. Asserting the versions, not merely the names, is what
          # separates a resolved graph from a parsed one.
          for coord in \
            "com.fasterxml.jackson.core:jackson-databind:2.22.2" \
            "com.fasterxml.jackson.core:jackson-core:2.22.2" \
            "com.fasterxml.jackson.core:jackson-annotations:2.22"; do
            group="${coord%%:*}"
            rest="${coord#*:}"
            name="${rest%%:*}"
            version="${rest#*:}"
            if ! jq -e --arg g "${group}" --arg n "${name}" \
              --arg v "${version}" '
              [.components[]? | select(.group == $g and .name == $n
                and .version == $v)] | length > 0
            ' "${GRADLE_JSON}" >/dev/null; then
              fail "missing resolved component ${coord}"
            fi
          done

          # jackson-annotations resolves to 2.22 while the others resolve
          # to 2.22.2, so a generator cannot fake the graph by copying
          # one version across every entry.
          if ! jq -e '
            [.components[]? | select(.group | startswith("com.fasterxml"))
              | .version] | unique | length > 1
          ' "${GRADLE_JSON}" >/dev/null; then
            fail "every jackson component carries the same version"
          fi

          # No component may carry an unresolved version: that is the
          # exact failure mode this backend exists to remove.
          if jq -e '
            [.components[]? | select((.version // "") == ""
              or .version == "UNKNOWN")] | length > 0
          ' "${GRADLE_JSON}" >/dev/null; then
            fail "a component carries an empty or UNKNOWN version"
          fi

          # Including test configurations must widen the graph, or
          # include_dev is not reaching the plugin.
          if [ "${DEV_COUNT}" -le "${GRADLE_COUNT}" ]; then
            fail "include_dev did not widen the graph" \
              "(${DEV_COUNT} vs ${GRADLE_COUNT})"
          fi

          # Declaring the build tool must produce the same graph as
          # detecting it.
          declared_count="$(jq '[.components[]?] | length' "${DECLARED_JSON}")"
          if [ "${declared_count}" != "${GRADLE_COUNT}" ]; then
            fail "declared run found ${declared_count}," \
              "detected found ${GRADLE_COUNT}"
          fi
          [ -f "${DECLARED_XML}" ] || fail "both-format run wrote no XML"

          # Below the floor: skipped, with no document and no count.
          [ "${OLD_SKIPPED}" = "true" ] || \
            fail "an unsupported Gradle version was not skipped"
          [ -z "${OLD_COUNT}" ] || \
            fail "a skipped run reported a component count"

          for check in "ESCAPE_OUTCOME:${ESCAPE_OUTCOME}" \
            "OVERRIDE_OUTCOME:${OVERRIDE_OUTCOME}" \
            "WRONG_TOOL_OUTCOME:${WRONG_TOOL_OUTCOME}"; do
            if [ "${check#*:}" != "failure" ]; then
              fail "${check%%:*} was '${check#*:}', expected failure"
            fi
          done

          # The action drives the project's own build tool, so Gradle
          # creates build directories. What it must not do is leave its
          # own reports behind in them for an artifact glob to collect.
          strays="$(find "${PROJECT_DIR}" -path '*reports/cyclonedx*' \
            \( -name 'bom.json' -o -name 'bom.xml' \) | wc -l)"
          if [ "${strays}" != "0" ]; then
            fail "${strays} plugin reports left inside the checkout"
          fi

          if [ "${failures}" != "0" ]; then
            echo "Gradle backend verification failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Gradle backend verified: ${GRADLE_COUNT} components ✅"
          {
            echo "Gradle backend verified ✅"
            echo "Shipped components: ${GRADLE_COUNT}"
            echo "With test configurations: ${DEV_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

  ### Test the cyclonedx backend against Cargo ###
  # Syft reads Cargo.lock and lists every locked crate, whatever needs
  # it, with no scope and no dependency graph. cargo-cyclonedx reads
  # cargo's own resolution instead. See lfreleng-actions/sbom-action#51.
  test-cyclonedx-cargo:
    name: "Test: cyclonedx backend (Cargo)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      # Block, like every other job here: cargo runs a rustc wrapper
      # from the checkout, which one fixture below does on purpose.
      # The shared allow-list carries index.crates.io and
      # static.crates.io, which cargo metadata reads dependency
      # manifests from.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A commit on main, not a tag: no release carries variants/ yet.
      # The root crate has no dependencies; variants/dependencies
      # locks semver from crates.io; variants/workspace is a virtual
      # workspace whose cli member depends on core, and core on support
      # as a dev-dependency only.
      - name: "Checkout test project: lfreleng-actions/test-rust-project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfreleng-actions/test-rust-project
          # yamllint disable-line rule:line-length
          ref: 37adc93cbaec02ec641db12f91c9f4d567cac554 # main, after v0.0.3
          path: test-project
          persist-credentials: false

      - name: "Derive Cargo fixtures"
        shell: bash
        run: |
          # Derive Cargo fixtures
          set -euo pipefail
          # Each copy keeps variants/dependencies' Cargo.lock as it is.
          # A lockfile records a package's dependencies without their
          # kind or platform, so moving semver to another table leaves
          # it current for --locked and nothing resolves afresh.
          src=test-project/variants/dependencies
          mkdir -p cargo-fixtures
          derive() {
            cp -R "${src}" "cargo-fixtures/$1"
            sed -i "s/^\[dependencies\]$/$2/" "cargo-fixtures/$1/Cargo.toml"
          }
          derive build-only '[build-dependencies]'
          derive dev-only '[dev-dependencies]'
          derive windows-only "[target.'cfg(windows)'.dependencies]"

          # Stale: a dependency the lockfile does not record
          cp -R "${src}" cargo-fixtures/stale
          printf 'itoa = "1"\n' >> cargo-fixtures/stale/Cargo.toml
          cp cargo-fixtures/stale/Cargo.lock cargo-fixtures/stale.lock

          # Spy: a rustc wrapper from the checkout, which cargo
          # executes, records the environment it runs with. The single
          # quotes are deliberate: the wrapper expands them, not this step.
          cp -R "${src}" cargo-fixtures/spy
          mkdir -p cargo-fixtures/spy/.cargo
          # shellcheck disable=SC2016
          printf '%s\n' '#!/bin/sh' \
            'env >> "$(dirname "$0")/spy-env.txt"' 'exec "$@"' \
            > cargo-fixtures/spy/spy.sh
          chmod +x cargo-fixtures/spy/spy.sh
          printf '[build]\nrustc-wrapper = "./spy.sh"\n' \
            > cargo-fixtures/spy/.cargo/config.toml

      # untrusted_checkout is 'false' throughout for the reason the
      # Maven job gives: the trees scanned are a pinned org-owned
      # commit and copies of it, not the pull request's own content.
      - name: "Running local action: Cargo, single crate"
        id: crate
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-crate
          output_directory: cargo-out

      - name: "Running local action: Cargo, crates.io dependency"
        id: deps
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project/variants/dependencies
          sbom_format: both
          filename_prefix: sbom-deps
          output_directory: cargo-out

      - name: "Running local action: Cargo, workspace"
        id: workspace
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          dependency_manager: cargo
          path_prefix: test-project/variants/workspace
          sbom_format: json
          filename_prefix: sbom-workspace
          output_directory: cargo-out

      - name: "Running local action: Cargo, one workspace member"
        id: member
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project/variants/workspace/cli
          sbom_format: json
          filename_prefix: sbom-member
          output_directory: cargo-out

      - name: "Running local action: Cargo, workspace as XML only"
        id: workspace-xml
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project/variants/workspace
          sbom_format: xml
          filename_prefix: sbom-workspace
          output_directory: cargo-xml-out

      - name: "Running local action: Cargo, build-dependency"
        id: build
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-fixtures/build-only
          sbom_format: json
          filename_prefix: sbom-build
          output_directory: cargo-out

      - name: "Running local action: Cargo, build-dependency, include_dev"
        id: build-dev
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-fixtures/build-only
          sbom_format: json
          filename_prefix: sbom-build-dev
          output_directory: cargo-out
          include_dev: 'true'

      - name: "Running local action: Cargo, dev-dependency, include_dev"
        id: dev-dev
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-fixtures/dev-only
          sbom_format: json
          filename_prefix: sbom-dev-dev
          output_directory: cargo-out
          include_dev: 'true'

      # The runner is Linux, so only --target all can see a
      # Windows-only dependency. CARGO_BUILD_TARGET would override
      # that inside cargo-cyclonedx; the action removes it.
      - name: "Running local action: Cargo, every target"
        id: target-all
        uses: $/
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-fixtures/windows-only
          sbom_format: json
          filename_prefix: sbom-target-all
          output_directory: cargo-out

      - name: "Running local action: Cargo, one target"
        id: target-linux
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-fixtures/windows-only
          sbom_format: json
          filename_prefix: sbom-target-linux
          output_directory: cargo-out
          cargo_target: x86_64-unknown-linux-gnu

      - name: "Running local action: Cargo, no lockfile"
        id: no-lockfile
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project/variants/no-lockfile
          sbom_format: json
          filename_prefix: sbom-no-lockfile
          output_directory: cargo-out

      # Placeholder values, present so the spy can prove their absence
      - name: "Running local action: Cargo, environment scrub"
        id: spy
        uses: $/
        env:
          CARGO_REGISTRY_TOKEN: placeholder
          CARGO_REGISTRIES_PRIVATE_TOKEN: placeholder
          CARGO_REGISTRIES_PRIVATE_INDEX: sparse+https://example.invalid/
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: placeholder
          ACTIONS_ID_TOKEN_REQUEST_URL: https://example.invalid/
          ACTIONS_RUNTIME_TOKEN: placeholder
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-fixtures/spy
          sbom_format: json
          filename_prefix: sbom-spy
          output_directory: cargo-out

      - name: "Running local action: Cargo, stale lockfile"
        id: stale
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-fixtures/stale
          filename_prefix: sbom-stale
          output_directory: cargo-out

      - name: "Running local action: Cargo, unsupported spec version"
        id: spec
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: test-project/variants/dependencies
          sbom_spec_version: '1.6'
          filename_prefix: sbom-spec
          output_directory: cargo-out

      - name: "Running local action: Cargo, untrusted checkout"
        id: untrusted
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'true'
          path_prefix: test-project
          filename_prefix: sbom-untrusted
          output_directory: cargo-out

      - name: "Verify the Cargo dependency graphs"
        shell: bash
        env:
          CRATE_JSON: ${{ steps.crate.outputs.sbom_json_path }}
          CRATE_MANAGER: ${{ steps.crate.outputs.dependency_manager }}
          CRATE_COUNT: ${{ steps.crate.outputs.component_count }}
          DEPS_JSON: ${{ steps.deps.outputs.sbom_json_path }}
          DEPS_XML: ${{ steps.deps.outputs.sbom_xml_path }}
          WS_JSON: ${{ steps.workspace.outputs.sbom_json_path }}
          WS_COUNT: ${{ steps.workspace.outputs.component_count }}
          MEMBER_JSON: ${{ steps.member.outputs.sbom_json_path }}
          WS_XML: ${{ steps.workspace-xml.outputs.sbom_xml_path }}
          WS_XML_JSON: ${{ steps.workspace-xml.outputs.sbom_json_path }}
          BUILD_JSON: ${{ steps.build.outputs.sbom_json_path }}
          BUILD_DEV_JSON: ${{ steps.build-dev.outputs.sbom_json_path }}
          DEV_DEV_JSON: ${{ steps.dev-dev.outputs.sbom_json_path }}
          ALL_JSON: ${{ steps.target-all.outputs.sbom_json_path }}
          LINUX_JSON: ${{ steps.target-linux.outputs.sbom_json_path }}
          NO_LOCK_JSON: ${{ steps.no-lockfile.outputs.sbom_json_path }}
          SPY_JSON: ${{ steps.spy.outputs.sbom_json_path }}
          STALE_OUTCOME: ${{ steps.stale.outcome }}
          SPEC_OUTCOME: ${{ steps.spec.outcome }}
          UNTRUSTED_SKIPPED: ${{ steps.untrusted.outputs.skipped }}
        run: |
          # Verify the Cargo dependency graphs
          failures=0
          fail() {
            echo "$* ❌"
            failures=$((failures + 1))
          }
          # The names of the components a document lists, one per line,
          # as "name:scope" ("-" for none)
          components() {
            jq -r '.components[]? | "\(.name):\(.scope // "-")"' "$1"
          }
          # The dependsOn list of the component called $2, by name
          depends_on() {
            jq -r --arg name "$2" '
              ([.metadata.component] + .components) as $all
              | ($all[] | select(.name == $name) | .["bom-ref"]) as $ref
              | .dependencies[] | select(.ref == $ref)
              | .dependsOn[]? as $d | $all[]
              | select(.["bom-ref"] == $d) | .name' "$1"
          }

          for doc in "${CRATE_JSON}" "${DEPS_JSON}" "${WS_JSON}" \
            "${MEMBER_JSON}" "${BUILD_JSON}" "${BUILD_DEV_JSON}" \
            "${DEV_DEV_JSON}" "${ALL_JSON}" "${LINUX_JSON}" \
            "${NO_LOCK_JSON}" "${SPY_JSON}"; do
            if [ ! -f "${doc}" ]; then
              fail "Expected document missing: ${doc:-<empty output>}"
              continue
            fi
            # tools is a list up to spec 1.4 and an object from 1.5;
            # cargo-cyclonedx writes the list form at 1.5 too
            if ! jq -e '.metadata.tools
              | (if type == "array" then . else .components // [] end)
              | any(.name? == "cargo-cyclonedx")' "${doc}" > /dev/null
            then
              fail "Document not produced by cargo-cyclonedx: ${doc}"
            fi
          done
          if [ "${failures}" != "0" ]; then
            exit 1
          fi

          # A crate with no dependencies, found by auto-detection
          [ "${CRATE_MANAGER}" = "cargo" ] || \
            fail "auto did not detect Cargo: ${CRATE_MANAGER}"
          [ "${CRATE_COUNT}" = "0" ] || \
            fail "Dependency-free crate lists ${CRATE_COUNT} components"
          jq -e '.metadata.component.name == "lfreleng-test-rust-project"' \
            "${CRATE_JSON}" > /dev/null || \
            fail "Single crate is not the anchor component"

          # Single root: metadata.component names the crate and its
          # dependencies entry lists what it declares
          [ "$(components "${DEPS_JSON}")" = "semver:required" ] || \
            fail "crates.io dependency: unexpected components"
          [ "$(depends_on "${DEPS_JSON}" \
            lfreleng-fixture-dependencies)" = "semver" ] || \
            fail "Anchor does not depend on semver"
          grep -q 'xmlns="http://cyclonedx.org/schema/bom/1.5"' \
            "${DEPS_XML}" || fail "XML document is not CycloneDX 1.5"
          grep -q '<name>semver</name>' "${DEPS_XML}" || \
            fail "XML document lacks semver"

          # Workspace: one document, the reactor shape. The root has no
          # edges; every member is an unscoped component with its own.
          ws_core="lfreleng-fixture-workspace-core"
          ws_core="${ws_core}-name-too-long-for-crates-io-by-design"
          ws_cli="lfreleng-fixture-workspace-cli"
          ws_cli="${ws_cli}-name-too-long-for-crates-io-by-design"
          expected="$(printf '%s\n' "${ws_core}:-" \
            "lfreleng-fixture-workspace-support:-" "${ws_cli}:-" | sort)"
          [ "$(components "${WS_JSON}" | sort)" = "${expected}" ] || \
            fail "Workspace members are not unscoped components"
          [ "${WS_COUNT}" = "3" ] || \
            fail "Workspace component_count: ${WS_COUNT}"
          jq -e '.metadata.component["bom-ref"] as $root
            | [.dependencies[] | select(.ref == $root)]
            | length == 1 and ((.[0].dependsOn // []) | length == 0)' \
            "${WS_JSON}" > /dev/null || \
            fail "Workspace root is not an edgeless dependencies entry"
          [ "$(depends_on "${WS_JSON}" "${ws_cli}")" = "${ws_core}" ] || \
            fail "Workspace lost the cli -> core edge"
          [ -z "$(depends_on "${WS_JSON}" "${ws_core}")" ] || \
            fail "core's dev-dependency appears as an edge"

          # path_prefix at a member describes that member alone
          jq -e --arg cli "${ws_cli}" '.metadata.component.name == $cli' \
            "${MEMBER_JSON}" > /dev/null || fail "Member is not the anchor"
          [ "$(components "${MEMBER_JSON}")" = "${ws_core}:required" ] \
            || fail "Member document: unexpected components"

          [ -f "${WS_XML}" ] || fail "XML-only workspace run wrote no XML"
          [ -z "${WS_XML_JSON}" ] || fail "XML-only run reported JSON"
          [ -z "$(find cargo-xml-out -name '*.json')" ] || \
            fail "XML-only run left a JSON document behind"

          # include_dev: build-dependencies only, scoped excluded;
          # dev-dependencies never
          [ -z "$(components "${BUILD_JSON}")" ] || \
            fail "Build-dependency present without include_dev"
          [ "$(components "${BUILD_DEV_JSON}")" = "semver:excluded" ] \
            || fail "include_dev did not add the build-dependency"
          [ -z "$(components "${DEV_DEV_JSON}")" ] || \
            fail "Dev-dependency present"

          # Targets
          [ "$(components "${ALL_JSON}")" = "semver:required" ] || \
            fail "Windows-only dependency missing under every target"
          [ -z "$(components "${LINUX_JSON}")" ] || \
            fail "Windows-only dependency present for a Linux target"

          # A missing lockfile resolves for the run and is removed
          [ ! -e test-project/variants/no-lockfile/Cargo.lock ] || \
            fail "The resolved Cargo.lock was left in the checkout"

          # The scrub, as code from the checkout sees it
          spy=cargo-fixtures/spy/spy-env.txt
          if [ ! -s "${spy}" ]; then
            fail "The rustc wrapper never ran"
          else
            for name in CARGO_REGISTRY_TOKEN \
              CARGO_REGISTRIES_PRIVATE_TOKEN \
              ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN \
              GITHUB_OUTPUT GITHUB_ENV GITHUB_PATH GITHUB_STATE \
              GITHUB_STEP_SUMMARY; do
              if grep -q "^${name}=" "${spy}"; then
                fail "${name} reached code from the checkout"
              fi
            done
            grep -q '^CARGO_REGISTRIES_PRIVATE_INDEX=' "${spy}" || \
              fail "The scrub removed a registry setting"
          fi

          # Failures
          [ "${STALE_OUTCOME}" = "failure" ] || \
            fail "A stale Cargo.lock did not fail the run"
          cmp -s cargo-fixtures/stale.lock cargo-fixtures/stale/Cargo.lock \
            || fail "The run rewrote a stale Cargo.lock"
          [ "${SPEC_OUTCOME}" = "failure" ] || \
            fail "CycloneDX 1.6 did not fail for Cargo"
          [ "${UNTRUSTED_SKIPPED}" = "true" ] || \
            fail "An untrusted Cargo checkout was not skipped"
          for prefix in sbom-stale sbom-spec sbom-untrusted; do
            [ -z "$(find cargo-out -name "${prefix}.*")" ] || \
              fail "${prefix}: a document survived a failed or skipped run"
          done

          # Nothing left in the checkout: no per-member documents and no
          # lockfile changes
          litter="$(git -C test-project status --porcelain)"
          [ -z "${litter}" ] || fail "Checkout changed: ${litter}"
          [ -z "$(find . -name 'sbom-action-*.json')" ] || \
            fail "cargo-cyclonedx documents left behind"

          if [ "${failures}" != "0" ]; then
            echo "Cargo backend verification failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Cargo backend verified ✅"
          {
            echo "Cargo backend verified ✅"
            echo "Workspace members described: ${WS_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

  ### Test Cargo feature selection ###
  # rust-workflows builds with the caller's features; an SBOM of the
  # default features alone could miss a dependency those builds ship.
  test-cyclonedx-cargo-features:
    name: "Test: cyclonedx backend (Cargo features)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      # The shared allow-list carries index.crates.io and
      # static.crates.io, which cargo metadata reads semver from
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # semver sits behind the 'versions' feature everywhere; 'extra'
      # enables nothing. crate-default makes 'versions' a default
      # feature. In the workspace, core carries the feature and app
      # depends on core. The lockfiles are written out whole, as cargo
      # writes them, so that --locked accepts them without a network
      # resolution, and the tree is its own repository so that git
      # status can prove the runs left every file as committed.
      - name: "Generate Cargo feature fixtures"
        shell: bash
        run: |
          # Generate Cargo feature fixtures
          set -euo pipefail
          root=cargo-features
          mkdir -p "${root}"
          lock_head() {
            printf '%s\n' '# This file is automatically @generated by Cargo.' \
              '# It is not intended for manual editing.' 'version = 4'
          }
          lock_semver() {
            local index="registry+https://github.com/rust-lang/crates.io-index"
            local sum="8a7852d02fc848982e0c167ef163aaff9cd91dc640ba85e2"
            sum="${sum}63cb1ce46fae51cd"
            printf '%s\n' '' '[[package]]' 'name = "semver"' \
              'version = "1.0.28"' "source = \"${index}\"" \
              "checksum = \"${sum}\""
          }
          for name in crate crate-default; do
            dir="${root}/${name}"
            mkdir -p "${dir}/src"
            : > "${dir}/src/lib.rs"
            default=()
            if [ "${name}" = "crate-default" ]; then
              default=('default = ["versions"]')
            fi
            printf '%s\n' '[package]' 'name = "lfreleng-fixture-features"' \
              'version = "0.1.0"' 'edition = "2021"' 'publish = false' '' \
              '[dependencies]' \
              'semver = { version = "1.0.28", optional = true }' '' \
              '[features]' ${default[@]+"${default[@]}"} \
              'versions = ["dep:semver"]' 'extra = []' > "${dir}/Cargo.toml"
            { lock_head
              printf '%s\n' '' '[[package]]' \
                'name = "lfreleng-fixture-features"' 'version = "0.1.0"' \
                'dependencies = [' ' "semver",' ']'
              lock_semver; } > "${dir}/Cargo.lock"
          done
          ws="${root}/workspace"
          mkdir -p "${ws}/core/src" "${ws}/app/src"
          : > "${ws}/core/src/lib.rs"
          : > "${ws}/app/src/lib.rs"
          printf '%s\n' '[workspace]' 'resolver = "2"' \
            'members = ["core", "app"]' > "${ws}/Cargo.toml"
          printf '%s\n' '[package]' 'name = "lfreleng-fixture-features-core"' \
            'version = "0.1.0"' 'edition = "2021"' 'publish = false' '' \
            '[dependencies]' \
            'semver = { version = "1.0.28", optional = true }' '' \
            '[features]' 'versions = ["dep:semver"]' > "${ws}/core/Cargo.toml"
          printf '%s\n' '[package]' 'name = "lfreleng-fixture-features-app"' \
            'version = "0.1.0"' 'edition = "2021"' 'publish = false' '' \
            '[dependencies]' \
            'lfreleng-fixture-features-core = { path = "../core" }' \
            > "${ws}/app/Cargo.toml"
          { lock_head
            printf '%s\n' '' '[[package]]' \
              'name = "lfreleng-fixture-features-app"' 'version = "0.1.0"' \
              'dependencies = [' ' "lfreleng-fixture-features-core",' ']' \
              '' '[[package]]' 'name = "lfreleng-fixture-features-core"' \
              'version = "0.1.0"' 'dependencies = [' ' "semver",' ']'
            lock_semver; } > "${ws}/Cargo.lock"
          git -C "${root}" init -q
          git -C "${root}" add -A
          git -C "${root}" -c user.name=fixture \
            -c user.email=fixture@example.invalid -c commit.gpgsign=false \
            commit -q -m "Cargo feature fixtures"

      # A cargo-cyclonedx ahead of the installed one on PATH, which the
      # action finds and runs as it would the real binary. It records
      # the arguments of each call, one per line, in SBOM_ARGV_LOG, so
      # the last call recorded is the one that generated the document.
      # Only cargo-cyclonedx: install-action installs into
      # ~/.install-action/bin, and puts that first on PATH, once the
      # first cargo on PATH lies outside $CARGO_HOME/bin, so a cargo
      # spy would push this one behind the real binary. The single
      # quotes are deliberate: the wrapper expands them.
      - name: "Install the cargo-cyclonedx argument spy"
        shell: bash
        run: |
          # Install the cargo-cyclonedx argument spy
          set -euo pipefail
          spy_dir="${RUNNER_TEMP}/cargo-cyclonedx-spy"
          mkdir -p "${spy_dir}"
          # shellcheck disable=SC2016
          printf '%s\n' '#!/bin/sh' \
            'if [ -n "${SBOM_ARGV_LOG:-}" ]; then' \
            '  printf "%s\n" "$@" > "${SBOM_ARGV_LOG}"' \
            'fi' \
            'self="$(cd "$(dirname "$0")" && pwd)"' \
            'IFS=:' \
            'for dir in ${PATH}; do' \
            '  [ "${dir}" = "${self}" ] && continue' \
            '  if [ -x "${dir}/cargo-cyclonedx" ]; then' \
            '    exec "${dir}/cargo-cyclonedx" "$@"' \
            '  fi' \
            'done' \
            'echo "cargo-cyclonedx not found behind the spy" >&2' \
            'exit 127' > "${spy_dir}/cargo-cyclonedx"
          chmod +x "${spy_dir}/cargo-cyclonedx"
          echo "${spy_dir}" >> "${GITHUB_PATH}"

      # untrusted_checkout is 'false' throughout: the trees scanned are
      # generated above, not the pull request's own content
      - name: "Running local action: Cargo features left at defaults"
        id: defaults
        uses: $/
        env:
          SBOM_ARGV_LOG: ${{ runner.temp }}/argv-defaults.txt
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-features/crate
          sbom_format: json
          filename_prefix: sbom-defaults
          output_directory: cargo-features-out

      # Whitespace, commas, a line break and package/feature syntax
      - name: "Running local action: Cargo, cargo_features"
        id: features
        uses: $/
        env:
          SBOM_ARGV_LOG: ${{ runner.temp }}/argv-features.txt
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-features/crate
          sbom_format: json
          filename_prefix: sbom-features
          output_directory: cargo-features-out
          cargo_features: |
            extra,
              lfreleng-fixture-features/versions ,

      - name: "Running local action: Cargo, cargo_all_features"
        id: all-features
        uses: $/
        env:
          SBOM_ARGV_LOG: ${{ runner.temp }}/argv-all-features.txt
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-features/crate
          sbom_format: json
          filename_prefix: sbom-all-features
          output_directory: cargo-features-out
          cargo_all_features: 'true'

      - name: "Running local action: Cargo, a default feature"
        id: default-feature
        uses: $/
        env:
          SBOM_ARGV_LOG: ${{ runner.temp }}/argv-default-feature.txt
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-features/crate-default
          sbom_format: json
          filename_prefix: sbom-default-feature
          output_directory: cargo-features-out

      - name: "Running local action: Cargo, cargo_no_default_features"
        id: no-default
        uses: $/
        env:
          SBOM_ARGV_LOG: ${{ runner.temp }}/argv-no-default.txt
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-features/crate-default
          sbom_format: json
          filename_prefix: sbom-no-default
          output_directory: cargo-features-out
          cargo_no_default_features: 'true'

      - name: "Running local action: Cargo features, workspace root"
        id: workspace
        uses: $/
        env:
          SBOM_ARGV_LOG: ${{ runner.temp }}/argv-workspace.txt
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-features/workspace
          sbom_format: json
          filename_prefix: sbom-workspace
          output_directory: cargo-features-out
          cargo_features: versions

      # app has no 'versions' feature: as with cargo build --workspace,
      # the selection applies across the workspace, so app's document
      # gains semver through core
      - name: "Running local action: Cargo features, workspace member"
        id: member
        uses: $/
        env:
          SBOM_ARGV_LOG: ${{ runner.temp }}/argv-member.txt
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-features/workspace/app
          sbom_format: json
          filename_prefix: sbom-member
          output_directory: cargo-features-out
          cargo_features: versions

      - name: "Running local action: Cargo, an unknown feature"
        id: unknown
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-features/crate
          sbom_format: json
          filename_prefix: sbom-unknown
          output_directory: cargo-features-out
          cargo_features: not-a-feature

      # Ignored outside Cargo, as cargo_target is
      - name: "Running local action: syft with the Cargo feature inputs"
        id: syft
        uses: $/
        with:
          path_prefix: cargo-features/crate
          sbom_format: json
          filename_prefix: sbom-syft
          output_directory: cargo-features-out
          cargo_features: versions
          cargo_all_features: 'true'
          cargo_no_default_features: 'true'

      # The lockfile preflight has to resolve the selected graph, not
      # the default one. This CARGO_HOME holds the crates.io index but
      # not semver, which only the default feature needs, so offline an
      # unflagged 'cargo metadata --locked' fails to download it
      # (measured) while the selected graph resolves.
      - name: "Prepare an offline CARGO_HOME without semver"
        shell: bash
        run: |
          # Prepare an offline CARGO_HOME without semver
          set -euo pipefail
          export CARGO_HOME="${RUNNER_TEMP}/cargo-home-offline"
          cargo metadata --locked --format-version 1 --no-default-features \
            --manifest-path cargo-features/crate-default/Cargo.toml \
            > /dev/null
          if [ -n "$(find "${CARGO_HOME}" -name '*.crate')" ]; then
            echo "The offline CARGO_HOME already holds a crate ❌"
            exit 1
          fi

      # Last of the runs: with this CARGO_HOME, install-action installs
      # into ~/.install-action/bin and puts that ahead of the spy on PATH
      - name: "Running local action: Cargo, no default features, offline"
        id: offline
        continue-on-error: true
        uses: $/
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home-offline
          CARGO_NET_OFFLINE: 'true'
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-features/crate-default
          sbom_format: json
          filename_prefix: sbom-offline
          output_directory: cargo-features-out
          cargo_no_default_features: 'true'

      - name: "Verify the Cargo feature selection"
        shell: bash
        env:
          DEFAULTS_JSON: ${{ steps.defaults.outputs.sbom_json_path }}
          FEATURES_JSON: ${{ steps.features.outputs.sbom_json_path }}
          ALL_JSON: ${{ steps.all-features.outputs.sbom_json_path }}
          # yamllint disable-line rule:line-length
          DEFAULT_FEATURE_JSON: ${{ steps.default-feature.outputs.sbom_json_path }}
          NO_DEFAULT_JSON: ${{ steps.no-default.outputs.sbom_json_path }}
          WS_JSON: ${{ steps.workspace.outputs.sbom_json_path }}
          MEMBER_JSON: ${{ steps.member.outputs.sbom_json_path }}
          UNKNOWN_OUTCOME: ${{ steps.unknown.outcome }}
          OFFLINE_OUTCOME: ${{ steps.offline.outcome }}
          OFFLINE_JSON: ${{ steps.offline.outputs.sbom_json_path }}
          SYFT_OUTCOME: ${{ steps.syft.outcome }}
          SYFT_MANAGER: ${{ steps.syft.outputs.dependency_manager }}
        run: |
          # Verify the Cargo feature selection
          failures=0
          fail() {
            echo "$* ❌"
            failures=$((failures + 1))
          }
          # "name:scope" for each component, sorted
          components() {
            jq -r '.components[]? | "\(.name):\(.scope // "-")"' "$1" \
              | sort
          }
          # The arguments the spy recorded for a run, with the fixture
          # directory and the random document name made stable
          fixtures="$(realpath -- cargo-features)"
          argv() {
            sed -e "s|^${fixtures}/|<fixtures>/|" \
              -e 's|^sbom-action-[0-9a-f]\{16\}$|<name>|' \
              "${RUNNER_TEMP}/argv-$1.txt"
          }
          # The arguments a run must have used: the call the action
          # makes without feature inputs, then the flags given
          expect_argv() {
            local run="$1" fixture="$2" expected
            shift 2
            expected="$(printf '%s\n' cyclonedx --manifest-path \
              "<fixtures>/${fixture}/Cargo.toml" --format json \
              --spec-version 1.5 --all --target all \
              --override-filename '<name>' --quiet --no-build-deps "$@")"
            if [ "$(argv "${run}")" != "${expected}" ]; then
              fail "${run}: unexpected cargo-cyclonedx arguments"
              diff <(echo "${expected}") <(argv "${run}") || true
            fi
          }
          crate="lfreleng-fixture-features"
          core="lfreleng-fixture-features-core"
          app="lfreleng-fixture-features-app"

          for doc in "${DEFAULTS_JSON}" "${FEATURES_JSON}" "${ALL_JSON}" \
            "${DEFAULT_FEATURE_JSON}" "${NO_DEFAULT_JSON}" "${WS_JSON}" \
            "${MEMBER_JSON}"; do
            if [ ! -f "${doc}" ]; then
              fail "Expected document missing: ${doc:-<empty output>}"
            fi
          done
          if [ "${failures}" != "0" ]; then
            exit 1
          fi

          # Defaults: no feature flag at all, and no optional dependency
          expect_argv defaults crate
          [ -z "$(components "${DEFAULTS_JSON}")" ] || \
            fail "Optional dependency present with default features"

          # One --features argument, normalised to commas
          expect_argv features crate \
            --features "extra,${crate}/versions"
          [ "$(components "${FEATURES_JSON}")" = "semver:required" ] || \
            fail "cargo_features did not add the optional dependency"

          expect_argv all-features crate --all-features
          [ "$(components "${ALL_JSON}")" = "semver:required" ] || \
            fail "cargo_all_features did not add the optional dependency"

          expect_argv default-feature crate-default
          [ "$(components "${DEFAULT_FEATURE_JSON}")" = "semver:required" ] \
            || fail "A default feature's dependency is missing"
          expect_argv no-default crate-default --no-default-features
          [ -z "$(components "${NO_DEFAULT_JSON}")" ] || \
            fail "cargo_no_default_features kept the default feature"

          # Workspace root: the merged document carries semver as
          # core's dependency
          expect_argv workspace workspace --features versions
          expected="$(printf '%s\n' "${app}:-" "${core}:-" \
            "semver:required" | sort)"
          [ "$(components "${WS_JSON}")" = "${expected}" ] || \
            fail "Workspace root: unexpected components"
          jq -e --arg core "${core}" '
            (.components[] | select(.name == $core) | .["bom-ref"]) as $c
            | (.components[] | select(.name == "semver") | .["bom-ref"])
              as $s
            | any(.dependencies[];
              .ref == $c and any(.dependsOn[]?; . == $s))' \
            "${WS_JSON}" > /dev/null || \
            fail "Workspace root: core does not depend on semver"

          # A member: the selection still applies across the workspace
          expect_argv member workspace/app --features versions
          expected="$(printf '%s\n' "${core}:required" "semver:required")"
          [ "$(components "${MEMBER_JSON}")" = "${expected}" ] || \
            fail "Workspace member: unexpected components"

          [ "${UNKNOWN_OUTCOME}" = "failure" ] || \
            fail "An unknown feature did not fail the run"
          [ -z "$(find cargo-features-out -name 'sbom-unknown.*')" ] || \
            fail "A document survived the unknown-feature run"

          # Offline, with semver absent: only a preflight that resolves
          # the selected graph lets this run through
          if [ "${OFFLINE_OUTCOME}" != "success" ]; then
            fail "The preflight resolved more than the selected features"
          elif [ -n "$(components "${OFFLINE_JSON}")" ]; then
            fail "Offline run: optional dependency present"
          fi

          [ "${SYFT_OUTCOME}" = "success" ] || \
            fail "The Cargo feature inputs failed a syft run"
          [ -z "${SYFT_MANAGER}" ] || \
            fail "syft reported a dependency manager: ${SYFT_MANAGER}"

          litter="$(git -C cargo-features status --porcelain)"
          [ -z "${litter}" ] || fail "Fixtures changed: ${litter}"

          if [ "${failures}" != "0" ]; then
            echo "Cargo feature verification failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Cargo feature selection verified ✅"
          echo "Cargo feature selection verified ✅" >> "$GITHUB_STEP_SUMMARY"

  ### Test running Cargo from a working directory ###
  # Cargo reads .cargo/config.toml from its working directory upward, so
  # a member's configuration applies only when Cargo runs there.
  test-cyclonedx-cargo-working-directory:
    name: "Test: cyclonedx backend (Cargo working directory)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      # Every Cargo call here runs offline, so none reaches crates.io;
      # the shared allow-list still serves the cargo-cyclonedx install
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A virtual workspace whose app member depends on core and on
      # semver from crates.io. app's .cargo/config.toml patches semver
      # with a local 1.99.0 outside the workspace, and Cargo.lock
      # records that patched graph, so cargo metadata --locked accepts
      # it only from app: from the root, offline, semver cannot resolve
      # (measured). app/nested is a package of its own, its own
      # workspace root: a Cargo call run from there that lost its
      # --manifest-path would describe it instead of the root's
      # workspace. Two symlinks inside the workspace lead out of it, to
      # a sibling of the workspace and to /tmp, and maven/ holds a
      # pom.xml for detection alone. The tree is its own repository so
      # that git status can prove the runs left every file as committed.
      - name: "Generate Cargo working directory fixtures"
        shell: bash
        run: |
          # Generate Cargo working directory fixtures
          set -euo pipefail
          root=cargo-wd
          ws="${root}/workspace"
          app="lfreleng-fixture-wd-app"
          core="lfreleng-fixture-wd-core"
          mkdir -p "${ws}/app/src" "${ws}/app/.cargo" "${ws}/core/src" \
            "${ws}/app/nested/src" "${root}/patch/semver/src" \
            "${root}/maven"
          : > "${ws}/app/src/lib.rs"
          : > "${ws}/app/nested/src/lib.rs"
          : > "${ws}/core/src/lib.rs"
          : > "${root}/patch/semver/src/lib.rs"
          printf '%s\n' '[workspace]' 'resolver = "2"' \
            'members = ["app", "core"]' > "${ws}/Cargo.toml"
          printf '%s\n' '[package]' "name = \"${app}\"" 'version = "0.1.0"' \
            'edition = "2021"' 'publish = false' '' '[dependencies]' \
            'semver = "1"' "${core} = { path = \"../core\" }" \
            > "${ws}/app/Cargo.toml"
          printf '%s\n' '[package]' "name = \"${core}\"" 'version = "0.1.0"' \
            'edition = "2021"' 'publish = false' > "${ws}/core/Cargo.toml"
          printf '%s\n' '[package]' 'name = "lfreleng-fixture-wd-nested"' \
            'version = "0.1.0"' 'edition = "2021"' 'publish = false' '' \
            '[workspace]' > "${ws}/app/nested/Cargo.toml"
          printf '%s\n' '[package]' 'name = "semver"' 'version = "1.99.0"' \
            'edition = "2021"' 'publish = false' \
            > "${root}/patch/semver/Cargo.toml"
          # The path is relative to the directory holding .cargo
          printf '%s\n' '[patch.crates-io]' \
            'semver = { path = "../../patch/semver" }' \
            > "${ws}/app/.cargo/config.toml"
          printf '%s\n' '# This file is automatically @generated by Cargo.' \
            '# It is not intended for manual editing.' 'version = 4' '' \
            '[[package]]' "name = \"${app}\"" 'version = "0.1.0"' \
            'dependencies = [' " \"${core}\"," ' "semver",' ']' '' \
            '[[package]]' "name = \"${core}\"" 'version = "0.1.0"' '' \
            '[[package]]' 'name = "semver"' 'version = "1.99.0"' \
            > "${ws}/Cargo.lock"
          ln -s ../patch "${ws}/to-patch"
          ln -s /tmp "${ws}/to-tmp"
          printf '%s\n' '<project/>' > "${root}/maven/pom.xml"
          git -C "${root}" init -q
          git -C "${root}" add -A
          git -C "${root}" -c user.name=fixture \
            -c user.email=fixture@example.invalid -c commit.gpgsign=false \
            commit -q -m "Cargo working directory fixtures"

      # A cargo-cyclonedx ahead of the installed one on PATH, as in the
      # feature tests, recording the directory it runs from and then
      # its arguments, one per line, in SBOM_ARGV_LOG. The last call
      # recorded is the one that generated the document. The single
      # quotes are deliberate: the wrapper expands them.
      - name: "Install the cargo-cyclonedx working directory spy"
        shell: bash
        run: |
          # Install the cargo-cyclonedx working directory spy
          set -euo pipefail
          spy_dir="${RUNNER_TEMP}/cargo-cyclonedx-spy"
          mkdir -p "${spy_dir}"
          # shellcheck disable=SC2016
          printf '%s\n' '#!/bin/sh' \
            'if [ -n "${SBOM_ARGV_LOG:-}" ]; then' \
            '  { pwd -P; printf "%s\n" "$@"; } > "${SBOM_ARGV_LOG}"' \
            'fi' \
            'self="$(cd "$(dirname "$0")" && pwd)"' \
            'IFS=:' \
            'for dir in ${PATH}; do' \
            '  [ "${dir}" = "${self}" ] && continue' \
            '  if [ -x "${dir}/cargo-cyclonedx" ]; then' \
            '    exec "${dir}/cargo-cyclonedx" "$@"' \
            '  fi' \
            'done' \
            'echo "cargo-cyclonedx not found behind the spy" >&2' \
            'exit 127' > "${spy_dir}/cargo-cyclonedx"
          chmod +x "${spy_dir}/cargo-cyclonedx"
          echo "${spy_dir}" >> "${GITHUB_PATH}"

      # untrusted_checkout is 'false' throughout, except where the skip
      # is the subject: the trees scanned are generated above, not the
      # pull request's own content
      - name: "Running local action: Cargo from a member, root described"
        id: member-dir
        uses: $/
        env:
          CARGO_NET_OFFLINE: 'true'
          SBOM_ARGV_LOG: ${{ runner.temp }}/argv-member-dir.txt
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-wd/workspace
          cargo_working_directory: cargo-wd/workspace/app
          sbom_format: json
          filename_prefix: sbom-wd-member-dir
          output_directory: cargo-wd-out

      # The same root without the input: Cargo runs from the root,
      # never sees app's patch, and the lockfile check fails
      - name: "Running local action: Cargo from the root, input empty"
        id: root-dir
        continue-on-error: true
        uses: $/
        env:
          CARGO_NET_OFFLINE: 'true'
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-wd/workspace
          sbom_format: json
          filename_prefix: sbom-wd-root-dir
          output_directory: cargo-wd-out

      # Empty, Cargo runs from path_prefix, here the member itself
      - name: "Running local action: Cargo at a member, input empty"
        id: member-default
        uses: $/
        env:
          CARGO_NET_OFFLINE: 'true'
          SBOM_ARGV_LOG: ${{ runner.temp }}/argv-member-default.txt
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-wd/workspace/app
          sbom_format: json
          filename_prefix: sbom-wd-member-default
          output_directory: cargo-wd-out

      # path_prefix itself, given as an absolute path
      - name: "Running local action: Cargo working directory at path_prefix"
        id: member-same
        uses: $/
        env:
          CARGO_NET_OFFLINE: 'true'
          SBOM_ARGV_LOG: ${{ runner.temp }}/argv-member-same.txt
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-wd/workspace/app
          # yamllint disable-line rule:line-length
          cargo_working_directory: ${{ github.workspace }}/cargo-wd/workspace/app
          sbom_format: json
          filename_prefix: sbom-wd-member-same
          output_directory: cargo-wd-out

      # Beneath app, in a package of its own: app's configuration still
      # applies, and only --manifest-path keeps Cargo on the root
      - name: "Running local action: Cargo from a nested package"
        id: member-nested
        uses: $/
        env:
          CARGO_NET_OFFLINE: 'true'
          SBOM_ARGV_LOG: ${{ runner.temp }}/argv-member-nested.txt
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-wd/workspace
          cargo_working_directory: cargo-wd/workspace/app/nested
          sbom_format: json
          filename_prefix: sbom-wd-member-nested
          output_directory: cargo-wd-out

      # The skip comes before detection, and needs no refusal
      - name: "Running local action: Cargo working directory, untrusted"
        id: untrusted
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'true'
          path_prefix: cargo-wd/workspace
          cargo_working_directory: cargo-wd/workspace/app
          filename_prefix: sbom-wd-untrusted
          output_directory: cargo-wd-out

      # Each of these differs from member-dir above in one input alone,
      # or on a tree the backend would otherwise describe, so each
      # fails on cargo_working_directory and nothing else. Validation
      # stops before reporting a dependency_manager, which the
      # verification checks too.
      - name: "Running local action: Cargo working directory outside"
        id: escape-absolute
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-wd/workspace
          cargo_working_directory: /tmp
          filename_prefix: sbom-wd-escape-absolute
          output_directory: cargo-wd-out

      - name: "Running local action: Cargo working directory, dot-dot"
        id: escape-dotdot
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-wd/workspace
          cargo_working_directory: cargo-wd/workspace/../../..
          filename_prefix: sbom-wd-escape-dotdot
          output_directory: cargo-wd-out

      - name: "Running local action: Cargo working directory above"
        id: above-prefix
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-wd/workspace
          cargo_working_directory: cargo-wd
          filename_prefix: sbom-wd-above-prefix
          output_directory: cargo-wd-out

      - name: "Running local action: Cargo working directory, symlink"
        id: link-prefix
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-wd/workspace
          cargo_working_directory: cargo-wd/workspace/to-patch
          filename_prefix: sbom-wd-link-prefix
          output_directory: cargo-wd-out

      - name: "Running local action: Cargo working directory, symlink out"
        id: link-workspace
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-wd/workspace
          cargo_working_directory: cargo-wd/workspace/to-tmp
          filename_prefix: sbom-wd-link-workspace
          output_directory: cargo-wd-out

      - name: "Running local action: Cargo working directory missing"
        id: missing
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-wd/workspace
          cargo_working_directory: cargo-wd/workspace/missing
          filename_prefix: sbom-wd-missing
          output_directory: cargo-wd-out

      - name: "Running local action: syft with a Cargo working directory"
        id: syft
        continue-on-error: true
        uses: $/
        with:
          path_prefix: cargo-wd/workspace
          cargo_working_directory: cargo-wd/workspace/app
          filename_prefix: sbom-wd-syft
          output_directory: cargo-wd-out

      # Untrusted, as is maven-declared below: a skipped run detects no
      # build tool, so only the refusal ahead of the skip can fail these
      - name: "Running local action: python with a Cargo working directory"
        id: python
        continue-on-error: true
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'true'
          path_prefix: tests/fixtures/python/uv
          cargo_working_directory: tests/fixtures/python/uv
          filename_prefix: sbom-wd-python
          output_directory: cargo-wd-out

      - name: "Running local action: Maven declared, Cargo working directory"
        id: maven-declared
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'true'
          dependency_manager: maven
          path_prefix: cargo-wd/maven
          cargo_working_directory: cargo-wd/maven
          filename_prefix: sbom-wd-maven-declared
          output_directory: cargo-wd-out

      - name: "Running local action: Maven detected, Cargo working directory"
        id: maven-detected
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-wd/maven
          cargo_working_directory: cargo-wd/maven
          filename_prefix: sbom-wd-maven-detected
          output_directory: cargo-wd-out

      - name: "Verify the Cargo working directory"
        shell: bash
        env:
          MEMBER_DIR_JSON: ${{ steps.member-dir.outputs.sbom_json_path }}
          ROOT_DIR_OUTCOME: ${{ steps.root-dir.outcome }}
          # yamllint disable-line rule:line-length
          ROOT_DIR_MANAGER: ${{ steps.root-dir.outputs.dependency_manager }}
          # yamllint disable-line rule:line-length
          MEMBER_DEFAULT_JSON: ${{ steps.member-default.outputs.sbom_json_path }}
          MEMBER_SAME_JSON: ${{ steps.member-same.outputs.sbom_json_path }}
          # yamllint disable-line rule:line-length
          MEMBER_NESTED_JSON: ${{ steps.member-nested.outputs.sbom_json_path }}
          UNTRUSTED_OUTCOME: ${{ steps.untrusted.outcome }}
          UNTRUSTED_SKIPPED: ${{ steps.untrusted.outputs.skipped }}
          ESCAPE_ABSOLUTE: >-
            ${{ steps.escape-absolute.outcome }}:${{
            steps.escape-absolute.outputs.dependency_manager }}
          ESCAPE_DOTDOT: >-
            ${{ steps.escape-dotdot.outcome }}:${{
            steps.escape-dotdot.outputs.dependency_manager }}
          ABOVE_PREFIX: >-
            ${{ steps.above-prefix.outcome }}:${{
            steps.above-prefix.outputs.dependency_manager }}
          LINK_PREFIX: >-
            ${{ steps.link-prefix.outcome }}:${{
            steps.link-prefix.outputs.dependency_manager }}
          LINK_WORKSPACE: >-
            ${{ steps.link-workspace.outcome }}:${{
            steps.link-workspace.outputs.dependency_manager }}
          MISSING: >-
            ${{ steps.missing.outcome }}:${{
            steps.missing.outputs.dependency_manager }}
          SYFT: >-
            ${{ steps.syft.outcome }}:${{
            steps.syft.outputs.dependency_manager }}
          PYTHON: >-
            ${{ steps.python.outcome }}:${{
            steps.python.outputs.dependency_manager }}
          MAVEN_DECLARED: >-
            ${{ steps.maven-declared.outcome }}:${{
            steps.maven-declared.outputs.dependency_manager }}
          MAVEN_DETECTED: >-
            ${{ steps.maven-detected.outcome }}:${{
            steps.maven-detected.outputs.dependency_manager }}
        run: |
          # Verify the Cargo working directory
          failures=0
          fail() {
            echo "$* ❌"
            failures=$((failures + 1))
          }
          # "name:scope" for each component, sorted
          components() {
            jq -r '.components[]? | "\(.name):\(.scope // "-")"' "$1" \
              | sort
          }
          # The version and bom-ref of the semver a document lists
          semver_of() {
            jq -r '.components[] | select(.name == "semver")
              | "\(.version) \(.["bom-ref"])"' "$1"
          }
          # The directory the spy recorded for a run, then its arguments
          # with the fixture directory and the random name made stable
          fixtures="$(realpath -- cargo-wd)"
          cwd_of() {
            head -n 1 "${RUNNER_TEMP}/argv-$1.txt"
          }
          argv() {
            tail -n +2 "${RUNNER_TEMP}/argv-$1.txt" \
              | sed -e "s|^${fixtures}/|<fixtures>/|" \
                -e 's|^sbom-action-[0-9a-f]\{16\}$|<name>|'
          }
          # The cargo-cyclonedx call the action makes for a manifest,
          # whichever directory Cargo runs from
          expect_argv() {
            local run="$1" manifest="$2" expected
            expected="$(printf '%s\n' cyclonedx --manifest-path \
              "<fixtures>/${manifest}/Cargo.toml" --format json \
              --spec-version 1.5 --all --target all \
              --override-filename '<name>' --quiet --no-build-deps)"
            if [ "$(argv "${run}")" != "${expected}" ]; then
              fail "${run}: unexpected cargo-cyclonedx arguments"
              diff <(echo "${expected}") <(argv "${run}") || true
            fi
          }
          app="lfreleng-fixture-wd-app"
          core="lfreleng-fixture-wd-core"

          for doc in "${MEMBER_DIR_JSON}" "${MEMBER_DEFAULT_JSON}" \
            "${MEMBER_SAME_JSON}" "${MEMBER_NESTED_JSON}"; do
            if [ ! -f "${doc}" ]; then
              fail "Expected document missing: ${doc:-<empty output>}"
            fi
          done
          if [ "${failures}" != "0" ]; then
            exit 1
          fi

          # From app, describing the root: the whole workspace, with
          # app's patched semver, and the manifest still the root's.
          # From app/nested, the same document: app's configuration
          # applies from beneath it, and nested's own workspace stays
          # out of the picture.
          [ "$(cwd_of member-dir)" = "${fixtures}/workspace/app" ] || \
            fail "member-dir: cargo-cyclonedx ran from $(cwd_of member-dir)"
          [ "$(cwd_of member-nested)" = \
            "${fixtures}/workspace/app/nested" ] || \
            fail "member-nested: cargo-cyclonedx ran from" \
              "$(cwd_of member-nested)"
          expected="$(printf '%s\n' "${app}:-" "${core}:-" \
            "semver:required" | sort)"
          for run in member-dir member-nested; do
            expect_argv "${run}" workspace
          done
          for doc in "${MEMBER_DIR_JSON}" "${MEMBER_NESTED_JSON}"; do
            [ "$(components "${doc}")" = "${expected}" ] || \
              fail "${doc}: unexpected components"
            case "$(semver_of "${doc}")" in
              "1.99.0 path+file://${fixtures}/patch/semver#"*) ;;
              *) fail "${doc}: semver is not app's patched copy" ;;
            esac
          done

          # The root, input empty: app's patch unseen, the run fails
          # after validation reported Cargo
          [ "${ROOT_DIR_OUTCOME}" = "failure" ] || \
            fail "root-dir: the root run read app's configuration"
          [ "${ROOT_DIR_MANAGER}" = "cargo" ] || \
            fail "root-dir: validation did not report Cargo"

          # Empty or naming path_prefix, Cargo runs from path_prefix
          # with the arguments it always had
          expected="$(printf '%s\n' "${core}:required" "semver:required")"
          for run in member-default member-same; do
            [ "$(cwd_of "${run}")" = "${fixtures}/workspace/app" ] || \
              fail "${run}: cargo-cyclonedx ran from $(cwd_of "${run}")"
            expect_argv "${run}" workspace/app
          done
          for doc in "${MEMBER_DEFAULT_JSON}" "${MEMBER_SAME_JSON}"; do
            [ "$(components "${doc}")" = "${expected}" ] || \
              fail "${doc}: unexpected components"
            case "$(semver_of "${doc}")" in
              "1.99.0 path+file://${fixtures}/patch/semver#"*) ;;
              *) fail "${doc}: semver is not app's patched copy" ;;
            esac
          done

          [ "${UNTRUSTED_OUTCOME}" = "success" ] || \
            fail "An untrusted checkout failed instead of skipping"
          [ "${UNTRUSTED_SKIPPED}" = "true" ] || \
            fail "An untrusted checkout was not skipped"

          # Refused in validation, before any dependency_manager
          for pair in "escape-absolute:${ESCAPE_ABSOLUTE}" \
            "escape-dotdot:${ESCAPE_DOTDOT}" \
            "above-prefix:${ABOVE_PREFIX}" \
            "link-prefix:${LINK_PREFIX}" \
            "link-workspace:${LINK_WORKSPACE}" \
            "missing:${MISSING}" "syft:${SYFT}" "python:${PYTHON}" \
            "maven-declared:${MAVEN_DECLARED}" \
            "maven-detected:${MAVEN_DETECTED}"; do
            run="${pair%%:*}"
            result="${pair#*:}"
            [ "${result}" = "failure:" ] || \
              fail "${run}: expected a validation failure, got ${result}"
          done
          for run in root-dir untrusted escape-absolute escape-dotdot \
            above-prefix link-prefix link-workspace missing syft python \
            maven-declared maven-detected; do
            [ -z "$(find cargo-wd-out -name "sbom-wd-${run}.*")" ] || \
              fail "${run}: a document survived a failed or skipped run"
          done

          litter="$(git -C cargo-wd status --porcelain)"
          [ -z "${litter}" ] || fail "Fixtures changed: ${litter}"
          [ -z "$(find . -name 'sbom-action-*.json')" ] || \
            fail "cargo-cyclonedx documents left behind"

          if [ "${failures}" != "0" ]; then
            echo "Cargo working directory verification failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Cargo working directory verified ✅"
          echo "Cargo working directory verified ✅" >> "$GITHUB_STEP_SUMMARY"

  test-cyclonedx-cargo-version:
    name: "Test: cyclonedx backend (Cargo version)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      # The shared allow-list carries index.crates.io and
      # static.crates.io, which cargo metadata reads semver's manifest
      # from for the dependencies fixture
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same commit the Cargo job scans
      - name: "Checkout test project: lfreleng-actions/test-rust-project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfreleng-actions/test-rust-project
          # yamllint disable-line rule:line-length
          ref: 37adc93cbaec02ec641db12f91c9f4d567cac554 # main, after v0.0.3
          path: test-project
          persist-credentials: false

      # rust-build-action and rust-crate-publish-action test their own
      # copies of this rewrite against these same vectors. Each set's
      # input, rewritten in a scratch copy, must equal its expected
      # tree byte for byte. The CRLF set proves line endings survive,
      # so a checkout that normalised it would pass for the wrong
      # reason: .gitattributes keeps it as committed, and this checks.
      - name: "Check the shared version-stamp vectors"
        shell: bash
        run: |
          # Check the shared version-stamp vectors
          set -euo pipefail
          stamp="${GITHUB_WORKSPACE}/scripts/cargo_version_stamp.sh"
          failures=0
          fail() {
            echo "$* ❌"
            failures=$((failures + 1))
          }
          run_set() {
            local set="$1" version="$2" fixture work manifest
            shift 2
            fixture="tests/fixtures/${set}"
            work="${RUNNER_TEMP}/vectors/${set}"
            mkdir -p "${work}"
            cp -R "${fixture}/input/." "${work}/"
            while IFS= read -r manifest; do
              bash "${stamp}" manifest "${version}" "${manifest}" \
                > /dev/null
            done < <(find "${work}" -name Cargo.toml | LC_ALL=C sort)
            bash "${stamp}" lockfile "${version}" "${work}/Cargo.lock" \
              "$@" > /dev/null
            if diff -rq "${fixture}/expected" "${work}"; then
              echo "${set}: matches the expected tree ✅"
            else
              fail "${set}: differs from the expected tree"
            fi
          }
          crlf=tests/fixtures/version-stamp-crlf
          for file in "${crlf}/input/Cargo.toml" "${crlf}/expected/Cargo.lock"
          do
            grep -q $'\r$' "${file}" || \
              fail "${file}: lost its CRLF line endings in the checkout"
          done
          run_set version-stamp 1.2.3-rc.1+build.5 \
            demo-core demo-cli demo-tool
          run_set version-stamp-crlf 1.2.3-rc.1+build.5 \
            demo-core demo-cli demo-tool
          run_set version-stamp-inline 2.0.0 demo-a demo-b

          # SemVer 2.0, no leading 'v', and one line only
          for version in 1.2.3 0.0.1 1.2.3-rc.1+build.5 1.0.0-alpha.0 \
            1.0.0+20261019 1.0.0-0A.is.legal; do
            bash "${stamp}" check "${version}" || \
              fail "check rejected ${version}"
          done
          for version in v1.2.3 1.2 1.2.3-01 01.2.3 '1.2.3 ' '' 1.2.3+ \
            1.2.3-rc..1 $'1.2.3\n4.5.6'; do
            if bash "${stamp}" check "${version}"; then
              fail "check accepted '${version}'"
            fi
          done

          if [ "${failures}" != "0" ]; then
            echo "Version-stamp vectors failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Version-stamp vectors verified ✅" >> "$GITHUB_STEP_SUMMARY"

      # Tag-versioned copies of the test project: the virtual workspace
      # and the crate with a crates.io dependency, every member at the
      # placeholder 0.0.0, including cli's requirement on core. The
      # committed copy keeps 0.1.0, which cargo_version must refuse,
      # and maven/ holds a pom.xml for detection alone. The tree is its
      # own repository, so git status can prove that every run, the
      # failing ones included, left every file as committed.
      - name: "Derive Cargo version fixtures"
        shell: bash
        run: |
          # Derive Cargo version fixtures
          set -euo pipefail
          root=cargo-version
          ws="${root}/workspace"
          deps="${root}/dependencies"
          mkdir -p "${root}/maven"
          cp -R test-project/variants/workspace "${ws}"
          cp -R test-project/variants/dependencies "${deps}"
          cp -R test-project/variants/workspace "${root}/committed"
          sed -i 's/^version = "0\.1\.0"$/version = "0.0.0"/' \
            "${ws}/Cargo.toml" "${ws}/Cargo.lock" "${deps}/Cargo.toml"
          sed -i 's/version = "0\.1\.0" }/version = "0.0.0" }/' \
            "${ws}/cli/Cargo.toml"
          sed -i '/^name = "lfreleng-fixture-dependencies"$/{n
            s/^version = "0\.1\.0"$/version = "0.0.0"/
          }' "${deps}/Cargo.lock"
          if grep -rn --include=Cargo.toml --include=Cargo.lock \
            '0\.1\.0' "${ws}" "${deps}"; then
            echo "A tag-versioned fixture still carries 0.1.0 ❌"
            exit 1
          fi
          printf '%s\n' '<project/>' > "${root}/maven/pom.xml"
          git -C "${root}" init -q
          git -C "${root}" add -A
          git -C "${root}" -c user.name=fixture \
            -c user.email=fixture@example.invalid -c commit.gpgsign=false \
            commit -q -m "Cargo version fixtures"

      # A cargo-cyclonedx ahead of the installed one on PATH. When it
      # describes a manifest and SBOM_STAMP_LOG is set, it records the
      # Cargo.toml and Cargo.lock beside that manifest as they stand
      # while it runs, which proves the rewrite was in place then. With
      # SBOM_SPY_FAIL set, that same call fails, so a run fails after
      # the rewrite and must still restore every file. The single
      # quotes are deliberate: the wrapper expands them.
      - name: "Install the cargo-cyclonedx version spy"
        shell: bash
        run: |
          # Install the cargo-cyclonedx version spy
          set -euo pipefail
          spy_dir="${RUNNER_TEMP}/cargo-cyclonedx-spy"
          mkdir -p "${spy_dir}"
          # shellcheck disable=SC2016
          printf '%s\n' '#!/bin/sh' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  if [ "${prev}" = "--manifest-path" ]; then' \
            '    dir="$(dirname "${arg}")"' \
            '    log="${SBOM_STAMP_LOG:-}"' \
            '    if [ -n "${log}" ]; then' \
            '      cat "${dir}/Cargo.toml" "${dir}/Cargo.lock" > "${log}"' \
            '    fi' \
            '    if [ -n "${SBOM_SPY_FAIL:-}" ]; then' \
            '      echo "cargo-cyclonedx spy: failing on purpose" >&2' \
            '      exit 1' \
            '    fi' \
            '  fi' \
            '  prev="${arg}"' \
            'done' \
            'self="$(cd "$(dirname "$0")" && pwd)"' \
            'IFS=:' \
            'for dir in ${PATH}; do' \
            '  [ "${dir}" = "${self}" ] && continue' \
            '  if [ -x "${dir}/cargo-cyclonedx" ]; then' \
            '    exec "${dir}/cargo-cyclonedx" "$@"' \
            '  fi' \
            'done' \
            'echo "cargo-cyclonedx not found behind the spy" >&2' \
            'exit 127' > "${spy_dir}/cargo-cyclonedx"
          chmod +x "${spy_dir}/cargo-cyclonedx"
          echo "${spy_dir}" >> "${GITHUB_PATH}"

      # untrusted_checkout is 'false' throughout, except where the skip
      # is the subject: the trees scanned are a pinned org-owned commit
      # and copies of it, not the pull request's own content
      - name: "Running local action: Cargo version, workspace"
        id: workspace
        uses: $/
        env:
          SBOM_STAMP_LOG: ${{ runner.temp }}/stamp-workspace.txt
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-version/workspace
          cargo_version: 1.2.3-rc.1+build.5
          sbom_format: both
          filename_prefix: sbom-cv-workspace
          output_directory: cargo-version-out

      # A member as path_prefix: the rewrite still covers the whole
      # workspace, or the lockfile would no longer match
      - name: "Running local action: Cargo version, member"
        id: member
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-version/workspace/cli
          cargo_version: 2.0.0
          sbom_format: json
          filename_prefix: sbom-cv-member
          output_directory: cargo-version-out

      - name: "Running local action: Cargo version, crates.io dependency"
        id: dependencies
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-version/dependencies
          cargo_version: 3.1.4
          sbom_format: json
          filename_prefix: sbom-cv-dependencies
          output_directory: cargo-version-out

      - name: "Running local action: Cargo version and working directory"
        id: working-directory
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-version/workspace
          cargo_working_directory: cargo-version/workspace/cli
          cargo_version: 1.2.3-rc.1+build.5
          sbom_format: json
          filename_prefix: sbom-cv-working-directory
          output_directory: cargo-version-out

      # Empty, the checkout is described as committed
      - name: "Running local action: Cargo version unset"
        id: unset
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-version/workspace
          sbom_format: json
          filename_prefix: sbom-cv-unset
          output_directory: cargo-version-out

      # Members at 0.1.0: refused before any file changes
      - name: "Running local action: Cargo version, members not at 0.0.0"
        id: committed
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-version/committed
          cargo_version: 1.0.0
          sbom_format: json
          filename_prefix: sbom-cv-committed
          output_directory: cargo-version-out

      # Fails after the rewrite, in cargo-cyclonedx itself
      - name: "Running local action: Cargo version, generation fails"
        id: generation-fails
        continue-on-error: true
        uses: $/
        env:
          SBOM_STAMP_LOG: ${{ runner.temp }}/stamp-generation-fails.txt
          SBOM_SPY_FAIL: 'true'
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-version/workspace
          cargo_version: 1.2.3-rc.1+build.5
          sbom_format: json
          filename_prefix: sbom-cv-generation-fails
          output_directory: cargo-version-out

      # The skip comes before detection, and needs no refusal
      - name: "Running local action: Cargo version, untrusted"
        id: untrusted
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'true'
          path_prefix: cargo-version/workspace
          cargo_version: 1.2.3
          filename_prefix: sbom-cv-untrusted
          output_directory: cargo-version-out

      # Each of these fails in validation, before reporting a
      # dependency_manager, which the verification checks. Untrusted
      # where a skipped run would otherwise pass, so only the refusal
      # ahead of the skip can fail it.
      - name: "Running local action: Cargo version with a leading v"
        id: invalid
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'true'
          path_prefix: cargo-version/workspace
          cargo_version: v1.2.3
          filename_prefix: sbom-cv-invalid
          output_directory: cargo-version-out

      - name: "Running local action: syft with a Cargo version"
        id: syft
        continue-on-error: true
        uses: $/
        with:
          path_prefix: cargo-version/workspace
          cargo_version: 1.2.3
          filename_prefix: sbom-cv-syft
          output_directory: cargo-version-out

      - name: "Running local action: python with a Cargo version"
        id: python
        continue-on-error: true
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'true'
          path_prefix: tests/fixtures/python/uv
          cargo_version: 1.2.3
          filename_prefix: sbom-cv-python
          output_directory: cargo-version-out

      - name: "Running local action: Maven declared, Cargo version"
        id: maven-declared
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'true'
          dependency_manager: maven
          path_prefix: cargo-version/maven
          cargo_version: 1.2.3
          filename_prefix: sbom-cv-maven-declared
          output_directory: cargo-version-out

      - name: "Running local action: Maven detected, Cargo version"
        id: maven-detected
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: cargo-version/maven
          cargo_version: 1.2.3
          filename_prefix: sbom-cv-maven-detected
          output_directory: cargo-version-out

      - name: "Verify the Cargo version"
        shell: bash
        env:
          WORKSPACE_JSON: ${{ steps.workspace.outputs.sbom_json_path }}
          WORKSPACE_XML: ${{ steps.workspace.outputs.sbom_xml_path }}
          MEMBER_JSON: ${{ steps.member.outputs.sbom_json_path }}
          # yamllint disable-line rule:line-length
          DEPENDENCIES_JSON: ${{ steps.dependencies.outputs.sbom_json_path }}
          # yamllint disable-line rule:line-length
          WORKING_DIRECTORY_JSON: ${{ steps.working-directory.outputs.sbom_json_path }}
          UNSET_JSON: ${{ steps.unset.outputs.sbom_json_path }}
          COMMITTED: >-
            ${{ steps.committed.outcome }}:${{
            steps.committed.outputs.dependency_manager }}
          GENERATION_FAILS: >-
            ${{ steps.generation-fails.outcome }}:${{
            steps.generation-fails.outputs.dependency_manager }}
          UNTRUSTED_OUTCOME: ${{ steps.untrusted.outcome }}
          UNTRUSTED_SKIPPED: ${{ steps.untrusted.outputs.skipped }}
          INVALID: >-
            ${{ steps.invalid.outcome }}:${{
            steps.invalid.outputs.dependency_manager }}
          SYFT: >-
            ${{ steps.syft.outcome }}:${{
            steps.syft.outputs.dependency_manager }}
          PYTHON: >-
            ${{ steps.python.outcome }}:${{
            steps.python.outputs.dependency_manager }}
          MAVEN_DECLARED: >-
            ${{ steps.maven-declared.outcome }}:${{
            steps.maven-declared.outputs.dependency_manager }}
          MAVEN_DETECTED: >-
            ${{ steps.maven-detected.outcome }}:${{
            steps.maven-detected.outputs.dependency_manager }}
        run: |
          # Verify the Cargo version
          failures=0
          fail() {
            echo "$* ❌"
            failures=$((failures + 1))
          }
          # Members of the workspace fixture, each described at the
          # version given: in its version, purl and bom-ref alike
          members_at() {
            jq -e --arg v "$2" '
              [.metadata.component? // empty, .components[]?
                | select(.name | startswith("lfreleng-fixture-workspace"))]
              | length == 3 and all(.[]; .name as $name
                  | .version == $v
                  and (.purl | startswith("pkg:cargo/\($name)@\($v)"))
                  and (.["bom-ref"] | endswith("#\($name)@\($v)")))' \
              "$1" > /dev/null
          }
          # No string holding the placeholder, and no dependency entry
          # pointing at a bom-ref the document lacks
          no_placeholder() {
            jq -e '[.. | strings | select(contains("0.0.0"))]
              | length == 0' "$1" > /dev/null
          }
          no_dangling() {
            jq -e '([.components[]?["bom-ref"]]
                + [.metadata.component?["bom-ref"] // empty]) as $refs
              | [.dependencies[]? | .ref, .dependsOn[]?
                  | select(IN($refs[]) | not)]
              | length == 0' "$1" > /dev/null
          }
          version="1.2.3-rc.1+build.5"

          for doc in "${WORKSPACE_JSON}" "${WORKSPACE_XML}" \
            "${MEMBER_JSON}" "${DEPENDENCIES_JSON}" \
            "${WORKING_DIRECTORY_JSON}" "${UNSET_JSON}"; do
            if [ ! -f "${doc}" ]; then
              fail "Expected document missing: ${doc:-<empty output>}"
            fi
          done
          if [ "${failures}" != "0" ]; then
            exit 1
          fi

          # The whole workspace at the release version, from the root
          # and with Cargo run from cli alike
          for doc in "${WORKSPACE_JSON}" "${WORKING_DIRECTORY_JSON}"; do
            members_at "${doc}" "${version}" || \
              fail "${doc}: members not described at ${version}"
            no_placeholder "${doc}" || fail "${doc}: 0.0.0 remains"
            no_dangling "${doc}" || fail "${doc}: dangling dependency refs"
          done
          grep -qF "<version>${version}</version>" "${WORKSPACE_XML}" || \
            fail "${WORKSPACE_XML}: the release version is missing"
          if grep -qF '<version>0.0.0</version>' "${WORKSPACE_XML}"; then
            fail "${WORKSPACE_XML}: 0.0.0 remains"
          fi

          # cli as path_prefix: its own component at 2.0.0
          jq -e '.metadata.component | .name as $name
            | ($name | startswith("lfreleng-fixture-workspace-cli"))
              and .version == "2.0.0"
              and (.purl | startswith("pkg:cargo/\($name)@2.0.0"))
              and (.["bom-ref"] | endswith("#\($name)@2.0.0"))' \
            "${MEMBER_JSON}" > /dev/null || \
            fail "member: cli not described at 2.0.0"
          no_placeholder "${MEMBER_JSON}" || fail "member: 0.0.0 remains"

          # The project's crate takes the version, crates.io's keeps
          # its own
          jq -e '.metadata.component.version == "3.1.4"
            and ([.components[] | select(.name == "semver") | .version]
              == ["1.0.28"])' "${DEPENDENCIES_JSON}" > /dev/null || \
            fail "dependencies: unexpected versions"

          # Unset: described as committed
          members_at "${UNSET_JSON}" 0.0.0 || \
            fail "unset: members not described as committed"

          # Generation saw the rewrite in place: the root manifest's
          # workspace version and each member's lockfile entry
          for run in workspace generation-fails; do
            log="${RUNNER_TEMP}/stamp-${run}.txt"
            stamped="$(grep -cxF "version = \"${version}\"" "${log}" \
              || true)"
            [ "${stamped}" = "4" ] || \
              fail "${run}: generation saw ${stamped:-no} stamped lines"
            if grep -qF '"0.0.0"' "${log}"; then
              fail "${run}: generation saw 0.0.0"
            fi
          done

          # Failed after validation reported Cargo: refused members,
          # and a cargo-cyclonedx failure after the rewrite
          for pair in "committed:${COMMITTED}" \
            "generation-fails:${GENERATION_FAILS}"; do
            run="${pair%%:*}"
            result="${pair#*:}"
            [ "${result}" = "failure:cargo" ] || \
              fail "${run}: expected a Cargo failure, got ${result}"
          done

          [ "${UNTRUSTED_OUTCOME}" = "success" ] || \
            fail "An untrusted checkout failed instead of skipping"
          [ "${UNTRUSTED_SKIPPED}" = "true" ] || \
            fail "An untrusted checkout was not skipped"

          # Refused in validation, before any dependency_manager
          for pair in "invalid:${INVALID}" "syft:${SYFT}" \
            "python:${PYTHON}" "maven-declared:${MAVEN_DECLARED}" \
            "maven-detected:${MAVEN_DETECTED}"; do
            run="${pair%%:*}"
            result="${pair#*:}"
            [ "${result}" = "failure:" ] || \
              fail "${run}: expected a validation failure, got ${result}"
          done
          for run in committed generation-fails untrusted invalid syft \
            python maven-declared maven-detected; do
            [ -z "$(find cargo-version-out -name "sbom-cv-${run}.*")" ] || \
              fail "${run}: a document survived a failed or skipped run"
          done

          # Every run, the failing ones included, restored each file
          litter="$(git -C cargo-version status --porcelain)"
          [ -z "${litter}" ] || fail "Fixtures changed: ${litter}"
          [ -z "$(find . -name 'sbom-action-*.json')" ] || \
            fail "cargo-cyclonedx documents left behind"

          if [ "${failures}" != "0" ]; then
            echo "Cargo version verification failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Cargo version verified ✅"
          echo "Cargo version verified ✅" >> "$GITHUB_STEP_SUMMARY"

  ### Test the python backend against every package manager ###
  # Each fixture under tests/fixtures/python locks the same graph:
  # iniconfig and python-dateutil direct, six through python-dateutil,
  # and pluggy as a development dependency. The pipenv fixture has no
  # pyproject.toml, so it alone has no root component.
  test-python:
    name: "Test: python backend (${{ matrix.fixture }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fixture: [uv, pdm, poetry, pipenv, pip-tools, pip]
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      # The shared allow-list carries pypi.org and
      # files.pythonhosted.org, which every install here reads.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # untrusted_checkout is 'false' throughout: the fixtures are this
      # repository's own files, which the workflow already runs, so the
      # skip would only stop the fork pull requests it is tested on.
      - name: "Running local action: default scope"
        id: prod
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: tests/fixtures/python/${{ matrix.fixture }}
          filename_prefix: sbom-prod
          output_directory: python-out

      - name: "Running local action: development dependencies"
        id: dev
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: tests/fixtures/python/${{ matrix.fixture }}
          sbom_format: json
          filename_prefix: sbom-dev
          output_directory: python-out
          include_dev: 'true'

      - name: "Running local action: declared package manager"
        id: declared
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          dependency_manager: ${{ matrix.fixture }}
          path_prefix: tests/fixtures/python/${{ matrix.fixture }}
          sbom_format: json
          filename_prefix: sbom-declared
          output_directory: python-out

      # Before the fixture is changed below, so anything here came from
      # the runs above: a .venv, a .pdm-python, build output
      - name: "Verify the checkout is untouched"
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          # Verify the checkout is untouched
          litter="$(git status --porcelain --ignored -- \
            "tests/fixtures/python/${FIXTURE}")"
          if [ -n "${litter}" ]; then
            echo "The runs changed the fixture ❌"
            echo "${litter}"
            exit 1
          fi
          echo "Fixture left as the runs found it ✅"

      # Lock-file managers gain a dependency their committed lock does
      # not describe. The pip fixtures have no lock, so a conflicting
      # pin makes their install fail instead.
      - name: "Make the fixture inconsistent"
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          # Make the fixture inconsistent
          set -euo pipefail
          cd "tests/fixtures/python/${FIXTURE}"
          case "${FIXTURE}" in
            pipenv)
              file=Pipfile
              sed -i '/^iniconfig = /a toml = "==0.10.2"' "${file}" ;;
            pip-tools)
              file=requirements.txt
              sed -i '/^iniconfig==2.1.0$/a iniconfig==2.0.0' "${file}" ;;
            pip)
              file=pyproject.toml
              sed -i '/"iniconfig==2.1.0",/a "iniconfig==2.0.0",' "${file}" ;;
            *)
              file=pyproject.toml
              sed -i '/"iniconfig==2.1.0",/a "toml==0.10.2",' "${file}" ;;
          esac
          if git diff --quiet -- "${file}"; then
            echo "Fixture change did not apply to ${file} ❌"
            exit 1
          fi
          git --no-pager diff -- "${file}"

      - name: "Running local action: inconsistent (hard fail)"
        id: strict
        continue-on-error: true
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: tests/fixtures/python/${{ matrix.fixture }}
          filename_prefix: sbom-strict
          output_directory: python-out

      - name: "Running local action: inconsistent (soft fail)"
        id: lenient
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: tests/fixtures/python/${{ matrix.fixture }}
          filename_prefix: sbom-lenient
          output_directory: python-out
          fail_on_error: 'false'

      - name: "Verify the Python dependency graphs"
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
          PROD_JSON: ${{ steps.prod.outputs.sbom_json_path }}
          PROD_XML: ${{ steps.prod.outputs.sbom_xml_path }}
          PROD_COUNT: ${{ steps.prod.outputs.component_count }}
          PROD_BACKEND: ${{ steps.prod.outputs.backend }}
          PROD_MANAGER: ${{ steps.prod.outputs.dependency_manager }}
          DEV_JSON: ${{ steps.dev.outputs.sbom_json_path }}
          DEV_COUNT: ${{ steps.dev.outputs.component_count }}
          # yamllint disable-line rule:line-length
          DECLARED_MANAGER: ${{ steps.declared.outputs.dependency_manager }}
          DECLARED_JSON: ${{ steps.declared.outputs.sbom_json_path }}
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
          LENIENT_JSON: ${{ steps.lenient.outputs.sbom_json_path }}
          LENIENT_COUNT: ${{ steps.lenient.outputs.component_count }}
        run: |
          # Verify the Python dependency graphs
          failures=0
          fail() {
            echo "$1 ❌"
            failures=1
          }
          # Component names, sorted
          names() {
            jq -r '[.components[].name] | sort | join(",")' "$1"
          }
          # Names of what the component called $2 depends on; an empty
          # name selects the root component
          edges() {
            jq -r --arg from "$2" '
              ([.components[] | {key: .["bom-ref"], value: .name}]
                | from_entries) as $n
              | (if $from == "" then .metadata.component["bom-ref"]
                else ([.components[] | select(.name == $from)
                  | .["bom-ref"]] | first) end) as $ref
              | [.dependencies[] | select($ref != null and .ref == $ref)
                | .dependsOn[]? | $n[.]] | sort | join(",")' "$1"
          }

          [ "${PROD_BACKEND}" = "python" ] || \
            fail "backend output was '${PROD_BACKEND}'"
          # The values python-sbom-action reported, unchanged
          [ "${PROD_MANAGER}" = "${FIXTURE}" ] || \
            fail "Detected '${PROD_MANAGER}', wanted '${FIXTURE}'"
          [ "${DECLARED_MANAGER}" = "${FIXTURE}" ] || \
            fail "Declared run reported '${DECLARED_MANAGER}'"
          if [ ! -f "${PROD_XML}" ] || ! grep -q \
            'cyclonedx.org/schema/bom/1.5' "${PROD_XML}"; then
            fail "No CycloneDX 1.5 XML document"
          fi

          # The environment holds the project's dependencies and nothing
          # else: neither cyclonedx-bom's tree nor the package manager
          [ "$(names "${PROD_JSON}")" = "iniconfig,python-dateutil,six" ] \
            || fail "Components: $(names "${PROD_JSON}")"
          [ "${PROD_COUNT}" = "3" ] || fail "Count was '${PROD_COUNT}'"
          [ "$(names "${DECLARED_JSON}")" = \
            "iniconfig,python-dateutil,six" ] || \
            fail "Declared run components: $(names "${DECLARED_JSON}")"
          [ "$(edges "${PROD_JSON}" python-dateutil)" = "six" ] || \
            fail "python-dateutil does not depend on six"

          # The root anchors the graph on the declared direct set, so
          # six reads as inherited. pipenv has no pyproject.toml to
          # name a root.
          root="$(jq -r '.metadata.component.name // ""' "${PROD_JSON}")"
          if [ "${FIXTURE}" = "pipenv" ]; then
            [ -z "${root}" ] || fail "pipenv fixture gained a root"
          else
            [ "${root}" = "sbom-fixture-${FIXTURE}" ] || \
              fail "Root component was '${root}'"
            [ "$(edges "${PROD_JSON}" "")" = \
              "iniconfig,python-dateutil" ] || \
              fail "Root depends on '$(edges "${PROD_JSON}" "")'"
          fi

          # include_dev adds the dev dependency as a component, but
          # the project does not depend on it at runtime
          [ "$(names "${DEV_JSON}")" = \
            "iniconfig,pluggy,python-dateutil,six" ] || \
            fail "include_dev components: $(names "${DEV_JSON}")"
          [ "${DEV_COUNT}" = "4" ] || fail "Dev count was '${DEV_COUNT}'"
          if [ "${FIXTURE}" != "pipenv" ]; then
            [ "$(edges "${DEV_JSON}" "")" = \
              "iniconfig,python-dateutil" ] || \
              fail "include_dev linked the root to a dev dependency"
          fi

          # A stale lock or failed install publishes nothing, either way
          [ "${STRICT_OUTCOME}" = "failure" ] || \
            fail "Inconsistent fixture gave '${STRICT_OUTCOME}'"
          [ -z "${LENIENT_JSON}" ] || fail "Soft failure emitted a path"
          [ "${LENIENT_COUNT}" = "0" ] || \
            fail "Soft failure count was '${LENIENT_COUNT}'"
          for prefix in sbom-strict sbom-lenient; do
            [ -z "$(find python-out -name "${prefix}.*")" ] || \
              fail "${prefix}: a document survived a failed run"
          done

          if [ "${failures}" != "0" ]; then
            echo "Python backend verification failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Python backend verified (${FIXTURE}) ✅"
          echo "Python backend verified (${FIXTURE}) ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  ### Unit-test the python backend's graph helpers ###
  # The resolution rules have cases no installable fixture can reach,
  # such as an uninstalled project whose optional dependency is a
  # direct URL. The helpers run beside cyclonedx-bom, which brings
  # packaging and cyclonedx-python-lib, so they are tested on every
  # Python python_version accepts that is still supported, 3.10 to
  # 3.15, at the default version, and on 3.10 at the 4.0.0 floor.
  test-python-helpers:
    # yamllint disable-line rule:line-length
    name: "Test: python backend helpers (${{ matrix.python }} ${{ matrix.cyclonedx_py || 'default' }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        cyclonedx_py: ['']
        include:
          - python: '3.10'
            cyclonedx_py: '4.0.0'
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        id: python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          update-environment: false

      - name: "Run the helper unit tests"
        shell: bash
        env:
          PYTHON_CMD: ${{ steps.python.outputs.python-path }}
          CYCLONEDX_PY: ${{ matrix.cyclonedx_py }}
        run: |
          # Run the helper unit tests
          set -euo pipefail
          version="${CYCLONEDX_PY}"
          if [ -z "${version}" ]; then
            version="$(awk '/^  cyclonedx_py_version:/ { found = 1 }
              found && /default:/ { gsub(/[" ]/, "", $2); print $2; exit }' \
              action.yaml)"
          fi
          if [ -z "${version}" ]; then
            echo "No cyclonedx_py_version default in action.yaml ❌"
            exit 1
          fi
          echo "Python $("${PYTHON_CMD}" --version), cyclonedx-bom ${version}"
          "${PYTHON_CMD}" -I -m venv "${RUNNER_TEMP}/helpers"
          "${RUNNER_TEMP}/helpers/bin/python" -I -m pip install --quiet \
            --disable-pip-version-check "cyclonedx-bom==${version}" \
            'tomli; python_version < "3.11"'
          "${RUNNER_TEMP}/helpers/bin/python" -E -s -m unittest discover \
            -s tests/python -t . -v

  ### Test python backend options against real and derived projects ###
  test-python-options:
    name: "Test: python backend options"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      # Block, like every other job here: one fixture below runs a
      # setup.py during the install on purpose.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A uv project with a hatch-vcs dynamic version, which is what
      # the organisation's Python projects look like
      - name: "Checkout test project: lfreleng-actions/test-python-project"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfreleng-actions/test-python-project
          # yamllint disable-line rule:line-length
          ref: 80831868fb06172c6021c1a529b5c79994485983 # v0.3.1
          path: test-project
          persist-credentials: false

      - name: "Derive Python fixtures"
        shell: bash
        run: |
          # Derive Python fixtures
          set -euo pipefail
          mkdir -p python-fixtures

          # Dynamic: the build backend computes the dependencies, so
          # the project has to be built and installed, and the root's
          # edges come from the installed metadata. Each marker below
          # decides an edge: iniconfig's holds with no extra selected,
          # so it stays; toml's holds for extra 'x' alone, so it does
          # not, even installed through the dev group; six's fails on
          # Python 3, so it does not either, though python-dateutil
          # installs it.
          mkdir -p python-fixtures/dynamic/src/dynamic_fixture
          touch python-fixtures/dynamic/src/dynamic_fixture/__init__.py
          printf '%s\n' '[build-system]' \
            'requires = ["setuptools>=61"]' \
            'build-backend = "setuptools.build_meta"' '[project]' \
            'name = "dynamic-fixture"' 'version = "1.0.0"' \
            'dynamic = ["dependencies"]' \
            'optional-dependencies = {x = ["toml==0.10.2"]}' \
            '[dependency-groups]' 'dev = ["toml==0.10.2"]' \
            '[tool.setuptools.dynamic]' \
            'dependencies = {file = ["deps.in"]}' \
            > python-fixtures/dynamic/pyproject.toml
          printf '%s\n' 'python-dateutil==2.9.0.post0' \
            'iniconfig==2.1.0; extra != "compat"' \
            'six==1.17.0; python_version < "3"' \
            > python-fixtures/dynamic/deps.in

          # Static: the same markers declared in [project], which pip
          # installs without building the project. six arrives through
          # python-dateutil, so only marker evaluation keeps it off the
          # root.
          mkdir -p python-fixtures/markers
          printf '%s\n' '[project]' 'name = "markers-fixture"' \
            'version = "1.0.0"' 'dependencies = [' \
            '  "python-dateutil==2.9.0.post0",' \
            '  "iniconfig==2.1.0; extra != \"compat\"",' \
            '  "six==1.17.0; python_version < \"3\"",' ']' \
            > python-fixtures/markers/pyproject.toml

          # A Python no runner has: installing the dependencies alone
          # never checks requires-python, so the action has to
          mkdir -p python-fixtures/requires-python
          printf '%s\n' '[project]' 'name = "requires-python-fixture"' \
            'version = "1.0.0"' 'requires-python = ">=99"' \
            'dependencies = ["iniconfig==2.1.0"]' \
            > python-fixtures/requires-python/pyproject.toml

          # A checkout module named after one the action runs with
          # '-m', in the directory the action starts from. Isolated
          # interpreters never import it; a non-isolated one would.
          printf '%s\n' 'import pathlib' \
            'pathlib.Path("shadow-ran.txt").write_text("ran")' \
            'raise SystemExit("checkout venv.py ran")' > venv.py
          cp venv.py pip.py

          # An installed distribution reachable through PYTHONPATH
          # alone, which no SBOM of these fixtures may list, and a
          # poetry package there that would replace the real one in
          # Poetry's console script, recording that it ran
          injected=python-fixtures/injected/injected_package-9.9.dist-info
          mkdir -p "${injected}" python-fixtures/injected/poetry/console
          printf '%s\n' 'Metadata-Version: 2.1' \
            'Name: injected-package' 'Version: 9.9' \
            > "${injected}/METADATA"
          touch python-fixtures/injected/poetry/__init__.py \
            python-fixtures/injected/poetry/console/__init__.py
          printf '%s\n' 'import pathlib' \
            'here = pathlib.Path(__file__).resolve().parents[3]' \
            'def main():' \
            '    (here / "hijack-ran.txt").write_text("ran")' \
            '    raise SystemExit("injected poetry ran")' \
            > python-fixtures/injected/poetry/console/application.py

          # PEP 735 normalises group names, so 'Dev' is the dev group
          mkdir -p python-fixtures/dev-group
          printf '%s\n' '[project]' 'name = "dev-group-fixture"' \
            'version = "1.0.0"' 'dependencies = ["iniconfig==2.1.0"]' \
            '[dependency-groups]' 'Dev = ["pluggy==1.6.0"]' \
            > python-fixtures/dev-group/pyproject.toml

          # A pyproject.toml beside requirements-dev.txt, with no
          # requirements.txt: the development file still applies
          mkdir -p python-fixtures/dev-requirements
          printf '%s\n' '[project]' 'name = "dev-requirements-fixture"' \
            'version = "1.0.0"' 'dependencies = ["iniconfig==2.1.0"]' \
            > python-fixtures/dev-requirements/pyproject.toml
          printf 'pluggy==1.6.0\n' \
            > python-fixtures/dev-requirements/requirements-dev.txt

          # Extras: pluggy declares 'pytest; extra == "testing"', and
          # pytest installs here as a development dependency, so only
          # marker evaluation keeps pluggy from depending on it. The
          # socks extra IS requested of requests, so its edge to
          # PySocks stays.
          mkdir -p python-fixtures/extras
          printf '%s\n' '[project]' 'name = "extras-fixture"' \
            'version = "1.0.0"' 'dependencies = [' \
            '  "pluggy==1.6.0",' '  "requests[socks]==2.32.5",' ']' \
            '[dependency-groups]' 'dev = ["pytest==8.4.2"]' \
            > python-fixtures/extras/pyproject.toml

          # Local packages for the two extras cases pip needs a
          # project for: each a setuptools project with no modules,
          # named by an absolute file: URL
          here="${PWD}/python-fixtures/local"
          local_package() {
            mkdir -p "python-fixtures/local/$1"
            {
              printf '%s\n' '[build-system]' \
                'requires = ["setuptools>=61"]' \
                'build-backend = "setuptools.build_meta"' '[project]' \
                "name = \"$1\"" 'version = "1.0.0"'
              printf '%s\n' "${@:2}"
              printf '%s\n' '[tool.setuptools]' 'packages = []'
            } > "python-fixtures/local/$1/pyproject.toml"
          }
          # bundle-fixture's 'all' extra requests its own 'http' one,
          # which requires transport-fixture: the edge must survive
          local_package transport-fixture
          transport="transport-fixture @ file://${here}/transport-fixture"
          bundle="bundle-fixture[all] @ file://${here}/bundle-fixture"
          devtool="devtool-fixture @ file://${here}/devtool-fixture"
          local_package bundle-fixture '[project.optional-dependencies]' \
            "http = [\"${transport}\"]" 'all = ["bundle-fixture[http]"]'
          # A development tool requesting requests[socks], beside a
          # runtime requests that does not: PySocks installs, but must
          # not become a runtime dependency of requests
          local_package devtool-fixture \
            'dependencies = ["requests[socks]==2.32.5"]'
          mkdir -p python-fixtures/aggregate python-fixtures/dev-extras
          printf '%s\n' '[project]' 'name = "aggregate-fixture"' \
            'version = "1.0.0"' "dependencies = [\"${bundle}\"]" \
            > python-fixtures/aggregate/pyproject.toml
          printf '%s\n' '[project]' 'name = "dev-extras-fixture"' \
            'version = "1.0.0"' 'dependencies = ["requests==2.32.5"]' \
            '[dependency-groups]' "dev = [\"${devtool}\"]" \
            > python-fixtures/dev-extras/pyproject.toml
          # A dependency requiring the project back: cyclonedx-py
          # points that requirement at the root, and the edge stays.
          # The project's dependencies are dynamic, so pip installs it.
          # The plugin requests the project's 'feature' extra, which
          # requires transport-fixture[socks], whose 'socks' extra
          # requires iniconfig: extras requested OF the project have to
          # reach its edges, and on through them.
          local_package transport-fixture '[project.optional-dependencies]' \
            'socks = ["iniconfig==2.1.0"]'
          local_package cycle-plugin 'dependencies = ["cycle-app[feature]"]'
          mkdir -p python-fixtures/cycle
          printf '%s\n' '[build-system]' \
            'requires = ["setuptools>=61"]' \
            'build-backend = "setuptools.build_meta"' '[project]' \
            'name = "cycle-app"' 'version = "1.0.0"' \
            'dynamic = ["dependencies", "optional-dependencies"]' \
            '[tool.setuptools]' 'packages = []' \
            '[tool.setuptools.dynamic]' \
            'dependencies = {file = ["deps.in"]}' \
            'optional-dependencies.feature = {file = ["feature.in"]}' \
            > python-fixtures/cycle/pyproject.toml
          printf '%s\n' "cycle-plugin @ file://${here}/cycle-plugin" \
            > python-fixtures/cycle/deps.in
          printf '%s\n' \
            "transport-fixture[socks] @ file://${here}/transport-fixture" \
            > python-fixtures/cycle/feature.in

          # Spy: a local package whose setup.py, which pip runs while
          # building it, records the environment it runs with. The
          # quoting is deliberate: setup.py expands the path, not this
          # step.
          mkdir -p python-fixtures/spy/spypkg
          printf './spypkg\n' > python-fixtures/spy/requirements.txt
          printf '%s\n' 'import os' \
            'from setuptools import setup' \
            'here = os.path.dirname(os.path.abspath(__file__))' \
            'with open(os.path.join(here, "..", "spy-env.txt"), "a") as f:' \
            '    f.write("\n".join(sorted(os.environ)) + "\n")' \
            'setup(name="spypkg", version="1.0.0")' \
            > python-fixtures/spy/spypkg/setup.py

          # A document the untrusted run must clear
          mkdir -p python-out
          printf '%s%s\n' \
            '{"bomFormat":"CycloneDX","specVersion":"1.5",' \
            '"version":1,"components":[]}' \
            > python-out/sbom-untrusted.json

      # untrusted_checkout is 'false' for the reason the Maven job
      # gives: the trees scanned are a pinned org-owned commit and
      # fixtures derived here, not the pull request's own content.
      - name: "Running local action: real uv project"
        id: real
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: test-project
          sbom_format: json
          filename_prefix: sbom-real
          output_directory: python-out

      - name: "Running local action: XML only"
        id: xml
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: tests/fixtures/python/uv
          sbom_format: xml
          filename_prefix: sbom-xml
          output_directory: python-out

      - name: "Running local action: CycloneDX 1.6"
        id: spec16
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: tests/fixtures/python/poetry
          sbom_format: json
          sbom_spec_version: '1.6'
          filename_prefix: sbom-spec16
          output_directory: python-out

      - name: "Running local action: dynamic dependencies"
        id: dynamic
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: python-fixtures/dynamic
          sbom_format: json
          filename_prefix: sbom-dynamic
          output_directory: python-out
          include_dev: 'true'

      # Placeholder values, present so the spy can prove their absence
      - name: "Running local action: environment scrub"
        id: spy
        uses: $/
        env:
          TWINE_PASSWORD: placeholder
          UV_PUBLISH_TOKEN: placeholder
          POETRY_PYPI_TOKEN_PYPI: placeholder
          PIP_INDEX_URL: https://pypi.org/simple
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: placeholder
          ACTIONS_ID_TOKEN_REQUEST_URL: https://example.invalid/
          ACTIONS_RUNTIME_TOKEN: placeholder
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: python-fixtures/spy
          sbom_format: json
          filename_prefix: sbom-spy
          output_directory: python-out

      - name: "Running local action: static dependency markers"
        id: markers
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: python-fixtures/markers
          sbom_format: json
          filename_prefix: sbom-markers
          output_directory: python-out

      - name: "Running local action: unsupported requires-python"
        id: requires-python
        continue-on-error: true
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: python-fixtures/requires-python
          filename_prefix: sbom-requires-python
          output_directory: python-out

      # python_version decides the interpreter, uv included: this
      # fixture's .python-version asks for 3.14, and its markers on
      # implementation_version show in the SBOM which one built it
      # (python-sbom-action#151)
      - name: "Running local action: uv with a pinned .python-version"
        id: uv-pinned
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: tests/fixtures/python/uv-pinned
          sbom_format: json
          filename_prefix: sbom-uv-pinned
          output_directory: python-out

      # requires-python excludes the default python_version. Bound to
      # it, uv refuses at once; the step timeout fails the job if the
      # backend drifts back into downloading a Python and building
      - name: "Running local action: uv, python_version unsatisfiable"
        id: uv-unsatisfiable
        continue-on-error: true
        timeout-minutes: 3
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: tests/fixtures/python/uv-requires
          sbom_format: json
          filename_prefix: sbom-uv-unsatisfiable
          output_directory: python-out

      - name: "Running local action: uv, python_version satisfying"
        id: uv-satisfying
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          python_version: '3.14'
          path_prefix: tests/fixtures/python/uv-requires
          sbom_format: json
          filename_prefix: sbom-uv-satisfying
          output_directory: python-out

      # default-groups names 'typing' as well as 'dev'; --no-dev would
      # drop the second alone
      - name: "Running local action: uv with custom default groups"
        id: uv-groups
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: tests/fixtures/python/uv-groups
          sbom_format: json
          filename_prefix: sbom-uv-groups
          output_directory: python-out

      - name: "Running local action: inherited PYTHONPATH"
        id: pythonpath
        uses: $/
        env:
          PYTHONPATH: ${{ github.workspace }}/python-fixtures/injected
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: tests/fixtures/python/poetry
          sbom_format: json
          filename_prefix: sbom-pythonpath
          output_directory: python-out

      - name: "Running local action: mixed-case dev group"
        id: dev-group
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: python-fixtures/dev-group
          sbom_format: json
          filename_prefix: sbom-dev-group
          output_directory: python-out
          include_dev: 'true'

      - name: "Running local action: requirements-dev.txt alone"
        id: dev-requirements
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: python-fixtures/dev-requirements
          sbom_format: json
          filename_prefix: sbom-dev-requirements
          output_directory: python-out
          include_dev: 'true'

      # Both formats, so the XML written from the finished document is
      # checked against the JSON one
      - name: "Running local action: extras and inactive requirements"
        id: extras
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: python-fixtures/extras
          filename_prefix: sbom-extras
          output_directory: python-out
          include_dev: 'true'

      - name: "Running local action: self-requested extras"
        id: aggregate
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: python-fixtures/aggregate
          sbom_format: json
          filename_prefix: sbom-aggregate
          output_directory: python-out

      - name: "Running local action: extras a dev tool requests"
        id: dev-extras
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: python-fixtures/dev-extras
          sbom_format: json
          filename_prefix: sbom-dev-extras
          output_directory: python-out
          include_dev: 'true'

      - name: "Running local action: dependency on the project"
        id: cycle
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: python-fixtures/cycle
          sbom_format: json
          filename_prefix: sbom-cycle
          output_directory: python-out

      # CycloneDX 1.2 has no component properties, so required extras
      # cannot be recorded; the documents must still meet the schema
      - name: "Running local action: extras at CycloneDX 1.2"
        id: spec12
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: python-fixtures/extras
          sbom_spec_version: '1.2'
          filename_prefix: sbom-spec12
          output_directory: python-out

      - name: "Running local action: python backend, untrusted checkout"
        id: untrusted
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'true'
          path_prefix: tests/fixtures/python/uv
          filename_prefix: sbom-untrusted
          output_directory: python-out

      # A declared manager has to describe the checkout
      - name: "Running local action: wrong package manager declared"
        id: wrong-manager
        continue-on-error: true
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          dependency_manager: poetry
          path_prefix: tests/fixtures/python/uv
          filename_prefix: sbom-wrong
          output_directory: python-out

      # Passes input validation, then cyclonedx-py refuses the version
      - name: "Running local action: unsupported spec version"
        id: spec99
        continue-on-error: true
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'
          path_prefix: tests/fixtures/python/uv
          sbom_spec_version: '9.9'
          filename_prefix: sbom-spec99
          output_directory: python-out

      - name: "Verify the python backend options"
        shell: bash
        env:
          REAL_JSON: ${{ steps.real.outputs.sbom_json_path }}
          REAL_MANAGER: ${{ steps.real.outputs.dependency_manager }}
          XML_JSON: ${{ steps.xml.outputs.sbom_json_path }}
          XML_XML: ${{ steps.xml.outputs.sbom_xml_path }}
          SPEC16_JSON: ${{ steps.spec16.outputs.sbom_json_path }}
          DYNAMIC_JSON: ${{ steps.dynamic.outputs.sbom_json_path }}
          MARKERS_JSON: ${{ steps.markers.outputs.sbom_json_path }}
          # yamllint disable-line rule:line-length
          UV_PINNED_JSON: ${{ steps.uv-pinned.outputs.sbom_json_path }}
          # yamllint disable-line rule:line-length
          UV_UNSATISFIABLE_OUTCOME: ${{ steps.uv-unsatisfiable.outcome }}
          # yamllint disable-line rule:line-length
          UV_SATISFYING_JSON: ${{ steps.uv-satisfying.outputs.sbom_json_path }}
          UV_GROUPS_JSON: ${{ steps.uv-groups.outputs.sbom_json_path }}
          PYTHONPATH_JSON: ${{ steps.pythonpath.outputs.sbom_json_path }}
          DEV_GROUP_JSON: ${{ steps.dev-group.outputs.sbom_json_path }}
          # yamllint disable-line rule:line-length
          DEV_REQUIREMENTS_JSON: ${{ steps.dev-requirements.outputs.sbom_json_path }}
          EXTRAS_JSON: ${{ steps.extras.outputs.sbom_json_path }}
          EXTRAS_XML: ${{ steps.extras.outputs.sbom_xml_path }}
          AGGREGATE_JSON: ${{ steps.aggregate.outputs.sbom_json_path }}
          DEV_EXTRAS_JSON: ${{ steps.dev-extras.outputs.sbom_json_path }}
          CYCLE_JSON: ${{ steps.cycle.outputs.sbom_json_path }}
          SPEC12_JSON: ${{ steps.spec12.outputs.sbom_json_path }}
          # yamllint disable-line rule:line-length
          REQUIRES_PYTHON_OUTCOME: ${{ steps.requires-python.outcome }}
          SPY_JSON: ${{ steps.spy.outputs.sbom_json_path }}
          UNTRUSTED_SKIPPED: ${{ steps.untrusted.outputs.skipped }}
          UNTRUSTED_COUNT: ${{ steps.untrusted.outputs.component_count }}
          WRONG_OUTCOME: ${{ steps.wrong-manager.outcome }}
          SPEC99_OUTCOME: ${{ steps.spec99.outcome }}
        run: |
          # Verify the python backend options
          failures=0
          fail() {
            echo "$1 ❌"
            failures=1
          }
          root_edges() {
            jq -r '
              ([.components[] | {key: .["bom-ref"], value: .name}]
                | from_entries) as $n
              | .metadata.component["bom-ref"] as $ref
              | [.dependencies[] | select($ref != null and .ref == $ref)
                | .dependsOn[]? | $n[.]] | sort | join(",")' "$1"
          }

          # A real uv project: the root is the project, its one direct
          # dependency is typer, and the tooling stays out
          [ "${REAL_MANAGER}" = "uv" ] || \
            fail "Real project detected as '${REAL_MANAGER}'"
          [ "$(jq -r '.metadata.component.name' "${REAL_JSON}")" = \
            "lfreleng-test-python-project" ] || \
            fail "Real project root is not the project"
          [ "$(root_edges "${REAL_JSON}")" = "typer" ] || \
            fail "Real project root depends on '$(root_edges "${REAL_JSON}")'"
          if jq -e '[.components[].name]
            | any(test("^(cyclonedx-|pip$|uv$|setuptools$)"))' \
            "${REAL_JSON}" > /dev/null; then
            fail "Tooling packages leaked into the real project's SBOM"
          fi
          litter="$(git -C test-project status --porcelain --ignored)"
          [ -z "${litter}" ] || fail "Real project checkout changed: ${litter}"

          # Formats and specification versions
          [ -z "${XML_JSON}" ] || fail "XML-only run emitted a JSON path"
          [ -f "${XML_XML}" ] || fail "XML-only run wrote no XML"
          [ "$(jq -r .specVersion "${SPEC16_JSON}")" = "1.6" ] || \
            fail "Spec 1.6 run declared another version"

          # Dynamic dependencies: edges from the installed metadata,
          # kept where the marker holds with no extra selected
          [ "$(jq -r '.metadata.component.name' "${DYNAMIC_JSON}")" = \
            "dynamic-fixture" ] || fail "Dynamic fixture has no root"
          [ "$(jq -r '[.components[].name] | sort | join(",")' \
            "${DYNAMIC_JSON}")" = "iniconfig,python-dateutil,six,toml" ] \
            || fail "Dynamic fixture did not install what it declares"
          [ "$(root_edges "${DYNAMIC_JSON}")" = \
            "iniconfig,python-dateutil" ] || \
            fail "Dynamic root depends on '$(root_edges "${DYNAMIC_JSON}")'"
          # Static dependencies get the same marker evaluation
          [ "$(root_edges "${MARKERS_JSON}")" = \
            "iniconfig,python-dateutil" ] || \
            fail "Static root depends on '$(root_edges "${MARKERS_JSON}")'"
          [ "${REQUIRES_PYTHON_OUTCOME}" = "failure" ] || \
            fail "An unsupported requires-python did not fail"
          # uv honours python_version over the fixture's .python-version:
          # on the default 3.12, iniconfig's marker fails, so it never
          # installs, and six's holds, so six is a direct dependency.
          # On the 3.14 the fixture names, it would be the reverse.
          [ "$(jq -r '[.components[].name] | sort | join(",")' \
            "${UV_PINNED_JSON}")" = "python-dateutil,six" ] \
            || fail "uv ignored python_version: $(jq -c \
              '[.components[].name]' "${UV_PINNED_JSON}")"
          [ "$(root_edges "${UV_PINNED_JSON}")" = \
            "python-dateutil,six" ] || \
            fail "uv-pinned root depends on '$(root_edges "${UV_PINNED_JSON}")'"
          # A python_version the project rejects fails fast; one it
          # accepts builds
          [ "${UV_UNSATISFIABLE_OUTCOME}" = "failure" ] || \
            fail "An unsatisfiable python_version gave" \
              "'${UV_UNSATISFIABLE_OUTCOME}'"
          [ "$(jq -r '[.components[].name] | join(",")' \
            "${UV_SATISFYING_JSON}")" = "iniconfig" ] || \
            fail "python_version 3.14 did not build the uv-requires fixture"
          # And uv never fetched an interpreter of its own
          managed="${UV_PYTHON_INSTALL_DIR:-${HOME}/.local/share/uv/python}"
          if compgen -G "${managed}/cpython-*" > /dev/null; then
            fail "uv downloaded a Python: $(ls "${managed}")"
          fi
          # include_dev 'false' leaves out every default group, not
          # 'dev' alone
          [ "$(jq -r '[.components[].name] | sort | join(",")' \
            "${UV_GROUPS_JSON}")" = "iniconfig" ] || \
            fail "uv default groups reached the SBOM: $(jq -c \
              '[.components[].name]' "${UV_GROUPS_JSON}")"
          # An inherited PYTHONPATH reaches neither the package manager
          # nor the scan, nor the interpreter the scan starts
          [ "$(jq -r '[.components[].name] | sort | join(",")' \
            "${PYTHONPATH_JSON}")" = "iniconfig,python-dateutil,six" ] \
            || fail "PYTHONPATH added components to the SBOM"
          [ ! -e python-fixtures/hijack-ran.txt ] || \
            fail "A package on PYTHONPATH replaced the package manager"
          [ "$(jq -r '[.components[].name] | sort | join(",")' \
            "${DEV_GROUP_JSON}")" = "iniconfig,pluggy" ] || \
            fail "The 'Dev' group was not installed under include_dev"
          [ "$(jq -r '[.components[].name] | sort | join(",")' \
            "${DEV_REQUIREMENTS_JSON}")" = "iniconfig,pluggy" ] || \
            fail "requirements-dev.txt was not installed under include_dev"

          # Edges follow the requirements that apply: none from pluggy
          # to pytest, whose marker needs an extra nobody requested;
          # requests to PySocks, whose extra the root requested; and
          # pytest to pluggy, unconditionally
          edges_of() {
            jq -r --arg from "$2" '
              ([.components[] | {key: .["bom-ref"], value: .name}]
                | from_entries) as $n
              | ([.components[] | select(.name == $from)
                | .["bom-ref"]] | first) as $ref
              | [.dependencies[] | select(.ref == $ref)
                | .dependsOn[]? | $n[.]] | sort | join(",")' "$1"
          }
          [ -z "$(edges_of "${EXTRAS_JSON}" pluggy)" ] || \
            fail "pluggy depends on '$(edges_of "${EXTRAS_JSON}" pluggy)'"
          case ",$(edges_of "${EXTRAS_JSON}" requests)," in
            *,PySocks,*) ;;
            *) fail "requests lost its requested socks extra" ;;
          esac
          case ",$(edges_of "${EXTRAS_JSON}" pytest)," in
            *,pluggy,*) ;;
            *) fail "pytest lost its edge to pluggy" ;;
          esac
          [ "$(root_edges "${EXTRAS_JSON}")" = "pluggy,requests" ] || \
            fail "Extras root depends on '$(root_edges "${EXTRAS_JSON}")'"
          # The XML comes from the same finished document: same
          # serial number, and the same edge count
          json_serial="$(jq -r .serialNumber "${EXTRAS_JSON}")"
          json_edges="$(jq '[.dependencies[].dependsOn[]?] | length' \
            "${EXTRAS_JSON}")"
          xml_edges="$(python3 -c 'import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          ns = root.tag.split("}")[0] + "}"
          path = "/".join(ns + tag for tag in ("dependencies",
            "dependency", "dependency"))
          print(len(root.findall(path)))' "${EXTRAS_XML}")"
          grep -qF "serialNumber=\"${json_serial}\"" "${EXTRAS_XML}" || \
            fail "The XML document is not the JSON one's"
          [ "${xml_edges}" = "${json_edges}" ] || \
            fail "XML has ${xml_edges} edges, JSON ${json_edges}"
          # An extra a distribution requests of itself still counts
          [ "$(edges_of "${AGGREGATE_JSON}" bundle-fixture)" = \
            "transport-fixture" ] || \
            fail "bundle-fixture lost the edge its 'all' extra implies"
          # A dev tool's extra request reaches neither requests' edges
          # nor the runtime graph, while its own edge stays
          case ",$(edges_of "${DEV_EXTRAS_JSON}" requests)," in
            *,PySocks,*) fail "A dev tool's extra became runtime" ;;
          esac
          [ "$(edges_of "${DEV_EXTRAS_JSON}" devtool-fixture)" = \
            "requests" ] || fail "devtool-fixture lost its edge to requests"
          if jq -e '.components[] | select(.name == "requests")
            | .properties[]? | select(.value == "socks")' \
            "${DEV_EXTRAS_JSON}" > /dev/null; then
            fail "A dev tool's extra was recorded as required at runtime"
          fi
          jq -e '[.components[].name] | index("PySocks")' \
            "${DEV_EXTRAS_JSON}" > /dev/null || \
            fail "PySocks is missing from the components"
          # Both directions between the project and its plugin hold,
          # and the extra the plugin requests of the project reaches
          # the project's edges and on through them
          [ "$(root_edges "${CYCLE_JSON}")" = \
            "cycle-plugin,transport-fixture" ] || \
            fail "cycle-app root depends on '$(root_edges "${CYCLE_JSON}")'"
          [ "$(edges_of "${CYCLE_JSON}" transport-fixture)" = \
            "iniconfig" ] || \
            fail "transport-fixture lost the edge its socks extra implies"
          jq -e --arg root "$(jq -r '.metadata.component["bom-ref"]' \
            "${CYCLE_JSON}")" '
            ([.components[] | select(.name == "cycle-plugin")
              | .["bom-ref"]] | first) as $plugin
            | [.dependencies[] | select(.ref == $plugin)
              | .dependsOn[]?] | index($root)' "${CYCLE_JSON}" \
            > /dev/null || fail "cycle-plugin lost its edge to the project"
          # 1.2 carries no properties, and requests keeps its extra edge
          if jq -e '[.. | objects | select(has("properties"))] | length > 0' \
            "${SPEC12_JSON}" > /dev/null; then
            fail "A CycloneDX 1.2 document carries properties"
          fi
          case ",$(edges_of "${SPEC12_JSON}" requests)," in
            *,PySocks,*) ;;
            *) fail "requests lost its socks extra at CycloneDX 1.2" ;;
          esac
          # Every run above started from the workspace beside venv.py
          # and pip.py; isolated mode kept both out
          [ ! -e shadow-ran.txt ] || \
            fail "A checkout module shadowed one the action runs"

          # The scrub: setup.py ran, and saw none of the secrets
          [ -f "${SPY_JSON}" ] || fail "Spy fixture produced no SBOM"
          spy=python-fixtures/spy/spy-env.txt
          if [ ! -s "${spy}" ]; then
            fail "The spy's setup.py never ran"
          else
            for name in TWINE_PASSWORD UV_PUBLISH_TOKEN \
              POETRY_PYPI_TOKEN_PYPI ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN \
              GITHUB_OUTPUT GITHUB_ENV GITHUB_PATH GITHUB_STATE \
              GITHUB_STEP_SUMMARY; do
              if grep -qx "${name}" "${spy}"; then
                fail "${name} reached code from the checkout"
              fi
            done
            grep -qx PIP_INDEX_URL "${spy}" || \
              fail "The scrub removed an index setting"
          fi

          # Skips and failures publish nothing
          [ "${UNTRUSTED_SKIPPED}" = "true" ] || \
            fail "An untrusted Python checkout was not skipped"
          [ -z "${UNTRUSTED_COUNT}" ] || fail "Skipped run reported a count"
          [ "${WRONG_OUTCOME}" = "failure" ] || \
            fail "A wrong declared manager did not fail"
          [ "${SPEC99_OUTCOME}" = "failure" ] || \
            fail "CycloneDX 9.9 did not fail"
          for prefix in sbom-untrusted sbom-wrong sbom-spec99 \
            sbom-requires-python sbom-uv-unsatisfiable; do
            [ -z "$(find python-out -name "${prefix}.*")" ] || \
              fail "${prefix}: a document survived a failed or skipped run"
          done

          if [ "${failures}" != "0" ]; then
            echo "Python options verification failed ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Python backend options verified ✅"
          echo "Python backend options verified ✅" >> "$GITHUB_STEP_SUMMARY"

  ### Test invalid inputs fail closed ###
  test-failures:
    name: "Test: invalid inputs and error handling"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5 # v0.13.1
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22' # v0.17.1

      # Harden the runner with the just-loaded allow-list.
      - name: "Harden runner (block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Running local action with unsupported backend"
        id: bad-backend
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx-npm

      - name: "Running local action with invalid format"
        id: bad-format
        continue-on-error: true
        uses: $/
        with:
          sbom_format: yaml

      - name: "Running local action with missing project directory"
        id: bad-path
        continue-on-error: true
        uses: $/
        with:
          path_prefix: does/not/exist

      - name: "Running local action with workspace-escaping path"
        id: escape-path
        continue-on-error: true
        uses: $/
        with:
          path_prefix: /etc

      - name: "Running local action with escaping output directory"
        id: escape-output
        continue-on-error: true
        uses: $/
        with:
          output_directory: /opt/escape-test

      - name: "Running local action with unsafe filename prefix"
        id: bad-prefix
        continue-on-error: true
        uses: $/
        with:
          filename_prefix: '../escape'

      # Image mode's own inputs. The archive directory is required in
      # that mode and refused outside it, so a forgotten mode cannot
      # quietly produce an SBOM of the workspace instead.
      - name: "Running local action with unsupported mode"
        id: bad-mode
        continue-on-error: true
        uses: $/
        with:
          mode: layers

      - name: "Running local action with image mode and no archives"
        id: image-no-directory
        continue-on-error: true
        uses: $/
        with:
          mode: image

      - name: "Running local action with an archive directory alone"
        id: directory-with-archives
        continue-on-error: true
        uses: $/
        with:
          image_archive_directory: '.'

      - name: "Running local action with image mode on cyclonedx"
        id: image-cyclonedx
        continue-on-error: true
        uses: $/
        with:
          mode: image
          backend: cyclonedx
          image_archive_directory: '.'

      - name: "Running local action with escaping archive directory"
        id: image-escape
        continue-on-error: true
        uses: $/
        with:
          mode: image
          image_archive_directory: /etc

      # The cyclonedx-backend inputs feed a Maven goal coordinate and
      # a setup-java invocation, so they get validated on every run
      # rather than only when that backend is selected
      - name: "Running local action with invalid java version"
        id: bad-java-version
        continue-on-error: true
        uses: $/
        with:
          java_version: '21; rm -rf /'

      - name: "Running local action with invalid java distribution"
        id: bad-java-distribution
        continue-on-error: true
        uses: $/
        with:
          java_distribution: 'Temurin$(id)'

      - name: "Running local action with invalid plugin version"
        id: bad-plugin-version
        continue-on-error: true
        uses: $/
        with:
          maven_plugin_version: 'latest'

      # Syntactically valid but unusable: releases before 2.8.0 do not
      # bind -DoutputDirectory, so the BOM would land in the project's
      # target directory instead of the requested location
      - name: "Running local action with an outdated plugin version"
        id: old-plugin-version
        continue-on-error: true
        uses: $/
        with:
          maven_plugin_version: '2.7.5'

      # The Cargo tool versions become taiki-e/install-action tool
      # specifications and cargo_target a cargo-cyclonedx argument, so
      # they too are validated on every run
      - name: "Running local action with invalid cargo-cyclonedx version"
        id: bad-cargo-cyclonedx-version
        continue-on-error: true
        uses: $/
        with:
          cargo_cyclonedx_version: '0.5.9,cargo-audit'

      # Releases before 0.5.5 lack --no-build-deps, which carries the
      # default include_dev: false
      - name: "Running local action with an outdated cargo-cyclonedx"
        id: old-cargo-cyclonedx-version
        continue-on-error: true
        uses: $/
        with:
          cargo_cyclonedx_version: '0.5.4'

      - name: "Running local action with invalid cyclonedx-cli version"
        id: bad-cyclonedx-cli-version
        continue-on-error: true
        uses: $/
        with:
          cyclonedx_cli_version: 'latest'

      - name: "Running local action with invalid cargo target"
        id: bad-cargo-target
        continue-on-error: true
        uses: $/
        with:
          cargo_target: '--config=build.rustc-wrapper=x'

      # cargo_features becomes a cargo-cyclonedx argument too. The first
      # entry is valid, so this proves every entry is checked.
      - name: "Running local action with invalid cargo features"
        id: bad-cargo-features
        continue-on-error: true
        uses: $/
        with:
          cargo_features: 'serde --config=build.rustc-wrapper=x'

      - name: "Running local action with invalid cargo_all_features"
        id: bad-cargo-all-features
        continue-on-error: true
        uses: $/
        with:
          cargo_all_features: 'yes'

      - name: "Running local action with invalid cargo_no_default_features"
        id: bad-cargo-no-default-features
        continue-on-error: true
        uses: $/
        with:
          cargo_no_default_features: 'TRUE'
      # python_version reaches setup-python and cyclonedx_py_version a
      # pip requirement, so both are validated on every run too
      - name: "Running local action with invalid python version"
        id: bad-python-version
        continue-on-error: true
        uses: $/
        with:
          python_version: '3.12; id'

      # End of life, and below what the package managers require
      - name: "Running local action with a python version below 3.10"
        id: old-python-version
        continue-on-error: true
        uses: $/
        with:
          python_version: '3.9'

      - name: "Running local action with invalid cyclonedx-py version"
        id: bad-cyclonedx-py-version
        continue-on-error: true
        uses: $/
        with:
          cyclonedx_py_version: '7.5.0,<8'

      # Releases before 4.0.0 lack the 'environment' subcommand
      - name: "Running local action with an outdated cyclonedx-py"
        id: old-cyclonedx-py-version
        continue-on-error: true
        uses: $/
        with:
          cyclonedx_py_version: '3.11.7'

      # A package manager belongs to the python backend, and a build
      # tool to the cyclonedx backend
      - name: "Running local action with a manager from another backend"
        id: manager-backend-mismatch
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          dependency_manager: uv

      # This repository's root has no lock file, requirements file or
      # pyproject.toml, so detection must fail rather than scanning an
      # empty environment
      - name: "Running python backend with no Python project present"
        id: no-python-project
        continue-on-error: true
        uses: $/
        with:
          backend: python
          untrusted_checkout: 'false'

      # The cyclonedx backend names the tool, not the build system, so
      # it has to detect one. This repository has no pom.xml, Gradle
      # build script or Cargo.toml, so detection must fail rather than
      # falling through to a Maven invocation that cannot work.
      # untrusted_checkout is forced off so the run reaches detection:
      # this workflow runs on a fork pull request, where the default
      # would skip before getting there.
      - name: "Running cyclonedx backend with no build tool present"
        id: no-build-tool
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'

      # Plant a document at the destination so the assertion below
      # proves the skip CLEARS it, rather than merely proving the
      # action wrote nothing. A repository can legitimately commit an
      # sbom-*.json, and the caller's artifact glob would publish it.
      # It has to be a STRUCTURALLY valid BOM: the classification
      # check requires the schema's mandatory bomFormat/specVersion/
      # version triple before it will replace an existing file.
      - name: "Plant a stale document at the skip destination"
        shell: bash
        run: |
          # Plant a stale document at the skip destination
          printf '%s%s\n' \
            '{"bomFormat":"CycloneDX","specVersion":"1.5",' \
            '"version":1,"components":[]}' \
            > sbom-untrusted.json

      # The default must SKIP rather than run, fail, or quietly fall
      # back to syft. untrusted_checkout is declared explicitly rather
      # than relying on 'auto': this workflow also runs on pushes to
      # main and same-repository pull requests, where 'auto' resolves
      # to trusted and the action would instead fail on this
      # repository having no Maven, Gradle or Cargo build. The
      # detection itself is covered by the validation matrix, not here.
      - name: "Running cyclonedx backend on an untrusted checkout"
        id: untrusted-skip
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'true'
          filename_prefix: sbom-untrusted

      # Coverage for the 'auto' default itself, which the deterministic
      # cases above deliberately bypass. Each direction is asserted on
      # the event where its outcome is determinate, and skipped
      # otherwise, so neither can pass vacuously.
      - name: "Auto on a fork PR must resolve untrusted"
        id: auto-fork
        # yamllint disable-line rule:line-length
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: $/
        with:
          backend: cyclonedx
          filename_prefix: sbom-auto-fork

      - name: "Auto outside a fork PR must resolve trusted"
        id: auto-trusted
        # yamllint disable-line rule:line-length
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          filename_prefix: sbom-auto-trusted

      # Maven can exit 0 having written nothing: cyclonedx.skip is a
      # user property a consumer POM can set. The action must treat
      # that as a generation failure rather than aborting under set -e
      # or reporting success over no document.
      - name: "Create a POM that disables the plugin"
        shell: bash
        run: |
          # Create a POM that disables the plugin
          mkdir -p skip-pom
          cat > skip-pom/pom.xml <<'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.lfreleng.test</groupId>
            <artifactId>skip-pom</artifactId>
            <version>1.0.0</version>
            <packaging>pom</packaging>
            <properties>
              <cyclonedx.skip>true</cyclonedx.skip>
            </properties>
          </project>
          POMEOF

      - name: "Plugin disabled by the POM (hard fail)"
        id: pom-skip-hard
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: skip-pom
          sbom_format: json
          filename_prefix: sbom-pomskip-hard

      - name: "Plugin disabled by the POM (soft fail)"
        id: pom-skip-soft
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: skip-pom
          sbom_format: json
          filename_prefix: sbom-pomskip-soft
          fail_on_error: 'false'

      # The destinations derive from filename_prefix and
      # output_directory, both caller-controlled and both defaulting
      # into the workspace. Clearing them must never unlink a project
      # file: 'pom' would resolve to pom.xml, 'package' to
      # package.json. A collision with a non-SBOM file has to be
      # refused rather than removed.
      # GitHub-hosted runners do not ship xmllint, so without this the
      # XML collision test would exit at the missing-tool check and
      # never reach the XPath classifier it exists to cover - passing
      # for the wrong reason. The archive host is in the shared
      # allow-list.
      - name: "Install xmllint for the XML classification test"
        shell: bash
        run: |
          # Install xmllint for the XML classification test
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          xmllint --version 2>&1 | head -1

      - name: "Create a file the destination would collide with"
        shell: bash
        run: |
          # Create a file the destination would collide with
          printf 'not an sbom\n' > collide.json
          # A bomFormat key alone does not make a file a BOM. This
          # decoy is package.json-shaped: it declares the key, but its
          # version is a string where a BOM's is a number, so the
          # structural check must still refuse it.
          printf '{"name":"x","version":"1.0.0","bomFormat":"CycloneDX"}\n' \
            > decoyjson.json
          # A POM declaring cyclonedx-maven-plugin contains the word
          # 'cyclonedx'. A substring test would treat it as a BOM and
          # delete it, so the XML check parses the document element's
          # namespace and local name instead. Comments carrying the
          # schema URL and a <bom> must not fool it either.
          cat > decoy.xml <<'DECOYEOF'
          <?xml version="1.0"?>
          <!-- https://cyclonedx.org/schema/bom/1.6 -->
          <project>
            <!-- <bom> -->
            <build><plugins><plugin>
              <groupId>org.cyclonedx</groupId>
              <artifactId>cyclonedx-maven-plugin</artifactId>
            </plugin></plugins></build>
          </project>
          DECOYEOF
          # A broken symlink fails an -e test. Left in place, the
          # backend would write through it to a path outside the
          # validated output directory.
          ln -s /tmp/sbom-action-no-such-target dangling.json

      - name: "Destination collides with a non-SBOM file"
        id: collide
        continue-on-error: true
        uses: $/
        with:
          sbom_format: json
          filename_prefix: collide

      - name: "Destination collides with a POM naming the plugin"
        id: collide-decoy
        continue-on-error: true
        uses: $/
        with:
          sbom_format: xml
          filename_prefix: decoy

      - name: "Destination collides with a bomFormat-only JSON file"
        id: collide-decoyjson
        continue-on-error: true
        uses: $/
        with:
          sbom_format: json
          filename_prefix: decoyjson

      - name: "Destination is a dangling symlink"
        id: collide-symlink
        continue-on-error: true
        uses: $/
        with:
          sbom_format: json
          filename_prefix: dangling

      # The decoys above only prove the classifier REFUSES. This proves
      # it still accepts: a genuine CycloneDX XML document at the
      # destination must be replaced, or the guard would block every
      # legitimate rerun. Needs the xmllint installed above.
      - name: "Plant a genuine XML BOM at a destination"
        shell: bash
        run: |
          # Plant a genuine XML BOM at a destination
          mkdir -p replace-xml
          printf '%s\n%s\n' \
            '<?xml version="1.0"?>' \
            '<bom xmlns="http://cyclonedx.org/schema/bom/1.5"/>' \
            > replace-xml/sbom-cyclonedx.xml

      - name: "Genuine XML BOM at the destination is replaced"
        id: replace-xml
        continue-on-error: true
        uses: $/
        with:
          sbom_format: xml
          output_directory: replace-xml

      # A POM the plugin will actually act on, unlike skip-pom. The
      # inherited-MAVEN_ARGS test needs a run that SUCCEEDS when the
      # reserved name is shadowed, so that a leak - which would send
      # Maven to a non-existent POM - flips the outcome and fails the
      # assertion. Against skip-pom both cases fail and the test could
      # not tell them apart.
      - name: "Create a POM the plugin will act on"
        shell: bash
        run: |
          # Create a POM the plugin will act on
          mkdir -p live-pom
          cat > live-pom/pom.xml <<'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.lfreleng.test</groupId>
            <artifactId>live-pom</artifactId>
            <version>1.0.0</version>
            <packaging>pom</packaging>
          </project>
          POMEOF

      # An inherited MAVEN_ARGS reaches Maven without passing through
      # the input validation, so the action shadows the reserved name.
      # Set here at step level, which is exactly how a caller's
      # workflow or job env would leak in.
      - name: "Inherited MAVEN_ARGS must not reach Maven"
        id: inherited-maven-args
        continue-on-error: true
        env:
          MAVEN_ARGS: '-f /tmp/elsewhere/pom.xml'
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: live-pom
          sbom_format: json
          filename_prefix: sbom-inherited

      - name: "Verify the colliding files survived"
        shell: bash
        run: |
          # Verify the colliding files survived
          errors=0
          if [ ! -f collide.json ] || \
            ! grep -q 'not an sbom' collide.json; then
            echo "A non-SBOM file at the destination was removed ❌"
            errors=1
          fi
          if [ ! -f decoy.xml ] || \
            ! grep -q 'cyclonedx-maven-plugin' decoy.xml; then
            echo "A POM naming the plugin was removed ❌"
            errors=1
          fi
          if [ ! -f decoyjson.json ] || \
            ! grep -q '"name":"x"' decoyjson.json; then
            echo "A bomFormat-only JSON file was removed ❌"
            errors=1
          fi
          if [ ! -L dangling.json ]; then
            echo "A dangling symlink destination was removed ❌"
            errors=1
          fi
          if [ "${errors}" != "0" ]; then
            exit 1
          fi
          echo "Colliding files left intact ✅"

      - name: "Running local action with maven_args override"
        id: bad-maven-args
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          # Pointed at the skip-pom fixture, not the repository root:
          # at the root the run would fail on 'no Maven, Gradle or Cargo
          # project found' and the outcome assertion would pass
          # without ever reaching the maven_args normalisation.
          #
          # skip=false rather than true so the assertion discriminates.
          # The fixture POM sets cyclonedx.skip true; if normalisation
          # regressed and this argument slipped through, it would
          # override that and generation would SUCCEED, failing the
          # test. A value of true would merely produce no document,
          # which already fails for an unrelated reason.
          path_prefix: skip-pom
          maven_args: '--define cyclonedx.skip=false'

      - name: "Running local action with an alternate POM"
        id: bad-maven-file
        continue-on-error: true
        uses: $/
        with:
          backend: cyclonedx
          untrusted_checkout: 'false'
          path_prefix: skip-pom
          maven_args: '-f /tmp/elsewhere/pom.xml'

      # An unsupported CycloneDX spec version passes input validation
      # (digits and dots) but makes the syft scan itself fail,
      # exercising the fail_on_error handling paths
      - name: "Running local action with syft failure (soft fail)"
        id: soft-fail
        continue-on-error: true
        uses: $/
        with:
          sbom_spec_version: '9.9'
          fail_on_error: false

      - name: "Running local action with syft failure (hard fail)"
        id: hard-fail
        continue-on-error: true
        uses: $/
        with:
          sbom_spec_version: '9.9'

      - name: "Verify invalid inputs were rejected"
        shell: bash
        env:
          BACKEND_OUTCOME: ${{ steps.bad-backend.outcome }}
          FORMAT_OUTCOME: ${{ steps.bad-format.outcome }}
          PATH_OUTCOME: ${{ steps.bad-path.outcome }}
          ESCAPE_OUTCOME: ${{ steps.escape-path.outcome }}
          OUTPUT_ESCAPE_OUTCOME: ${{ steps.escape-output.outcome }}
          PREFIX_OUTCOME: ${{ steps.bad-prefix.outcome }}
          MODE_OUTCOME: ${{ steps.bad-mode.outcome }}
          IMAGE_NO_DIR_OUTCOME: ${{ steps.image-no-directory.outcome }}
          # yamllint disable-line rule:line-length
          DIR_WITH_ARCHIVES_OUTCOME: ${{ steps.directory-with-archives.outcome }}
          IMAGE_CYCLONEDX_OUTCOME: ${{ steps.image-cyclonedx.outcome }}
          IMAGE_ESCAPE_OUTCOME: ${{ steps.image-escape.outcome }}
          JAVA_VERSION_OUTCOME: ${{ steps.bad-java-version.outcome }}
          # yamllint disable-line rule:line-length
          JAVA_DISTRIBUTION_OUTCOME: ${{ steps.bad-java-distribution.outcome }}
          PLUGIN_VERSION_OUTCOME: ${{ steps.bad-plugin-version.outcome }}
          OLD_PLUGIN_OUTCOME: ${{ steps.old-plugin-version.outcome }}
          # yamllint disable-line rule:line-length
          CARGO_CDX_VERSION_OUTCOME: ${{ steps.bad-cargo-cyclonedx-version.outcome }}
          # yamllint disable-line rule:line-length
          OLD_CARGO_CDX_OUTCOME: ${{ steps.old-cargo-cyclonedx-version.outcome }}
          # yamllint disable-line rule:line-length
          CDX_CLI_VERSION_OUTCOME: ${{ steps.bad-cyclonedx-cli-version.outcome }}
          CARGO_TARGET_OUTCOME: ${{ steps.bad-cargo-target.outcome }}
          CARGO_FEATURES_OUTCOME: ${{ steps.bad-cargo-features.outcome }}
          # yamllint disable-line rule:line-length
          CARGO_ALL_FEATURES_OUTCOME: ${{ steps.bad-cargo-all-features.outcome }}
          # yamllint disable-line rule:line-length
          CARGO_NO_DEFAULT_OUTCOME: ${{ steps.bad-cargo-no-default-features.outcome }}
          # yamllint disable-line rule:line-length
          PYTHON_VERSION_OUTCOME: ${{ steps.bad-python-version.outcome }}
          # yamllint disable-line rule:line-length
          OLD_PYTHON_VERSION_OUTCOME: ${{ steps.old-python-version.outcome }}
          # yamllint disable-line rule:line-length
          CDX_PY_VERSION_OUTCOME: ${{ steps.bad-cyclonedx-py-version.outcome }}
          # yamllint disable-line rule:line-length
          OLD_CDX_PY_OUTCOME: ${{ steps.old-cyclonedx-py-version.outcome }}
          # yamllint disable-line rule:line-length
          MANAGER_MISMATCH_OUTCOME: ${{ steps.manager-backend-mismatch.outcome }}
          NO_PYTHON_OUTCOME: ${{ steps.no-python-project.outcome }}
          NO_BUILD_TOOL_OUTCOME: ${{ steps.no-build-tool.outcome }}
          SKIP_OUTCOME: ${{ steps.untrusted-skip.outcome }}
          SKIP_SKIPPED: ${{ steps.untrusted-skip.outputs.skipped }}
          SKIP_JSON: ${{ steps.untrusted-skip.outputs.sbom_json_path }}
          SKIP_COUNT: ${{ steps.untrusted-skip.outputs.component_count }}
          AUTO_FORK_OUTCOME: ${{ steps.auto-fork.outcome }}
          AUTO_FORK_SKIPPED: ${{ steps.auto-fork.outputs.skipped }}
          AUTO_TRUSTED_OUTCOME: ${{ steps.auto-trusted.outcome }}
          AUTO_TRUSTED_SKIPPED: ${{ steps.auto-trusted.outputs.skipped }}
          POM_SKIP_HARD_OUTCOME: ${{ steps.pom-skip-hard.outcome }}
          POM_SKIP_SOFT_OUTCOME: ${{ steps.pom-skip-soft.outcome }}
          # yamllint disable-line rule:line-length
          POM_SKIP_SOFT_COUNT: ${{ steps.pom-skip-soft.outputs.component_count }}
          COLLIDE_OUTCOME: ${{ steps.collide.outcome }}
          COLLIDE_DECOY_OUTCOME: ${{ steps.collide-decoy.outcome }}
          # yamllint disable-line rule:line-length
          COLLIDE_DECOYJSON_OUTCOME: ${{ steps.collide-decoyjson.outcome }}
          COLLIDE_SYMLINK_OUTCOME: ${{ steps.collide-symlink.outcome }}
          BAD_MAVEN_ARGS_OUTCOME: ${{ steps.bad-maven-args.outcome }}
          BAD_MAVEN_FILE_OUTCOME: ${{ steps.bad-maven-file.outcome }}
          REPLACE_XML_OUTCOME: ${{ steps.replace-xml.outcome }}
          REPLACE_XML_PATH: ${{ steps.replace-xml.outputs.sbom_xml_path }}
          # yamllint disable-line rule:line-length
          INHERITED_ARGS_OUTCOME: ${{ steps.inherited-maven-args.outcome }}
          HARD_FAIL_OUTCOME: ${{ steps.hard-fail.outcome }}
          SOFT_FAIL_OUTCOME: ${{ steps.soft-fail.outcome }}
          SOFT_FAIL_COUNT: ${{ steps.soft-fail.outputs.component_count }}
        run: |
          # Failure testing is also important; all steps MUST fail
          errors=0
          for outcome_pair in \
            "backend:${BACKEND_OUTCOME}" \
            "format:${FORMAT_OUTCOME}" \
            "path:${PATH_OUTCOME}" \
            "escape:${ESCAPE_OUTCOME}" \
            "output-escape:${OUTPUT_ESCAPE_OUTCOME}" \
            "prefix:${PREFIX_OUTCOME}" \
            "mode:${MODE_OUTCOME}" \
            "image-no-directory:${IMAGE_NO_DIR_OUTCOME}" \
            "directory-with-archives:${DIR_WITH_ARCHIVES_OUTCOME}" \
            "image-cyclonedx:${IMAGE_CYCLONEDX_OUTCOME}" \
            "image-escape:${IMAGE_ESCAPE_OUTCOME}" \
            "java-version:${JAVA_VERSION_OUTCOME}" \
            "java-distribution:${JAVA_DISTRIBUTION_OUTCOME}" \
            "plugin-version:${PLUGIN_VERSION_OUTCOME}" \
            "old-plugin:${OLD_PLUGIN_OUTCOME}" \
            "cargo-cyclonedx-version:${CARGO_CDX_VERSION_OUTCOME}" \
            "old-cargo-cyclonedx:${OLD_CARGO_CDX_OUTCOME}" \
            "cyclonedx-cli-version:${CDX_CLI_VERSION_OUTCOME}" \
            "cargo-target:${CARGO_TARGET_OUTCOME}" \
            "cargo-features:${CARGO_FEATURES_OUTCOME}" \
            "cargo-all-features:${CARGO_ALL_FEATURES_OUTCOME}" \
            "cargo-no-default-features:${CARGO_NO_DEFAULT_OUTCOME}" \
            "python-version:${PYTHON_VERSION_OUTCOME}" \
            "old-python-version:${OLD_PYTHON_VERSION_OUTCOME}" \
            "cyclonedx-py-version:${CDX_PY_VERSION_OUTCOME}" \
            "old-cyclonedx-py:${OLD_CDX_PY_OUTCOME}" \
            "manager-backend-mismatch:${MANAGER_MISMATCH_OUTCOME}" \
            "no-python-project:${NO_PYTHON_OUTCOME}" \
            "no-build-tool:${NO_BUILD_TOOL_OUTCOME}" \
            "collide:${COLLIDE_OUTCOME}" \
            "collide-decoy:${COLLIDE_DECOY_OUTCOME}" \
            "collide-decoyjson:${COLLIDE_DECOYJSON_OUTCOME}" \
            "collide-symlink:${COLLIDE_SYMLINK_OUTCOME}" \
            "maven-args-define:${BAD_MAVEN_ARGS_OUTCOME}" \
            "maven-args-file:${BAD_MAVEN_FILE_OUTCOME}" \
            "hard-fail:${HARD_FAIL_OUTCOME}"; do
            test_name="${outcome_pair%%:*}"
            outcome="${outcome_pair#*:}"
            if [ "${outcome}" = "success" ]; then
              echo "Invalid ${test_name} unexpectedly succeeded ❌"
              errors=1
            fi
          done
          # With fail_on_error false, a syft failure must NOT fail the
          # action, and component_count must report zero
          if [ "${SOFT_FAIL_OUTCOME}" != "success" ]; then
            echo "Soft-fail path unexpectedly failed ❌"
            errors=1
          fi
          if [ "${SOFT_FAIL_COUNT}" != "0" ]; then
            echo "Soft-fail component_count not zero ❌"
            errors=1
          fi
          # An untrusted checkout must SKIP, not fail and not produce a
          # document. Failing would red-build a contribution over
          # something the contributor cannot fix; producing anything
          # would risk a partial SBOM reading as a clean scan.
          if [ "${SKIP_OUTCOME}" != "success" ]; then
            echo "Untrusted checkout failed instead of skipping ❌"
            errors=1
          fi
          if [ "${SKIP_SKIPPED}" != "true" ]; then
            echo "skipped output was '${SKIP_SKIPPED}', wanted true ❌"
            errors=1
          fi
          # Empty rather than zero: a count of 0 could be misread as a
          # scan that found nothing
          if [ -n "${SKIP_JSON}" ] || [ -n "${SKIP_COUNT}" ]; then
            echo "Skipped run reported results ❌"
            echo "  json='${SKIP_JSON}' count='${SKIP_COUNT}'"
            errors=1
          fi
          # A committed or previously generated document must not
          # survive the skip: the caller's artifact glob would publish
          # it as though this run had produced it
          if [ -n "$(find . -maxdepth 1 -name 'sbom-untrusted.*' \
            2>/dev/null)" ]; then
            echo "Skipped run left a document behind ❌"
            errors=1
          fi

          # 'auto' resolution. Each arm runs only on the event where
          # its outcome is determinate; an arm that did not run reports
          # outcome 'skipped', which is not a failure. Both assertions
          # are positive: an action that failed before writing the
          # output leaves it empty, and an empty value must not satisfy
          # the check, or a regression turning the safe skip into a
          # hard failure would pass unnoticed.
          if [ "${AUTO_FORK_OUTCOME}" != "skipped" ]; then
            if [ "${AUTO_FORK_OUTCOME}" != "success" ] || \
              [ "${AUTO_FORK_SKIPPED}" != "true" ]; then
              echo "auto on a fork PR: wanted success+skipped=true," \
                "got ${AUTO_FORK_OUTCOME}+'${AUTO_FORK_SKIPPED}' ❌"
              errors=1
            fi
          fi
          # The trusted arm is expected to FAIL: this repository has no
          # Maven, Gradle or Cargo build, so detection rejects it. What must
          # hold is that validation resolved the checkout as trusted
          # first, which it records as skipped=false before detecting.
          if [ "${AUTO_TRUSTED_OUTCOME}" != "skipped" ]; then
            if [ "${AUTO_TRUSTED_SKIPPED}" != "false" ]; then
              echo "auto outside a fork PR: wanted skipped=false," \
                "got '${AUTO_TRUSTED_SKIPPED}' ❌"
              errors=1
            fi
          fi

          # A plugin disabled by the consumer POM exits 0 writing
          # nothing. That must surface as a generation failure, honour
          # fail_on_error, and leave no document behind.
          if [ "${POM_SKIP_HARD_OUTCOME}" = "success" ]; then
            echo "POM-disabled plugin reported success ❌"
            errors=1
          fi
          if [ "${POM_SKIP_SOFT_OUTCOME}" != "success" ]; then
            echo "POM-disabled plugin ignored fail_on_error: false ❌"
            errors=1
          fi
          if [ "${POM_SKIP_SOFT_COUNT}" != "0" ]; then
            echo "Soft-failed run count was" \
              "'${POM_SKIP_SOFT_COUNT}', wanted 0 ❌"
            errors=1
          fi
          if [ -n "$(find . -maxdepth 1 -name 'sbom-pomskip-*' \
            2>/dev/null)" ]; then
            echo "POM-disabled run left a document behind ❌"
            errors=1
          fi

          # The classifier must still ACCEPT a real document, or every
          # legitimate rerun would be blocked by the guard
          if [ "${REPLACE_XML_OUTCOME}" != "success" ]; then
            echo "Genuine XML BOM at the destination was not" \
              "replaced (${REPLACE_XML_OUTCOME}) ❌"
            errors=1
          fi
          if [ -n "${REPLACE_XML_PATH}" ] && \
            ! grep -q 'cyclonedx.org/schema/bom' \
            "${REPLACE_XML_PATH}" 2> /dev/null; then
            echo "Replacement XML is not a CycloneDX document ❌"
            errors=1
          fi

          # An inherited MAVEN_ARGS bypasses input validation entirely
          # unless the action shadows the reserved name. Shadowed, this
          # run builds live-pom and succeeds; leaked, Maven is sent to
          # a non-existent POM and the run fails. The outcome is the
          # discriminator.
          if [ "${INHERITED_ARGS_OUTCOME}" != "success" ]; then
            echo "Inherited MAVEN_ARGS reached Maven" \
              "(${INHERITED_ARGS_OUTCOME}) ❌"
            errors=1
          fi

          if [ "${errors}" != "0" ]; then
            echo "Failure-path tests failed ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Invalid inputs correctly rejected ✅"
          echo "Invalid inputs correctly rejected ✅" \
            >> "$GITHUB_STEP_SUMMARY"
