# Requires a newer Python than the default python_version, as the
# project in python-sbom-action#151 does: the default must fail fast,
# naming python_version, and python_version 3.14 must succeed.
[project]
name = "sbom-fixture-uv-requires"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = ["iniconfig==2.1.0"]
